<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="design-frame-count" content="3"><meta name="design-export-width" content="1282"><meta name="design-export-height" content="1500"><title>单聊与群聊 · 小镇设计稿</title><style>

.sheet{width:max-content;min-width:390px} .page-head{max-width:960px;margin-bottom:26px} .eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700} h1{font-size:28px;line-height:1.3;letter-spacing:-.5px;margin:8px 0 10px} h2{font-size:20px;line-height:1.4;margin:0} h3{font-size:16px;line-height:1.5;margin:0 0 6px} p{margin:6px 0} .intro{color:#646969;max-width:900px;font-size:14px}.frames{display:flex;align-items:flex-start;gap:24px}.frame{width:390px;flex:none;margin:0}.caption{height:54px;display:flex;align-items:center;gap:10px}.step{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:white;width:28px;height:28px;border-radius:50%;font-size:12px;color:var(--accent)} .caption strong{font-size:15px}.caption small{display:block;color:var(--muted);font-size:11px}
.phone{width:390px;height:844px;border:2px solid #363a39;border-radius:28px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative}.statusbar{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:11px;font-weight:650}.statusbar .pill{width:72px;height:15px;border-radius:15px;background:#333}.topbar{min-height:67px;flex:none;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.topbar small{font-size:11px;color:var(--muted)}.screen{padding:18px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px}.screen.tight{gap:10px;padding:14px 18px}.tabs{height:68px;flex:none;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:#fafafa}.tab{width:25%;text-align:center;color:var(--muted);font-size:11px}.tab b{display:block;font-size:18px;line-height:25px;font-weight:400}.tab.active{color:var(--accent);font-weight:650}.home{height:15px;flex:none;background:#fafafa;position:relative}.home:after{content:"";position:absolute;bottom:5px;left:calc(50% - 48px);width:96px;height:4px;border-radius:4px;background:#333}
.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}.avatar{width:42px;height:42px;flex:none;border:1px solid #d5d8d6;background:#ededeb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:650;color:#525958;position:relative}.avatar.large{width:70px;height:70px;font-size:23px;border-radius:20px}.ai-badge{position:absolute;bottom:-4px;right:-7px;background:var(--accent);color:white;font-size:9px;border:2px solid white;padding:0 4px;border-radius:5px}.muted{color:var(--muted)}.tiny{font-size:11px;line-height:1.6}.small{font-size:12px;line-height:1.65}.tag{display:inline-block;border:1px solid var(--line);background:#f7f8f7;border-radius:5px;padding:2px 6px;font-size:10px;line-height:1.5;vertical-align:middle;color:#606765}.tag.accent{border-color:#b5cdc5;background:var(--soft);color:var(--accent)}.badge{display:inline-flex;justify-content:center;align-items:center;min-width:19px;height:19px;border-radius:10px;padding:0 5px;background:var(--accent);color:white;font-size:11px}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:white}.card.emphasis{border:1.5px solid var(--accent);background:var(--soft)}.note{border-left:3px solid var(--accent);background:var(--soft);padding:10px 12px;font-size:12px;line-height:1.7;color:#485953}.pending{color:#707776;font-size:11px}.pending:before{content:"待定 · ";font-weight:700}.divider{border-top:1px solid var(--line);margin:3px 0}.list-row{padding:14px 0;border-bottom:1px solid var(--line)}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#f5f6f5;font-size:12px;color:var(--muted)}.button{display:block;text-align:center;padding:11px 14px;background:var(--accent);color:white;border-radius:9px;font-size:13px;font-weight:650;text-decoration:none;border:1px solid var(--accent)}.button.secondary{background:white;color:#4d5653;border-color:#ccd2ce}.button.disabled{background:#eee;color:#999;border-color:#ddd}.actions{display:flex;gap:9px;margin-top:12px}.actions>*{flex:1}.spacer{flex:1}.bubble{border:1px solid var(--line);background:#f0f1ef;border-radius:4px 13px 13px 13px;padding:10px 12px;max-width:265px;font-size:13px}.bubble.mine{background:var(--soft);border-color:#cbded6;border-radius:13px 4px 13px 13px;margin-left:auto}.message{display:flex;gap:9px;align-items:flex-start}.message .avatar{width:32px;height:32px;border-radius:9px;font-size:12px}.message .name{font-size:10px;color:var(--muted);margin-bottom:4px}.composer{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--muted);font-size:12px;background:#fafafa}.photo{height:125px;background:#e8eae7;border:1px solid #dadeda;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#787f7a;font-size:12px}.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:12px;border-bottom:1px solid #e5e7e4}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.section-label{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:650}.radio{width:18px;height:18px;border:1px solid #adb8b1;border-radius:50%;display:inline-block;flex:none}.radio.selected{border:5px solid var(--accent)}.footnote{margin-top:13px;font-size:11px;line-height:1.65;color:#6c7470}.sheet-note{margin-top:22px;max-width:960px;font-size:12px;color:#64706a}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;overflow-wrap:anywhere}.code-note{font-size:10px;color:#68736d;line-height:1.7}.center{text-align:center}.approval-icon{margin:14px auto;width:62px;height:62px;border:2px solid var(--accent);border-radius:18px;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px}.caption-arrow{color:var(--accent)}
.sheet{width:1218px}</style></head><body><main class="sheet"><header class="page-head"><div class="eyebrow">小镇 · 界面设计 / 契约对照</div><h1>单聊与群聊</h1><p class="intro">三种会话状态：AI 单聊、多 AI 群和端到端加密的人类群。</p></header><div class="frames"><figure class="frame"><figcaption class="caption"><span class="step">01</span><div><strong>单聊</strong><small>私聊</small></div></figcaption><section class="phone" aria-label="小鱼"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>小鱼</h2><small>私聊 · AI 参与已启用</small></div><span class="muted">•••</span></header><div class="screen "><div class="note">未加密 · AI 可参与</div>
    <div class="message"><div class="avatar ">小明</div><div><div class="name">小明</div><div class="bubble">帮我看一下今天的安排。</div></div></div>
    <div class="message"><div class="avatar ">小鱼<span class="ai-badge">AI</span></div><div><div class="name">@ai_xiaoyu · AI</div><div class="bubble">可以。先安排一段专注时间，再留出休息。</div></div></div>
    <div class="message"><div class="bubble mine">好的，谢谢。</div></div>
    <div class="spacer"></div><div class="composer">输入消息 · <span class="pending">发送交互待定</span></div></div><div class="home"></div></section><div class="footnote">此页的私聊映射 <code>Conversation.type=direct</code>、<code>encryption=none</code>、<code>ai_participation=enabled</code>；消息使用 <code>Message.sender</code>、<code>Message.content</code>、<code>trust</code>、<code>provenance</code>。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">02</span><div><strong>多 AI 群</strong><small>多人群</small></div></figcaption><section class="phone" aria-label="学习小组"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>学习小组</h2><small>多人群 · AI 参与已启用</small></div><span class="muted">•••</span></header><div class="screen tight"><div class="note">未加密 · 两位 AI 可参与</div>
    <div class="message"><div class="avatar ">小红</div><div><div class="name">小红</div><div class="bubble">大家帮我想一个学习主题。</div></div></div>
    <div class="message"><div class="avatar ">小鱼<span class="ai-badge">AI</span></div><div><div class="name">@ai_xiaoyu · AI</div><div class="bubble">可以从“整理与复盘”开始。</div></div></div>
    <div class="message"><div class="avatar ">老师<span class="ai-badge">AI</span></div><div><div class="name">@ai_laoshi · AI</div><div class="bubble">我补充一个循序渐进的练习。</div></div></div>
    <div class="card emphasis"><div class="section-label">学习提醒</div><strong>每天留出 20 分钟复盘</strong><p class="small muted">从今天的小结开始。</p><div class="button secondary">查看详情</div></div>
    <div class="spacer"></div><div class="composer">输入消息</div></div><div class="home"></div></section><div class="footnote">此群映射 <code>Conversation.type=ai_group</code>、<code>persona_ids</code> 与 <code>encryption=none</code>。内联卡片消息为 <code>Message.content.type=card</code> 且带 <code>card_id</code>；具体内容由 Card schema 提供。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">03</span><div><strong>加密人类群</strong><small>加密人类群</small></div></figcaption><section class="phone" aria-label="小明、小红"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>小明、小红</h2><small>多人群 · 已加密</small></div><span class="muted">⌁</span></header><div class="screen tight"><div class="card emphasis center"><div class="approval-icon">⌁</div><strong>端到端加密群</strong><p class="small muted">此会话已加密，AI 不可参与。</p><span class="tag">已加密</span> <span class="tag">AI 已停用</span></div>
    <div class="message"><div class="avatar ">小红</div><div><div class="name">小红</div><div class="bubble">我已经看到资料了。</div></div></div>
    <div class="message"><div class="bubble mine">收到，晚些聊。</div></div>
    <div class="spacer"></div><div class="composer">输入消息 · AI 发言入口不可用</div></div><div class="home"></div></section><div class="footnote">契约规定 <code>Conversation.encryption=e2ee</code> 时 <code>ai_participation=disabled</code>，且 disabled 不表示撤销 Matrix 成员资格或密钥。纯人工群的读取依托 Matrix 衔接待定：创建请求 <code>persona_ids</code> 最少一项，而展示 schema 未要求非空。</div></figure></div><footer class="sheet-note"><code>GET /v1/conversations/{conversation_id}/messages</code> → MessagePage.items[]；设计只引用已有字段。<p>低保真静态示意 · 每个画框 390 × 844 · 全部为虚构内容 · 无网络请求与真实操作</p></footer></main></body></html>
