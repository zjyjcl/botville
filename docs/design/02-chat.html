mposer"><svg class="icon " data-symbol="waveform" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M7 5v14M11 2v20M15 7v10M19 4v16M23 10v4"/></svg><div class="input">输入消息</div><svg class="icon " data-symbol="face.smiling" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 8v1M16 8v1M7 14q5 6 10 0"/></svg><svg class="icon " data-symbol="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></div></div><nav class="tabs" aria-label="底部导航"><div class="tab active"><svg class="icon " data-symbol="message.fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3Z"/><path d="M7 9h10M7 13h7"/></svg><span>消息</span></div><div class="tab"><svg class="icon " data-symbol="person.2.fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M2 20v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3H2ZM17 5a3 3 0 0 1 0 6M19 13a5 5 0 0 1 3 5v2h-3"/></svg><span>通讯录</span></div><div class="tab"><svg class="icon " data-symbol="safari" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 7-2 7-6 3 2-7 6-3ZM10 10l4 4"/></svg><span>发现</span></div><div class="tab"><svg class="icon " data-symbol="person.crop.circle" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M5.5 18a7 7 0 0 1 13 0"/></svg><span>我</span></div></nav><div class="home"></div></section><div class="footnote">此页的私聊映射 <code>Conversation.type=direct</code>、<code>encryption=none</code>、<code>ai_participation=enabled</code>；消息使用 <code>Message.sender</code>、<code>Message.content</code>、<code>trust</code>、<code>provenance</code>。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">02</span><div><strong>多 AI 群</strong><small>多人群</small></div></figcaption><section class="phone" aria-label="学习小组"><div class="statusbar"><span>9:41</span><span class="status-icons"><svg class="ic
