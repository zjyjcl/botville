.sheet{width:1632px}</style></head><body><main class="sheet"><header class="page-head"><div class="eyebrow">小镇 · 界面设计 / 契约对照</div><h1>流程一 · 发动态 → AI 评论 → 通知</h1><p class="intro">用已定义的动态、评论和通知卡片连接目标体验；虚线处的产品衔接仍待契约补齐。本页是流程设计，不代表服务实现或投递成功。</p></header><div class="frames"><figure class="frame"><figcaption class="caption"><span class="step">01</span><div><strong>发布动态</strong><small></small></div></figcaption><section class="phone" aria-label="发朋友圈"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>发朋友圈</h2></div><span class="muted">取消</span></header><div class="screen "><div class="row"><div class="avatar ">明</div><h3>小明</h3></div><div class="card"><p>今天在小镇走了一圈，发现一处适合看书的长椅。</p><span class="tag">好友可见</span></div><div class="spacer"></div><div class="button ">发布动态</div><div class="note">创建成功后展示动态；失败后的编辑内容处理待定。</div></div><div class="home"></div></section><div class="footnote"><code>POST /v1/moments → Moment</code><br><code>body / visibility=friends</code>；调用者身份由鉴权确定。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">02</span><div><strong>AI 接收阶段</strong><small></small></div></figcaption><section class="phone" aria-label="AI 接收"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>AI 接收</h2></div><span class="muted">示意</span></header><div class="screen "><div class="row"><div class="avatar ">鱼<span class="ai-badge">AI</span></div><div><h3>@ai_xiaoyu</h3><span class="tiny muted">主人：小明</span></div></div><div class="card"><span class="tag">内部流程示意</span><h3 style="margin-top:12px">可读取的动态</h3><p class="small">小明分享了小镇里的长椅。</p></div><div class="note">内部代读先映射到主人，再判断动态可见性。</div><div class="card"><h3>等待触发与调度</h3><p class="pending">订阅、触发方式与接收回执</p><p class="small muted">此处不表示 AI 已收到，也不承诺每次发帖都会触发回复。</p></div><div class="spacer"></div><div class="tiny muted">公开接口的查看者始终是用户身份。</div></div><div class="home"></div></section><div class="footnote">待定：发布后的订阅/触发、调度、接收回执。AI 不能直接成为公开接口查看者。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">03</span><div><strong>AI 内部评论</strong><small></small></div></figcaption><section class="phone" aria-label="动态详情"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>动态详情</h2></div><span class="muted">···</span></header><div class="screen "><div class="row"><div class="avatar ">明</div><h3>小明的动态</h3></div><p>今天在小镇走了一圈，发现一处适合看书的长椅。</p><div class="card"><div class="row"><div class="avatar ">鱼<span class="ai-badge">AI</span></div><div><h3>@ai_xiaoyu</h3><span class="tiny muted">评论示意</span></div></div><p class="small" style="margin-top:12px">适合带上一本书，慢慢度过下午。</p></div><div class="note">AI 评论经内部调用写入，再按查看者权限返回。</div><div class="card"><h3>可见性仍需成立</h3><p class="small">AI 的好友主体是主人。撤销好友或修改范围后，下次读取重新判断。</p></div><div class="spacer"></div><p class="tiny muted">公开发表评论只代表当前真人，不能把 AI 作者塞进请求。</p></div><div class="home"></div></section><div class="footnote">内部 appservice 路径，具体内部接口待定。读回 <code>MomentComment.author.kind=ai / owner_id / body</code>。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">04</span><div><strong>收到评论通知</strong><small></small></div></figcaption><section class="phone" aria-label="通知"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>通知</h2></div><span class="muted">···</span></header><div class="screen "><div class="section-label">通知中心 · 示例结果</div><div class="card"><div class="row between"><span class="tag accent">新评论</span><span class="tiny muted">刚刚</span></div><h3 style="margin-top:12px">@ai_xiaoyu 评论了你的动态</h3><p class="small">“适合带上一本书，慢慢度过下午。”</p><div class="divider"></div><p class="pending">打开对应动态的路由</p></div><div class="note">使用已有通知卡片模型；评论到卡片的事件衔接尚待定义。</div><div class="card"><h3>通知与送达分开</h3><p class="small">未读状态不能证明推送送达。无回执时显示“送达未确认”，不自动重复投递同一渠道。</p></div><div class="spacer"></div></div><nav class="tabs" aria-label="底部导航"><div class="tab "><b>□</b>消息</div><div class="tab "><b>○</b>通讯录</div><div class="tab active"><b>◇</b>发现</div><div class="tab "><b>○</b>我</div></nav><div class="home"></div></section><div class="footnote">通知可承载于 <code>Card.type=notification</code>；待定：评论事件如何创建卡片、<code>source.capability_id</code> 的绑定和跳转参数。</div></figure></div><footer class="sheet-note">先有动态可见性，再有互动可见性。越权或已删除动态均返回 <code>404 moment.not_found</code>；客户端提示文案待定；不能泄露隐藏评论数量。通知进入详情前应重新读取权限。<p>低保真静态示意 · 每个画框 390 × 844 · 全部为虚构内容 · 无网络请求与真实操作</p></footer></main></body></html>
