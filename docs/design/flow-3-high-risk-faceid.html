.sheet{width:1632px}</style></head><body><main class="sheet"><header class="page-head"><div class="eyebrow">小镇 · 界面设计 / 契约对照</div><h1>流程 3：高风险授权 → Face ID → 回执</h1><p class="intro">高风险操作依次经过二次确认、Face ID、一次性挑战、本地签名和提交；签名在本机生成，随后随请求提交。</p></header><div class="frames"><figure class="frame"><figcaption class="caption"><span class="step">01</span><div><strong>高风险卡</strong><small>风险识别</small></div></figcaption><section class="phone" aria-label="高风险授权"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>高风险授权</h2></div><span class="muted">···</span></header><div class="screen tight"><div class="card emphasis">
      <div class="row between"><span class="tag accent">授权请求</span><span class="tag">高风险</span></div>
      <h3>小明请求：变更小镇设置</h3><p class="small muted">来自 小明 · 待处理</p>
      <div class="kv"><span>请求内容</span><span>按来源说明执行</span></div><div class="kv"><span>操作状态</span><span>等待你的决定</span></div>
      <div class="actions"><div class="button ">继续</div><div class="button secondary">取消</div></div>
    </div>
      <div class="note">这是一项高风险操作。开始后仍可在确认页取消；取消或 Face ID 失败均不会提交。</div></div><div class="home"></div></section><div class="footnote">effective_risk = action.risk ?? card.risk；high 或未知 risk 必须进入 step-up。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">02</span><div><strong>二次确认与 Face ID</strong><small>确认 → Face ID</small></div></figcaption><section class="phone" aria-label="再次确认"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>再次确认</h2></div><span class="muted">···</span></header><div class="screen tight"><div class="approval-icon">!</div><h3 class="center">确认授权此操作？</h3><p class="center small muted">请确认内容无误，再使用 Face ID 继续。</p><div class="card"><div class="section-label">确认后将执行</div><div class="kv"><span>操作</span><span>变更小镇设置</span></div><div class="kv"><span>影响与回滚</span><span>待定 · 由来源说明</span></div><div class="kv"><span>保护方式</span><span>Face ID</span></div><div class="kv"><span>取消</span><span>不提交任何操作</span></div></div><div class="actions"><div class="button secondary">取消</div><div class="button ">使用 Face ID</div></div></div><div class="home"></div></section><div class="footnote">先二次确认，Face ID 通过后才请求 POST /v1/cards/{card_id}/actions/{action_id}/challenge；取消或验证失败不提交。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">03</span><div><strong>挑战与本地签名</strong><small>challenge → sign</small></div></figcaption><section class="phone" aria-label="安全验证"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>安全验证</h2></div><span class="muted">···</span></header><div class="screen tight"><div class="approval-icon">◉</div><h3 class="center">Face ID 已通过</h3><p class="center small muted">正在获取一次性验证并在本机完成签名。</p><div class="card emphasis"><div class="kv"><span>验证挑战</span><span>短时、仅限本次</span></div><div class="kv"><span>本地签名</span><span>绑定本卡片与操作</span></div><div class="kv"><span>签名方式</span><span>本机安全签名</span></div></div><div class="note">签名在 App 本地完成，不提供单独签名接口。若挑战过期，回到确认后重新获取挑战。</div></div><div class="home"></div></section><div class="footnote">签名绑定 card_id + action_id + revision + challenge；POST challenge 后，App 本地以 p256 生成 assertion。</div></figure><figure class="frame"><figcaption class="caption"><span class="step">04</span><div><strong>提交与结果</strong><small>submit → 回执</small></div></figcaption><section class="phone" aria-label="处理结果"><div class="statusbar"><span>9:41</span><span class="pill"></span><span>信号 ▪ 电量</span></div><header class="topbar"><div><h2>处理结果</h2></div><span class="muted">···</span></header><div class="screen tight"><div class="card"><div class="section-label">本次提交</div><div class="kv"><span>提交内容</span><span>本次验证与签名</span></div><div class="kv"><span>重复请求</span><span>同一请求标识安全重试</span></div></div><div class="card emphasis"><div class="kv"><span>操作状态</span><span>已接受</span></div><div class="kv"><span>验证方式</span><span>生物识别</span></div><div class="kv"><span>审批编号</span><span>audit_xiaoming_high</span></div><div class="kv"><span>卡片状态</span><span>已处理</span></div></div><div class="note">版本冲突先刷新；已处理则展示已有结果。只有处理回执表示“已接受”才显示操作成功。</div></div><div class="home"></div></section><div class="footnote">POST action 携带 revision、challenge、assertion 与 Idempotency-Key。以 CardActionReceipt.status 判断 accepted / rejected / failed。</div></figure></div><footer class="sheet-note">待定：assertion 编码、设备密钥注册、具体错误页文案及模块 payload。挑战过期应重新确认并获取挑战；版本冲突先刷新；同一 Idempotency-Key 可安全重试。<p>低保真静态示意 · 每个画框 390 × 844 · 全部为虚构内容 · 无网络请求与真实操作</p></footer></main></body></html>
