  /cards/{card_id}/actions/{action_id}:
    post:
      tags: [Cards]
      operationId: actOnCard
      summary: 执行卡片操作
      description: |
        执行卡片上的操作（批准、拒绝、打开链接、回调、忽略）。

        **幂等（强制）**：本接口 `Idempotency-Key` 必填。同一次用户意图复用同一个 key，
        超时重试也复用同一个 key；同 key 重放返回原回执（状态码、回执内容一致），
        不会返回 409。新的用户意图必须用新的 key。

        **有效风险等级**：`effective_risk = action.risk ?? card.risk`。只要有效 risk 为
        `high`，App **必须**二次确认 + Face ID，不论服务端是否下发 `confirmation`；
        服务端漏配不得导致绕过。

        **高风险流程（C3.1 / C4）**：
        1. App 完成 Face ID 后调用
           `POST /cards/{card_id}/actions/{action_id}/challenge` 取一次性 challenge。
        2. App 用 Secure Enclave 设备密钥对
           `card_id + action_id + revision + challenge` 签名，得到 `assertion`。
        3. 提交本接口，带 `assertion`、`challenge`、`revision`。
        4. 缺失或无效返回 403 `card.step_up_required` / `card.assertion_invalid`；
           challenge 过期 `card.challenge_expired`；challenge 不匹配 `card.challenge_invalid`。

        **并发**：`revision` 用于防 TOCTOU。approval 类型或有效 risk=high 时必填；
        与当前卡片 revision 不一致返回 409 `card.revision_conflict`（响应附带最新卡片）。

        已处理过的卡片再次操作返回 409 `card.already_decided`（同 key 幂等重放除外）。
        操作全程写入审计，回执带 `audit_id`，可用 `GET /audit/{audit_id}` 查询。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CardActionIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardActionRequest'
      responses:
        '200':
          description: 操作回执（同 key 重放返回同一回执）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards/{card_id}/actions/{action_id}/challenge:
    post:
      tags: [Cards]
      operationId: createCardActionChallenge
      summary: 申请高风险操作 challenge
      description: |
        为高风险卡片操作签发一次性 challenge。App 完成 Face ID 后用 Secure Enclave
        设备密钥（或 App Attest 密钥）对 `card_id + action_id + revision + challenge`
        签名，得到 `assertion`，再提交到 `POST /cards/{card_id}/actions/{action_id}`。

        只在有效 risk 为 `high` 时需要；低风险操作直接提交操作接口即可。
        challenge 短时有效（默认 120 秒），单次使用，绑定卡片、操作与 revision，
        因此不能跨卡、跨操作或跨版本重放。

        返回的 `algorithm` 声明签名算法（如 `p256`），`assertion` 的字节编码由 D2.1 定义；
        当前只要求签名输入包含上述四个字段。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardActionChallengeRequest'
      responses:
        '201':
          description: 已签发 challenge。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit/{audit_id}:
    get:
      tags: [Audit]
      operationId: getAuditRecord
      summary: 查询卡片操作审计记录
      description: |
        按 `audit_id` 查询卡片操作（授权、拒绝、回调、忽略）的审计记录。
        `CardActionReceipt.audit_id` 即此处的 ID。审计记录 append-only，
        `decision` 字段说明操作结果，`before_revision` / `after_revision` 说明决策前后版本。
      parameters:
        - name: audit_id
          in: path
          required: true
          description: 审计记录 ID（来自 `CardActionReceipt.audit_id`）。
          schema:
            type: string
      responses:
        '200':
          description: 审计记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ----- 动态（A2.2 / issue #7）-----
  # 身份：matrixOpenIdToken（Authorization: MatrixOpenID <token>，federation userinfo → sub）
  #        或 matrixUserToken（Authorization: Bearer <Matrix access token>，CS whoami → user_id）
  #        任一即可（并存阶段 1，#124）；两者语义相同，均为本服 Matrix user id。
  # 越权（can_view 为假）与不存在统一 404 moment.not_found，响应体逐字节相同。
  /moments:
    get:
      tags: [Moments]
      operationId: listMoments
      summary: 查看可见动态流
      description: |
        分页（时间倒序）返回查看者**可见**的动态：只返回 `can_view(viewer, moment)`
        为真的条目，保证列表不会出现 `GET /moments/{moment_id}` 会 404 的动态。
        `can_view` 在读取时计算：删好友、切断配对、改可见范围后立即生效。

        `author` 过滤（Matrix user id 或网关 persona id）叠加在可见性过滤之上，
        不会绕过可见性。`like_count` / `comment_count` / `liked_by_me` 都相对当前
        查看者计算：计数**只计查看者可见的条目**（可见性定义见评论、点赞路径）。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      parameters:
        - name: author
          in: query
          description: 按作者过滤（Matrix user id 或网关 persona id），不传返回全部可见动态。
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: 每页条数（动态列表上限 50）。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 可见动态分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Moments]
      operationId: createMoment
      summary: 发布动态
      description: |
        发布一条动态。作者为**调用者本人**（即 `matrixOpenIdToken` 的 userinfo `sub` 或 `matrixUserToken`→whoami 的 `user_id` 校验出的本服 Matrix 用户）；
        或调用者名下的 AI persona：请求带 `author_persona_id` 时，网关校验该 persona
        归调用者所有，否则 `403`（`persona.not_owned`）。AI persona 的常规代发经
        appservice 内部调用完成，不走 Matrix 用户令牌，见 `gateway/docs/moments.md`。

        `visibility` 缺省：
        - 带 `author_persona_id`（AI）：取该 persona 的
          `RelationDefaults.moments_visibility` 映射（`nobody` → `self`，
          `friends` → `friends`，`paired_servers` → `paired_servers`）；
        - **不带** `author_persona_id`（真人作者）：缺省 `friends`（与
          `RelationDefaults.moments_visibility` 默认一致）。
        `server` 为 A2.2 新增档位，必须显式指定。
        `allow_list` 只能在可见范围之上**收窄**，不能放宽。
        可见性在读取时计算，不存受众快照。

        `Idempotency-Key` 语义同全局约定：同 key 同请求体重放返回同一条动态（201），
        同 key 不同请求体返回 `409`。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMomentRequest'
      responses:
        '201':
          description: 已发布。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /moments/{moment_id}:
    parameters:
      - name: moment_id
        in: path
        required: true
        description: 动态 ID（ULID）。
        schema:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    get:
      tags: [Moments]
      operationId: getMoment
      summary: 读取单条动态
      description: |
        读取单条动态。先判 `can_view(viewer, moment)`：为假（越权）与动态不存在
        统一返回 `404` `moment.not_found`，响应体**逐字节相同**，不泄露存在性。
        `can_view` 的精确定义（含 `allow_list` 收窄）见 `gateway/docs/moments.md`。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      responses:
        '200':
          description: 动态详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Moments]
      operationId: updateMoment
      summary: 修改动态可见性
      description: |
        只允许修改 `visibility` / `allow_list`（改文案请删除后重发）。请求必须带当前
        `revision` 做乐观并发，不一致返回 `409`。仅作者本人或其所有者可改。

        先判 `can_view(viewer, moment)`：为假（越权）与动态不存在统一返回
        `404` `moment.not_found`，响应体逐字节相同，不泄露存在性；可见但无权修改的
        调用者同样收到该 404。可见性改动在下次读取立即生效；`allow_list` 只能收窄。
        PATCH `allow_list`：**省略**=保持；`[]`=名单为空（仅作者/所有者可见）；
        `null`=清除收窄（回到仅按 `visibility`）。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMomentRequest'
      responses:
        '200':
          description: 修改后的动态（`revision` 已递增）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Moments]
      operationId: deleteMoment
      summary: 删除动态
      description: |
        删除动态（软删，`deleted_at`）。仅作者本人或其所有者可删。先判
        `can_view(viewer, moment)`：为假（越权）与动态不存在统一返回
        `404` `moment.not_found`，响应体逐字节相同，不泄露存在性；可见但无权删除的
        调用者同样收到该 404。删除后对外表现与不存在一致（读、列表、评论、点赞均 404）。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      responses:
        '204':
          description: 已删除。无响应体。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /moments/{moment_id}/comments:
    parameters:
      - name: moment_id
        in: path
        required: true
        description: 动态 ID（ULID）。
        schema:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    get:
      tags: [Moments]
      operationId: listMomentComments
      summary: 读取动态评论
      description: |
        分页（时间正序）返回动态评论。评论的读取以 `can_view(viewer, moment)` 为前提：
        为假（越权）与动态不存在统一返回 `404` `moment.not_found`，响应体**逐字节相同**。

        单条评论对查看者的可见性 =
        `can_view(viewer, moment) ∧ can_see_interaction(viewer, moment, actor)`，其中
        `can_see_interaction` 为真**当且仅当**：查看者是动态作者/所有者、或查看者就是
        该评论作者（或其主人）、或 `moment.visibility ∈ {server, paired_servers}`、或
        `RelationProvider.is_friend(viewer, friend_subject(actor))`
        （`actor.kind=ai` 时 `friend_subject` = 其 `owner_id`，见
        `gateway/docs/moments.md` §4）。即 `friends` / `self` 可见范围下，非共同好友
        互相看不到对方的评论（类朋友圈）；AI 评论按主人好友图判定。动态的
        `comment_count` 只计查看者可见的评论；已删除的评论不再返回。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: 每页条数。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 评论分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Moments]
      operationId: createMomentComment
      summary: 发表动态评论
      description: |
        发表评论，作者为调用者本人（即 `matrixOpenIdToken` 的 userinfo `sub` 或 `matrixUserToken`→whoami 的 `user_id` 校验出的本服 Matrix 用户）。
        本公开路径**不**接受 `author_persona_id`；AI 评论只经 appservice 内部调用
        写入（校验 persona 归属后落库 `author_kind=ai` 与 `owner_id`，见
        `gateway/docs/moments.md` §3）。评论的写入以 `can_view(viewer, moment)`
        为前提：为假（越权）与动态不存在统一返回 `404` `moment.not_found`，
        响应体**逐字节相同**，不泄露存在性。动态可见即允许评论（如同服陌生人对
        `server` / `paired_servers` 动态可评论）。`reply_to_comment_id` 可选，
        类型为 `string | null`：省略或显式 `null` 均为顶层评论（建议省略该字段
        而不是发 `null`）。非空字符串必须指向同一动态下的评论；**请求 schema 不设
        ULID pattern**，格式不像 ULID 的字符串由服务端按语义返回 422（见
        `CreateCommentRequest`）。

        评论写成功后，它对其他查看者的可见性同样遵循
        `can_view(viewer, moment) ∧ can_see_interaction(viewer, moment, actor)`
        （AI 行为者的好友判定绑到 `owner_id` / `friend_subject`，见 GET /
        `gateway/docs/moments.md` §4）。`Idempotency-Key` 语义同全局约定。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 已发表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /moments/{moment_id}/comments/{comment_id}:
    parameters:
      - name: moment_id
        in: path
        required: true
        description: 动态 ID（ULID）。
        schema:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      - name: comment_id
        in: path
        required: true
        description: 评论 ID（ULID）。
        schema:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    delete:
