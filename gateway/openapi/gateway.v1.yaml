# botville AI Gateway API — v1 契约初稿（issue B0.1 / M0）
# 人类可读说明：gateway/docs/contract.md
# 本文件是机器可读的唯一事实源；示例见 gateway/openapi/examples/。
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: botville AI Gateway API
  version: 0.1.0
  summary: AI 网关契约初稿：对话与消息、角色、功能清单、卡片、用量与限额。
  description: |
    botville 自部署 AI 网关的开放 HTTP API。网关位于 Matrix homeserver 与 AI 运行时之间：
    **AI 决定想不想说，网关决定能不能说。** Matrix Client-Server / Application Service API
    负责消息传输；本契约只覆盖网关自己的控制面（角色、会话登记、发言裁决、三层限额、
    用量账单、功能清单与通用卡片），不重复定义 Matrix 协议。

    当前为 **0.1.0 草案**（M0），供 C 线（App）与 D 线（通知 / 开放 API）评审。
    版本规则见 `gateway/docs/contract.md#版本规则`：`/v1` 路径、只增不删、破坏性变更升主版本。

    所有示例、令牌与密钥均为占位符（`<change-me>`），本契约不含任何真实凭据。

    **请求体上限**：任何 `POST` / `PUT` 请求体不得超过 **1 MiB（1048576 字节）**。
    超限返回 `400 request.invalid`，`errors[].code` 为 `too_large`（**不新增 413**，
    状态码集合保持不变）。详见 contract.md §1.1。

    **开放枚举**：所有响应侧的枚举字段（卡片类型、块类型、操作类型、能力状态等）
    都按开放枚举声明——客户端遇到未知值必须按契约给出的降级规则处理，
    不得因未知值导致整条响应解码失败。请求侧枚举仍为封闭集合。

    **卡片结构版本**：`card_schema_version` 与契约 `info.version` 解耦，
    通过 `X-Card-Schema-Version` / `card_schema_max` 协商，见 contract.md 4.7。

    许可：Apache-2.0。
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: botville contributors

servers:
  - url: https://{host}/v1
    description: 自部署网关（占位域名，部署时替换）。
    variables:
      host:
        default: gateway.example.invalid
        description: 网关对外域名。

security:
  - bearerAuth: []

tags:
  - name: Health
    description: 存活、就绪与模块状态。
  - name: Capabilities
    description: 功能清单（capability manifest），驱动 App 入口与模块网页。
  - name: Personas
    description: AI 角色配置、关系默认值与角色状态。
  - name: Conversations
    description: 会话（Matrix room）在网关的登记与查询。
  - name: Messages
    description: 消息读取，以及 AI 发言请求的网关裁决与投递。
  - name: Policy
    description: 发言前预检，不产生投递。
  - name: Limits
    description: 三层限额（平台 / 所有者 / 对方）的读取与设置。
  - name: Usage
    description: token 预算、用量汇总与账单明细。
  - name: Cards
    description: 通用卡片与授权操作。
  - name: Audit
    description: 卡片操作与授权审计记录查询。

x-botville-contract:
  stability: draft
  review: [C, D]
  changelog: gateway/docs/contract.md#版本规则
  error_model: RFC 9457 problem+json
  idempotency: Idempotency-Key header

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 健康检查
      description: |
        返回网关自身、Matrix 连接、数据库与模型提供方（仅可达性）以及各模块的状态。
        不需要鉴权，供部署探针与 App 状态页使用。`status` 非 `ok` 时返回 503，响应体结构相同。
      security: []
      responses:
        '200':
          description: 服务健康或降级。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 服务不可用或关键依赖异常。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: 获取功能清单
      description: |
        返回当前网关切片的 capability manifest。App 必须以此渲染模块入口，不得硬编码模块列表。
        `app_version` 用于服务端过滤不满足 `min_app_version` 的能力；App 仍需忽略未知能力 ID
        与未知字段。清单可缓存（参考 `cache_ttl_seconds`），版本变化通过 `manifest_version` 感知。
      parameters:
        - name: locale
          in: query
          description: 期望语言，覆盖 Accept-Language。
          schema:
            type: string
            example: zh-CN
        - name: module
          in: query
          description: 只返回指定模块的能力。
          schema:
            type: string
            example: memory
        - name: status
          in: query
          description: 只返回指定状态的能力。
          schema:
            type: string
            enum: [enabled, disabled, degraded]
        - name: app_version
          in: query
          description: 调用方 App 版本，用于按 min_app_version 过滤。
          schema:
            type: string
            example: 0.4.0
      responses:
        '200':
          description: 功能清单。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}:
    get:
      tags: [Capabilities]
      operationId: getCapability
      summary: 获取单个能力
      description: 返回单个 capability 的完整描述；未知能力返回 404。
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - name: locale
          in: query
          schema:
            type: string
            example: zh-CN
      responses:
        '200':
          description: 能力描述。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}/session-tokens:
    post:
      tags: [Capabilities]
      operationId: createCapabilitySessionToken
      summary: 签发模块网页一次性 code
      description: |
        为 App 内置浏览器打开模块网页签发**一次性 code**，而不是可直接放进请求头的长期令牌。
        WKWebView 只能给首个 `URLRequest` 加头，后续导航、子资源与 XHR 都带不上
        `Authorization`，因此令牌方案改为「一次性 code → HttpOnly cookie」：

        1. App 调用本接口，拿到 `code`（TTL ≤ 60 秒、单次使用）与 `url`（`code` 已作为查询串
           带给模块页面）。`url` 是唯一允许出现 `code` 的位置，不得写入日志或长期缓存。
        2. 模块页面用该 `code` 调用
           `POST /capabilities/{capability_id}/session-cookies` 换取 `Set-Cookie`，
           浏览器自动保存 **HttpOnly + Secure + SameSite** cookie，页面脚本读不到值。
        3. 之后页面所有同源请求自动携带 cookie，不再需要请求头。
        4. 会话上限 3600 秒（`ttl_seconds` ≤ 3600）。过期由页面通过 JS bridge 消息
           `botville.session.renew` 通知 App，App 重新走第 1 步。

        `allowed_origins` 是 App 放行导航的白名单：只在该列表内的 origin 加载页面，
        跳到其他 origin 改用外部浏览器打开。

        网关响应中的 `code` 只是占位示例（`<change-me>`），真实值不会出现在仓库里。
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTokenRequest'
      responses:
        '201':
          description: 已签发一次性 code 与模块网页地址。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}/session-cookies:
    post:
      tags: [Capabilities]
      operationId: exchangeCapabilitySessionCookie
      summary: 一次性 code 换取 HttpOnly 会话 cookie
      description: |
        模块网页（不是 App）调用：用 `session-tokens` 签发的一次性 `code` 换取
        `Set-Cookie` 会话。`code` 单次使用、≤ 60 秒有效；成功返回 `204` 并设置
        **HttpOnly + Secure + SameSite** cookie，JSON 响应体**不含** cookie 值。
        会话有效期 ≤ 3600 秒，与 `session-tokens` 的 `ttl_seconds` 一致。

        `code` 只能出现在请求体或页面首次加载 URL 中，不得写入日志、localStorage
        或任何可被脚本读取的位置。重复使用同一 `code` 返回 401 `auth.invalid_token`。
      security: []
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCookieRequest'
      responses:
        '204':
          description: 已设置会话 cookie（`Set-Cookie`），无响应体。
          headers:
            Set-Cookie:
              description: |
                HttpOnly、Secure、SameSite=Lax 的会话 cookie；会话 ≤ 3600 秒。
                示例占位，不含真实值。
              schema:
                type: string
                example: botville_session=<change-me>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=3000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: code 已使用或已过期。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /personas:
    get:
      tags: [Personas]
      operationId: listPersonas
      summary: 列出角色
      description: 列出调用者可见的 AI 角色。默认只返回自己拥有的角色；`owner_id` 仅对本服所有者生效。
      parameters:
        - name: owner_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [builtin_template, custom, adapter]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, archived]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: 角色分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Personas]
      operationId: createPersona
      summary: 创建角色
      description: |
        创建 AI 角色。`model_binding.credential_ref` 只接受密钥引用（环境变量或密钥库键名），
        网关拒绝明文密钥。内置性格模板见 `personality_template_id`（B2.7）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonaRequest'
      responses:
        '201':
          description: 角色已创建。
          headers:
            Location:
              description: 新角色资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /personas/{persona_id}:
    get:
      tags: [Personas]
      operationId: getPersona
      summary: 获取角色
      description: 返回单个角色的完整配置，含模型绑定、主动发言、关系默认值与记忆设置。
      parameters:
        - $ref: '#/components/parameters/PersonaId'
      responses:
        '200':
          description: 角色详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Personas]
      operationId: updatePersona
      summary: 更新角色
      description: |
        部分更新。请求头 `If-Match` 可选；也可在请求体传 `revision` 做乐观并发控制，
        不一致返回 409 并附带当前 revision。改动对后续消息立即生效。
      parameters:
        - $ref: '#/components/parameters/PersonaId'
        - name: If-Match
          in: header
          description: 可选，`revision` 的 ETag 形式（如 `"3"`）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonaRequest'
      responses:
        '200':
          description: 更新后的角色。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Personas]
      operationId: deletePersona
      summary: 删除角色
      description: |
        归档并删除角色。仍有关联会话或未结束的主动发言任务时返回 409（`persona.in_use`），
        需先归档或解除关联。
      parameters:
        - $ref: '#/components/parameters/PersonaId'
      responses:
        '204':
          description: 已删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /personas/{persona_id}/state:
    get:
      tags: [Personas]
      operationId: getPersonaState
      summary: 获取角色状态
      description: 返回心情、需求与今日主动发言预算，用于 App 的角色页（C2.4）与多 AI 群调度。
      parameters:
        - $ref: '#/components/parameters/PersonaId'
      responses:
        '200':
          description: 角色状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Personas]
      operationId: updatePersonaState
      summary: 更新角色状态
      description: 更新心情或需求水平（事件驱动）。网关会对超出范围的值返回 422。
      parameters:
        - $ref: '#/components/parameters/PersonaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonaStateRequest'
      responses:
        '200':
          description: 更新后的角色状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: 列出会话
      description: 列出网关已登记的会话，可按角色、类型与更新时间过滤。
      parameters:
        - name: persona_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [direct, group, ai_group, town]
        - name: updated_since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: 会话分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Conversations]
      operationId: createConversation
      summary: 登记会话
      description: |
        把 Matrix room 登记为网关会话（幂等：同一 `matrix_room_id` 已存在时返回 200 与已有会话）。
        botville 的 AI 接入不支持加密会话：含 AI 的会话使用 `encryption: none`，App 不提供开启加密；
        E2EE 房间中 `ai_participation` 必须为 `disabled`，网关不得代表 AI 发言。
        这是网关参与策略，不代表撤销 Matrix 成员资格或密钥，也不是 AI 无法解密的保证。

        `encryption=e2ee` 且显式 `ai_participation=enabled` → `422` `request.invalid`
        （语义组合不合法）。省略 `ai_participation` 时按 `encryption` 推导：
        `e2ee` → `disabled`，`none` → `enabled`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: 会话已存在，返回现有会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: 会话已登记。
          headers:
            Location:
              description: 新会话资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            语义不合法。典型：`encryption=e2ee` 且 `ai_participation=enabled`
            （`code=request.invalid`）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                e2ee_with_ai_enabled:
                  summary: e2ee 会话不允许 ai_participation=enabled
                  value:
                    type: urn:botville:error:request.invalid
                    title: Request validation failed
                    status: 422
                    detail: encryption=e2ee cannot be combined with ai_participation=enabled
                    instance: /v1/conversations
                    code: request.invalid
                    request_id: req_demo_e2ee_create
                    errors:
                      - field: ai_participation
                        code: incompatible_with_encryption
                        message: e2ee conversations require ai_participation=disabled
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversation_id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: 获取会话
      description: 返回会话详情，含参与人、关系、加密状态与当前限额快照。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 会话详情，含参与人、关系、加密状态与限额快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversation_id}/messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: 读取会话消息
      description: |
        按时间倒序分页返回消息。每条消息带 `trust` 标记：`untrusted` 表示来自外部或不可信来源，
        网关在交给模型前已做隔离处理；客户端展示时不得把它当系统指令。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: direction
          in: query
          description: 分页方向。
          schema:
            type: string
            enum: [backward, forward]
            default: backward
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: trust
          in: query
          description: 按可信度过滤。
          schema:
            type: string
            enum: [any, trusted, untrusted]
            default: any
      responses:
        '200':
          description: 消息分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Messages]
      operationId: sendMessage
      summary: 请求以 AI 身份发言
      description: |
        AI 运行时提交一条待发送消息，由网关做完整裁决（三层限额、静默时段、防刷屏、互聊熔断、
        关系策略），通过后经 appservice 以角色身份投递到 Matrix。

        **策略结论不是 HTTP 错误**：请求合法且会话允许 AI 参与时始终返回 200 与 `MessageReceipt`，
        `outcome` 为 `delivered` / `queued` / `deferred` / `blocked`，原因见 `decision.reasons`。
        401/403 只表示调用方身份、所有权、scope 或会话硬约束问题。

        **加密会话硬约束**：目标会话 `encryption=e2ee` 或 `ai_participation=disabled` 时返回
        `403` `conversation.e2ee`（不可重试）。这不是 §1.4 的 `200 blocked`，不消耗限额、不入队。

        重试必须复用同一 `Idempotency-Key`；同一 key 不同请求体返回 409。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingMessageRequest'
      responses:
        '200':
          description: 发言裁决结果（可能已投递、排队、延后或拦截）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            身份有效但无权限。含 `persona.not_owned`、`relation.chat_denied`，以及加密/
            AI 禁用会话硬约束 `conversation.e2ee`（不可重试，非策略 blocked）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conversation_e2ee:
                  summary: 加密或 AI 禁用会话拒绝代发言
                  value:
                    type: urn:botville:error:conversation.e2ee
                    title: AI participation disabled for this conversation
                    status: 403
                    detail: encryption=e2ee or ai_participation=disabled; gateway must not speak as AI here
                    instance: /v1/conversations/conv_demo/messages
                    code: conversation.e2ee
                    request_id: req_demo_e2ee_send
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /policy/evaluate:
    post:
      tags: [Policy]
      operationId: evaluatePolicy
      summary: 发言前预检
      description: |
        在不投递的情况下评估一次发言是否会被允许，供 AI 在花 token 之前决定「要不要说」。
        返回完整的 `PolicyDecision`（命中层级、剩余额度、重置时间、原因）。
        预检结果不占用额度，也不保证稍后发送一定成功（额度可能被并发消耗）。

        目标会话 `encryption=e2ee` 或 `ai_participation=disabled` 时返回 `403` `conversation.e2ee`
        （与 sendMessage 同一硬约束；不返回 200 blocked）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluateRequest'
      responses:
        '200':
          description: 预检结论。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            含加密/AI 禁用会话硬约束 `conversation.e2ee`（与 sendMessage 相同，不可重试）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conversation_e2ee:
                  summary: 加密或 AI 禁用会话拒绝预检代发言
                  value:
                    type: urn:botville:error:conversation.e2ee
                    title: AI participation disabled for this conversation
                    status: 403
                    detail: encryption=e2ee or ai_participation=disabled; gateway must not speak as AI here
                    instance: /v1/policy/evaluate
                    code: conversation.e2ee
                    request_id: req_demo_e2ee_policy
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /limits:
    get:
      tags: [Limits]
      operationId: getLimits
      summary: 读取生效限额
      description: |
        返回某一作用域下三层限额（平台底线、所有者设置、对方设置）的原始规则与逐项生效值。
        每一项取三层中最严者，`source_layer` 指出是哪一层胜出。
      parameters:
        - name: persona_id
          in: query
          schema:
            type: string
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: peer_id
          in: query
          description: 对方设置所属角色（跨角色限制时使用）。
          schema:
            type: string
        - name: include_platform
          in: query
          description: 是否返回平台底线层（只读）。
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 生效限额。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Limits]
      operationId: putLimits
      summary: 设置限额层
      description: |
        写入所有者层（`layer: owner`，scope 为 `persona` 或 `conversation`）或对方层
        （`layer: peer`，scope 为 `peer`）。平台底线层只能由部署配置设置，不可经 API 修改。
        返回重新计算后的生效限额。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitPolicy'
      responses:
        '200':
          description: 更新后的生效限额。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: 查询用量与预算
      description: |
        返回指定窗口内的消息数、token 用量、主动发言与小镇消耗，以及当前预算与重置时间。
        小镇消耗单独一行（B4.2）；`group_by` 控制 breakdown 的分桶方式。默认窗口为最近 24 小时。
      parameters:
        - name: persona_id
          in: query
          schema:
            type: string
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: timezone
          in: query
          schema:
            type: string
            example: Asia/Shanghai
        - name: group_by
          in: query
          schema:
            type: string
            enum: [conversation, day, capability, model]
            default: conversation
      responses:
        '200':
          description: 用量汇总。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /usage/events:
    get:
      tags: [Usage]
      operationId: listUsageEvents
      summary: 查询用量账单明细
      description: 逐条用量事件（模型调用、发送、拦截、主动发言、小镇行为），用于审计与对账。
      parameters:
        - name: persona_id
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [model_call, message_sent, blocked, message_blocked, proactive_message, town_action, image_generation, card_action]
          description: |
            `blocked` 是策略拦截的规范值（对应 `outcome: blocked`）；
            `message_blocked` 为 0.1.0 旧别名，保留兼容。`card_action` 记录卡片操作审计。
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: 用量事件分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: 列出卡片
      description: 返回当前用户的卡片，可按状态、类型、优先级与来源能力过滤。App 按 `blocks` 通用渲染。`updated_since` 用于增量同步。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, read, dismissed, expired, acted]
        - name: type
          in: query
          schema:
            type: string
            enum: [notification, approval, moment, system, reminder, result]
        - name: priority
          in: query
          schema:
            type: string
            enum: [urgent, high, normal, low]
        - name: capability_id
          in: query
          schema:
            type: string
        - name: updated_since
          in: query
          description: 只返回此时间之后更新的卡片，用于增量同步（RFC 3339 UTC，以 `Z` 结尾）。
          schema:
            type: string
            format: date-time
        - name: card_schema_max
          in: query
          description: |
            客户端支持的最高卡片 schema 版本（格式 `<major>.<minor>`）。
            服务端按此降级；高于客户端 major 的卡片只返回 `fallback_text`。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
        - name: locale
          in: query
          schema:
            type: string
            example: zh-CN
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: X-Card-Schema-Version
          in: header
          description: |
            客户端支持的最高卡片 schema 版本（格式 `<major>.<minor>`）。
            与 `card_schema_max` 等效，优先级低于 query param。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
      responses:
        '200':
          description: 卡片分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Cards]
      operationId: createCard
      summary: 创建并投递卡片
      description: |
        由通知、小镇等模块创建卡片。网关校验 schema、来源能力 scope 与 payload 中的敏感信息，
        通过后推送给 App。`fallback_text` 必填，供旧客户端或不支持的类型降级展示。

        **业务级去重**：`source.event_id` 与 `source.dedupe_key` 二选一必填，服务端按
        `(capability_id, event_id ?? dedupe_key)` 去重。命中已有键时**不新建、不重复投递**，
        返回 `200` 与已有卡片；首次创建返回 `201`。因此客户端必须同时处理 200 与 201，
        响应体都是同一个 `Card` schema。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '200':
          description: |
            去重命中：该来源键已有卡片，返回**已有卡片**，未新建、未重复投递。
            响应体与 201 相同（`Card`）。
          headers:
            Location:
              description: 已有卡片资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '201':
          description: 卡片已创建。
          headers:
            Location:
              description: 新卡片资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards/{card_id}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: 获取卡片
      description: 返回单张卡片的完整内容，含通用渲染块、操作、来源与 i18n 文本。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - name: locale
          in: query
          schema:
            type: string
            example: zh-CN
        - name: card_schema_max
          in: query
          description: 客户端支持的最高卡片 schema 版本（`<major>.<minor>`）。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
        - name: X-Card-Schema-Version
          in: header
          description: 客户端支持的最高卡片 schema 版本，与 `card_schema_max` 等效。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
      responses:
        '200':
          description: 卡片详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Cards]
      operationId: updateCard
      summary: 更新卡片状态
      description: 客户端只可把卡片标记为已读或已忽略；其他状态由网关按操作与过期时间推进。
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardStateRequest'
      responses:
        '200':
          description: 更新后的卡片。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards/{card_id}/actions/{action_id}:
    post:
      tags: [Cards]
      operationId: actOnCard
      summary: 执行卡片操作
      description: |
        执行卡片上的操作（批准、拒绝、打开链接、回调、忽略）。

        **幂等（强制）**：本接口 `Idempotency-Key` 必填。同一次用户意图复用同一个 key，
        超时重试也复用同一个 key；同 key 重放返回原回执（状态码、回执内容一致），
        不会返回 409。新的用户意图必须用新的 key。

        **有效风险等级**：`effective_risk = action.risk ?? card.risk`。只要有效 risk 为
        `high`，App **必须**二次确认 + Face ID，不论服务端是否下发 `confirmation`；
        服务端漏配不得导致绕过。

        **高风险流程（C3.1 / C4）**：
        1. App 完成 Face ID 后调用
           `POST /cards/{card_id}/actions/{action_id}/challenge` 取一次性 challenge。
        2. App 用 Secure Enclave 设备密钥对
           `card_id + action_id + revision + challenge` 签名，得到 `assertion`。
        3. 提交本接口，带 `assertion`、`challenge`、`revision`。
        4. 缺失或无效返回 403 `card.step_up_required` / `card.assertion_invalid`；
           challenge 过期 `card.challenge_expired`；challenge 不匹配 `card.challenge_invalid`。

        **并发**：`revision` 用于防 TOCTOU。approval 类型或有效 risk=high 时必填；
        与当前卡片 revision 不一致返回 409 `card.revision_conflict`（响应附带最新卡片）。

        已处理过的卡片再次操作返回 409 `card.already_decided`（同 key 幂等重放除外）。
        操作全程写入审计，回执带 `audit_id`，可用 `GET /audit/{audit_id}` 查询。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/CardActionIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardActionRequest'
      responses:
        '200':
          description: 操作回执（同 key 重放返回同一回执）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards/{card_id}/actions/{action_id}/challenge:
    post:
      tags: [Cards]
      operationId: createCardActionChallenge
      summary: 申请高风险操作 challenge
      description: |
        为高风险卡片操作签发一次性 challenge。App 完成 Face ID 后用 Secure Enclave
        设备密钥（或 App Attest 密钥）对 `card_id + action_id + revision + challenge`
        签名，得到 `assertion`，再提交到 `POST /cards/{card_id}/actions/{action_id}`。

        只在有效 risk 为 `high` 时需要；低风险操作直接提交操作接口即可。
        challenge 短时有效（默认 120 秒），单次使用，绑定卡片、操作与 revision，
        因此不能跨卡、跨操作或跨版本重放。

        返回的 `algorithm` 声明签名算法（如 `p256`），`assertion` 的字节编码由 D2.1 定义；
        当前只要求签名输入包含上述四个字段。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardActionChallengeRequest'
      responses:
        '201':
          description: 已签发 challenge。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit/{audit_id}:
    get:
      tags: [Audit]
      operationId: getAuditRecord
      summary: 查询卡片操作审计记录
      description: |
        按 `audit_id` 查询卡片操作（授权、拒绝、回调、忽略）的审计记录。
        `CardActionReceipt.audit_id` 即此处的 ID。审计记录 append-only，
        `decision` 字段说明操作结果，`before_revision` / `after_revision` 说明决策前后版本。
      parameters:
        - name: audit_id
          in: path
          required: true
          description: 审计记录 ID（来自 `CardActionReceipt.audit_id`）。
          schema:
            type: string
      responses:
        '200':
          description: 审计记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        占位鉴权方案。调用方在 `Authorization: Bearer <gateway-token>` 中携带网关签发的令牌。
        令牌签发、轮换与 scope 管理不在 v1 契约内；任何真实令牌都不得写入本仓库。
        示例占位：`<change-me>`。

  parameters:
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: 角色 ID。
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: 会话 ID（网关 ID，不是 Matrix room ID）。
      schema:
        type: string
    CardId:
      name: card_id
      in: path
      required: true
      description: 卡片 ID。
      schema:
        type: string
    CapabilityId:
      name: capability_id
      in: path
      required: true
      description: 能力 ID，例如 `memory.search`。
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
    ActionId:
      name: action_id
      in: path
      required: true
      description: 卡片内操作 ID。
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: 不透明分页游标；不传表示第一页。
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: 每页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        幂等键，建议使用随机值并在重试时复用。同一 key 相同请求体返回同一结果；
        同一 key 不同请求体返回 409 `idempotency.conflict`。

        缓存对**所有 `outcome` 生效**，包括 `queued` / `deferred`：重放返回同一
        `queue_id` 与当前状态，不会新建排程；排程进入终态（`delivered` / `blocked`）后，
        重放返回终态回执。因此客户端在任何情况下都可以安全重试。

        卡片操作接口另有必填版本 `CardActionIdempotencyKey`。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CardActionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **必填**。同一次用户意图（一次「批准」/「拒绝」点击及其超时重试）复用同一个 key；
        同 key 重放返回原回执，不会返回 409。新的用户意图必须用新的 key。
        8–128 字符，建议随机 UUID。
      schema:
        type: string
        minLength: 8
        maxLength: 128

  headers:
    XRequestId:
      description: 本次请求的追踪 ID，排查问题时提供。
      schema:
        type: string
    RetryAfter:
      description: 建议重试等待秒数（与响应体 `retry_after_seconds` 一致）。
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: 请求格式或参数错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 缺少或无效的访问令牌。
      headers:
        WWW-Authenticate:
          description: 鉴权质询。
          schema:
            type: string
            example: Bearer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        身份有效但无权限（scope 不足、非资源所有者、关系拒绝，或会话硬约束
        `conversation.e2ee`：加密/`ai_participation=disabled` 会话禁止代 AI 发言）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在或对调用方不可见。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状态冲突（revision 不一致、幂等键冲突、资源仍被占用、卡片已处理）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 语法正确但语义不合法（范围、枚举组合、卡片结构等）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 请求频率超限（传输层限流，不是发言额度）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 网关内部错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ----- 通用 -----
    Problem:
      type: object
      description: |
        RFC 9457 problem details。`code` 是稳定的机器可读错误码（见 contract.md 错误码表），
        `type` 为 `urn:botville:error:<code>`。策略结论（额度、静默、熔断）不通过本结构返回，
        而是 200 响应中的 `outcome: blocked`。
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          example: urn:botville:error:request.invalid
        title:
          type: string
          example: Request is invalid
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          example: request.invalid
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retry_after_seconds:
          type: integer
          minimum: 0
      additionalProperties: true

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: limit
        code:
          type: string
          example: out_of_range
        message:
          type: string

    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；`has_more` 为 false 时为 null。
        has_more:
          type: boolean

    Actor:
      type: object
      required: [id, kind, display_name]
      properties:
        id:
          type: string
          description: Matrix 用户 ID 或网关角色 ID。
        kind:
          type: string
          enum: [human, ai]
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        homeserver:
          type: string
        persona_id:
          type: string

    # ----- 角色 -----
    ModelBinding:
      type: object
      required: [provider_id, model, credential_ref]
      properties:
        provider_id:
          type: string
          description: 模型提供方标识，例如 `deepseek`、`openai-compatible`。
        model:
          type: string
          example: deepseek-chat
        base_url:
          type: string
          format: uri
        credential_ref:
          type: string
          description: |
            只允许密钥引用（环境变量名或密钥库键名）。网关绝不接受明文密钥，
            也不在响应中回显密钥值。
          example: 'env:LLM_API_KEY'

    SilentHours:
      type: object
      description: 静默时段。跨午夜（start > end）合法。
      required: [start, end, timezone]
      properties:
        enabled:
          type: boolean
          default: true
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '23:00'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '07:30'
        timezone:
          type: string
          example: Asia/Shanghai

    ProactiveSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        max_per_day:
          type: integer
          minimum: 0
          maximum: 100
          default: 6
        require_reply:
          type: boolean
          description: 对方未回复时是否允许继续主动发言。
          default: true
        quiet_hours:
          $ref: '#/components/schemas/SilentHours'

    RelationDefaults:
      type: object
      properties:
        friend_request_policy:
          type: string
          enum: [approval_required, autonomous]
          default: approval_required
        private_chat:
          type: string
          enum: [friends, anyone, nobody]
          default: friends
        moments_visibility:
          type: string
          enum: [friends, paired_servers, nobody]
          default: friends

    MemorySettings:
      type: object
      properties:
        scope:
          type: string
          enum: [conversation, persona, none]
          default: persona
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 365

    Persona:
      type: object
      required: [id, owner_id, display_name, kind, status, revision, created_at, updated_at]
      properties:
        id:
          type: string
          example: persona_demo
        owner_id:
          type: string
          example: '@owner:example.invalid'
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [builtin_template, custom, adapter]
        status:
          type: string
          enum: [active, paused, archived]
        visibility:
          type: string
          enum: [private, paired_servers]
          default: private
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
          description: 内置默认性格模板 ID（B2.7），`kind` 为 `builtin_template` 时使用。
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        revision:
          type: integer
          minimum: 1
          description: 乐观并发版本号，每次写操作递增。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Persona'

    CreatePersonaRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [builtin_template, custom, adapter]
          default: custom
        visibility:
          type: string
          enum: [private, paired_servers]
          default: private
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
      additionalProperties: false

    UpdatePersonaRequest:
      type: object
      description: 部分更新；未出现的字段保持不变。
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [active, paused, archived]
        visibility:
          type: string
          enum: [private, paired_servers]
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        revision:
          type: integer
          minimum: 1
          description: 可选。与当前 revision 不一致时返回 409。
      additionalProperties: false

    MoodInput:
      type: object
      properties:
        label:
          type: string
          maxLength: 32
        valence:
          type: number
          minimum: -1
          maximum: 1
        arousal:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false

    PersonaState:
      type: object
      required: [persona_id, mood, needs, updated_at]
      properties:
        persona_id:
          type: string
        mood:
          type: object
          required: [label, valence, arousal, updated_at]
          properties:
            label:
              type: string
            valence:
              type: number
              minimum: -1
              maximum: 1
            arousal:
              type: number
              minimum: 0
              maximum: 1
            updated_at:
              type: string
              format: date-time
        needs:
          type: array
          items:
            type: object
            required: [key, level]
            properties:
              key:
                type: string
                example: social
              level:
                type: number
                minimum: 0
                maximum: 1
        proactive:
          type: object
          properties:
            remaining_today:
              type: integer
              minimum: 0
            reset_at:
              type: string
              format: date-time
        updated_at:
          type: string
          format: date-time

    UpdatePersonaStateRequest:
      type: object
      properties:
        mood:
          $ref: '#/components/schemas/MoodInput'
        needs:
          type: array
          items:
            type: object
            required: [key, level]
            properties:
              key:
                type: string
              level:
                type: number
                minimum: 0
                maximum: 1
        reason:
          type: string
          maxLength: 200
          description: 事件来源说明，写入审计。
      additionalProperties: false

    # ----- 会话 -----
    Relation:
      type: object
      required: [state, direction, policy]
      properties:
        state:
          type: string
          enum: [friend, pending, stranger, blocked]
        direction:
          type: string
          enum: [none, outgoing, incoming]
        policy:
          type: string
          enum: [approval_required, autonomous]

    ConversationLimits:
      type: object
      description: 会话视图上的限额快照，完整计算见 GET /limits。
      required: [messages_remaining, tokens_remaining, reset_at, silent_hours_active]
      properties:
        messages_remaining:
          type: [integer, 'null']
        tokens_remaining:
          type: [integer, 'null']
        reset_at:
          type: string
          format: date-time
        silent_hours_active:
          type: boolean
        circuit_breaker_open:
          type: boolean

    Conversation:
      type: object
      required:
        - id
        - matrix_room_id
        - type
        - participants
        - persona_ids
        - encryption
        - ai_participation
        - relation
        - limits
        - memory_scope
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: string
          example: conv_demo
        matrix_room_id:
          type: string
          example: '!demo:example.invalid'
        type:
          type: string
          enum: [direct, group, ai_group, town]
        title:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        persona_ids:
          type: array
          items:
            type: string
        encryption:
          type: string
          enum: [none, e2ee]
          description: |
            Matrix 房间的加密状态。含 AI 的会话使用 `none`，App 不提供开启；
            成员通过 App 策略检查的会话可由用户确认开启。
        ai_participation:
          type: string
          enum: [enabled, disabled]
          description: |
            E2EE 房间中必须为 `disabled`，网关不得代 AI 发言；不表示已撤销 Matrix
            成员资格或密钥。对该会话的 AI 发言/预检返回 `403 conversation.e2ee`。
        relation:
          $ref: '#/components/schemas/Relation'
        limits:
          $ref: '#/components/schemas/ConversationLimits'
        memory_scope:
          type: string
          enum: [conversation, persona, none]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time

    ConversationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    CreateConversationRequest:
      type: object
      required: [matrix_room_id, type, persona_ids]
      properties:
        matrix_room_id:
          type: string
        type:
          type: string
          enum: [direct, group, ai_group, town]
        persona_ids:
          type: array
          items:
            type: string
          minItems: 1
        title:
          type: string
        encryption:
          type: string
          enum: [none, e2ee]
          default: none
          description: |
            Matrix 房间加密状态。与 `ai_participation=enabled` 同时为 `e2ee` 时返回
            `422 request.invalid`。
        ai_participation:
          type: string
          enum: [enabled, disabled]
          description: |
            省略时按 `encryption` 推导（`e2ee`→`disabled`，`none`→`enabled`）。
            显式 `enabled` 不得与 `encryption=e2ee` 组合。
      additionalProperties: false

    # ----- 消息与策略 -----
    MessageContent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, markdown, card, system_event]
        text:
          type: string
          description: '当 `type` 为 text / markdown / system_event 时必填。'
        card_id:
          type: string
          description: '当 `type` 为 card 时必填。'
        mentions:
          type: array
          items:
            type: string

    MessageProvenance:
      type: object
      required: [origin, external]
      properties:
        origin:
          type: string
          enum: [human, ai, system, bridge, town]
        external:
          type: boolean
          description: 是否来自本服之外（联邦、桥接、外部插件）。
        forwarded_from:
          type: [string, 'null']

    Message:
      type: object
      required: [id, conversation_id, sender, content, trust, provenance, created_at, redacted]
      properties:
        id:
          type: string
          example: msg_demo
        matrix_event_id:
          type: string
          example: $demo_event
        conversation_id:
          type: string
        sender:
          $ref: '#/components/schemas/Actor'
        content:
          $ref: '#/components/schemas/MessageContent'
        trust:
          type: string
          enum: [trusted, untrusted, system]
        provenance:
          $ref: '#/components/schemas/MessageProvenance'
        reply_to:
          type: string
        usage:
          $ref: '#/components/schemas/UsageDelta'
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 8
          description: |
            透传元数据（#92）：由发送请求原样带回，不参与策略判断、不进消息正文，
            仅供调用方对账。
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
        redacted:
          type: boolean

    MessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    OutgoingContent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text, markdown]
        text:
          type: string
          minLength: 1
          maxLength: 8000
        mentions:
          type: array
          items:
            type: string
      additionalProperties: false

    OutgoingMessageRequest:
      type: object
      required: [sender_persona_id, content]
      properties:
        sender_persona_id:
          type: string
        content:
          $ref: '#/components/schemas/OutgoingContent'
        reply_to:
          type: string
          description: 被回复消息的 `id` 或 `matrix_event_id`。
        token_estimate:
          type: integer
          minimum: 0
          description: 预计消耗 token；用于发送前预算检查，未提供时网关按历史均值估算。
        allow_deferred:
          type: boolean
          default: true
          description: 静默时段内是否允许排到时段结束后发送；false 时直接返回 blocked。
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 8
          description: 透传元数据，不参与策略判断，不写入消息正文。
        peer_id:
          type: string
          description: |
            会话对端（persona）标识。三层限额的 peer 层只在请求带上该字段时
            生效；与 `POST /policy/evaluate` 的 `peer_id` 语义相同。
      additionalProperties: false

    UsageDelta:
      type: object
      required: [tokens_in, tokens_out, total_tokens]
      properties:
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0
          default: 0

    PolicyReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: anti_spam.consecutive
        message:
          type: string
          description: 面向调用方的简短原因（不含内部提示词或不可信内容原文）。
        layer:
          type: string
          enum: [platform, owner, peer, system]

    PolicyCheck:
      type: object
      description: 单项策略检查。`key` 推荐取值见 contract.md 限额一节。
      required: [key, layer, allowed]
      properties:
        key:
          type: string
          example: tokens.window
        layer:
          type: string
          enum: [platform, owner, peer, system]
        allowed:
          type: boolean
        limit:
          type: [number, 'null']
        used:
          type: number
          minimum: 0
        remaining:
          type: [number, 'null']
        reset_at:
          type: [string, 'null']
          format: date-time
        code:
          type: string
          description: 未通过时的原因码。
        source_id:
          type: string
          description: 该层规则的来源（角色、会话或对方角色 ID）。

    PolicyDecision:
      type: object
      required: [decision, allowed, evaluated_at, retryable, checks]
      properties:
        decision:
          type: string
          enum: [allow, defer, block]
        allowed:
          type: boolean
          description: |
            `allow` → `true`；`block` → `false`；
            `defer` → `false`（服务端排程延后，当前时刻不允许立即发言；
            最终会投递但不是「立即允许」）。
        evaluated_at:
          type: string
          format: date-time
        winner_layer:
          type: [string, 'null']
          enum: [platform, owner, peer, null]
          description: 最严格限制所属的层。
        retryable:
          type: boolean
          description: |
            `block` 时为 `false`（同一内容不重试）；`defer` 时为 `false`
            （客户端不自行重试，服务端排程后推送）；`allow` 时为 `false`（已允许无需重试）。
            此字段是 `PolicyDecision` 自身的语义，以 `MessageReceipt.retryable` 为权威来源。
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/PolicyReason'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCheck'

    PolicyEvaluateRequest:
      type: object
      required: [persona_id]
      properties:
        persona_id:
          type: string
        conversation_id:
          type: string
        kind:
          type: string
          enum: [message, proactive, town_action]
          default: message
        content:
          type: string
          maxLength: 8000
          description: 拟发送文本；用于长度与注入相关检查。
        token_estimate:
          type: integer
          minimum: 0
          description: |
            预计消耗 token；网关按 `max(token_estimate, estimate_tokens(content))`
            计量，客户端值只是下限，不能用 `0` 绕过 token 预算。
        peer_id:
          type: string
          description: |
            会话对端（persona）标识，用于触发 peer 层限额。省略时不参与 peer 层
            计算；实发路径请与 `OutgoingMessageRequest.peer_id` 保持一致，否则
            预检与实发结论可能不同。
      additionalProperties: false

    MessageReceipt:
      type: object
      description: |
        `outcome` 是网关的发言裁决：`delivered` 已投递、`queued` 已入队（带 `queue_id`）、
        `deferred` 延后到允许时段（服务端排程，带 `queue_id`，客户端**不要**自行重试）、
        `blocked` 本次不允许（**不重试**，`retryable: false`；原因见 `decision.reasons`；
        记 `usage_events kind=blocked`）。

        `retryable` / `retry_after_seconds` 只在本结构内有效，`PolicyDecision` 内的同名字段
        仅在 `POST /policy/evaluate` 单独使用时有意义，两处语义相同但不互相引用。

        **200 响应不附带 `Retry-After` HTTP 头**；重试时机放 body 里。

        三分表（供通知 / 重试 / 审计统一口径）：
        - **成功**：`delivered` / `queued` / `deferred`，2xx，不是错误
        - **策略拦截**：`blocked`，2xx，不重试，记 `usage_events kind=blocked`
        - **失败**：4xx / 5xx，body 为 problem+json，按 `code` 决定重试策略
      required: [outcome, retryable, decision]
      properties:
        outcome:
          type: string
          enum: [delivered, queued, deferred, blocked]
        retryable:
          type: boolean
          description: |
            `delivered` → `false`；`queued` / `deferred` → `false`（服务端排程，客户端不重试）；
            `blocked` → **始终 `false`**（同一内容不再重试；若额度会恢复见 `may_clear_at`）。
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            `blocked` 时始终 `null`（不重试）；`deferred` 时为服务端排程到允许时段的等待秒数（仅供参考显示，不要用它自动重试）。
        may_clear_at:
          type: [string, 'null']
          format: date-time
          description: |
            `blocked` 时可选：额度预计恢复时间（如周期窗口重置时间）。与 `retryable: false`
            不矛盾——当前内容被拦截不重试，但用户换内容后可以在该时间后重试。
        same_content_allowed:
          type: boolean
          description: |
            `false`：同一内容即使额度恢复也不允许再发（例如关系策略永久拒绝，或
            内容本身触发了策略）。`true` 或省略：额度/窗口恢复后同一内容可重发
            （例如限额触发了熔断，内容本身没有问题）。
        queue_id:
          type: [string, 'null']
          description: |
            `queued` / `deferred` 时为服务端排程 ID（必填，用于追踪投递状态）。
            幂等缓存对 `queued` / `deferred` **同样生效**：用同一 `Idempotency-Key` 重放
            返回同一 `queue_id` 与当前状态，不会新建排程；排程进入终态后，重放返回终态回执
            （`delivered` / `blocked`）。
        message:
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        delivery:
          anyOf:
            - type: object
              required: [matrix_event_id, delivered_at]
              properties:
                matrix_event_id:
                  type: string
                delivered_at:
                  type: string
                  format: date-time
            - type: 'null'
        usage_delta:
          $ref: '#/components/schemas/UsageDelta'
        decision:
          $ref: '#/components/schemas/PolicyDecision'

    # ----- 限额 -----
    AntiSpamRules:
      type: object
      properties:
        max_consecutive_ai_messages:
          type: integer
          minimum: 1
          maximum: 50
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 86400

    AiLoopRules:
      type: object
      properties:
        max_ai_messages_per_hour:
          type: integer
          minimum: 0
          maximum: 1000
        on_break:
          type: string
          enum: [stop, notify]
          default: stop

    LimitRules:
      type: object
      description: |
        各字段都是「该层可选设置」；**省略**表示该层不额外限制，不等于关闭其他层。
        最终生效值取三层中最严者（逐项比较，不是整层覆盖）。

        **窗口类限额按「速率对」取最严**：`messages_per_window` 与
        `tokens_per_window` 各自和它的 `window_seconds` 是一个整体，比较的是
        `count / window`；胜出层成对采用自己的 `count` + `window`（该层省略
        `window_seconds` 时回退平台窗口）。**`window_seconds` 不单独比较**：
        只缩短窗口同样算放宽，`PUT /limits` 会返回 `422 limit.out_of_range`。

        **`0` 的语义**：本 schema 内的 `0` 是有效限额（例如 `messages_per_window: 0`
        表示一条都不允许），不是「不限」。要表达「该层不限制」请省略该字段。

        严格方向：`proactive_per_day` / `town_tokens_per_day` / `max_message_chars`
        越小越严；`min_seconds_between_messages` 与 `silent_hours.enabled: true`
        越大/越严。
        owner / peer 层任何一项比平台层宽松 → `422 limit.out_of_range`。
      properties:
        window_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          default: 86400
          description: |
            窗口类限额（`messages_per_window`、`tokens_per_window`）的窗口长度。
            与同一层的计数项**成对**参与比较，不单独参与「取最严」；该层省略时
            沿用平台窗口。
        messages_per_window:
          type: integer
          minimum: 0
        tokens_per_window:
          type: integer
          minimum: 0
        proactive_per_day:
          type: integer
          minimum: 0
        town_tokens_per_day:
          type: integer
          minimum: 0
        max_message_chars:
          type: integer
          minimum: 1
          maximum: 8000
        min_seconds_between_messages:
          type: integer
          minimum: 0
          maximum: 86400
        silent_hours:
          $ref: '#/components/schemas/SilentHours'
        anti_spam:
          $ref: '#/components/schemas/AntiSpamRules'
        ai_loop:
          $ref: '#/components/schemas/AiLoopRules'

    LimitPolicy:
      type: object
      required: [layer, scope, scope_id, rules]
      properties:
        layer:
          type: string
          enum: [owner, peer]
          description: 平台底线层只读，不接受写入。
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        rules:
          $ref: '#/components/schemas/LimitRules'
      additionalProperties: false

    LimitLayer:
      type: object
      required: [layer, scope, scope_id, rules]
      properties:
        layer:
          type: string
          enum: [platform, owner, peer]
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        rules:
          $ref: '#/components/schemas/LimitRules'
        updated_at:
          type: string
          format: date-time

    EffectiveLimit:
      type: object
      required: [key, value, unit, source_layer, source_id]
      properties:
        key:
          type: string
          example: tokens_per_window
        value: {}
        unit:
          type: string
          enum: [count, tokens, seconds, chars, boolean]
        source_layer:
          type: string
          enum: [platform, owner, peer]
        source_id:
          type: string

    EffectiveLimits:
      type: object
      required: [scope, scope_id, generated_at, effective, layers]
      properties:
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        generated_at:
          type: string
          format: date-time
        effective:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveLimit'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LimitLayer'

    # ----- 用量 -----
    UsageTotals:
      type: object
      required:
        - messages_sent
        - messages_blocked
        - messages_deferred
        - tokens_in
        - tokens_out
        - tokens_total
        - proactive_messages
        - model_calls
        - town_tokens
      properties:
        messages_sent:
          type: integer
          minimum: 0
        messages_blocked:
          type: integer
          minimum: 0
        messages_deferred:
          type: integer
          minimum: 0
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        tokens_total:
          type: integer
          minimum: 0
        proactive_messages:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0

    UsageBudget:
      type: object
      required: [limit, used, remaining, reset_at]
      properties:
        limit:
          type: [integer, 'null']
          minimum: 0
        used:
          type: integer
          minimum: 0
        remaining:
          type: [integer, 'null']
          minimum: 0
        reset_at:
          type: [string, 'null']
          format: date-time
        source_layer:
          type: [string, 'null']
          enum: [platform, owner, peer, null]

    UsageBucket:
      type: object
      required: [key, messages_sent, tokens_total, town_tokens]
      properties:
        key:
          type: string
          description: 分桶键（会话 ID、日期、能力 ID 或模型 ID）。
        messages_sent:
          type: integer
          minimum: 0
        tokens_total:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0

    UsageSummary:
      type: object
      required: [from, to, timezone, totals, budget, breakdown]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Shanghai
        persona_id:
          type: string
        conversation_id:
          type: string
        totals:
          $ref: '#/components/schemas/UsageTotals'
        budget:
          $ref: '#/components/schemas/UsageBudget'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/UsageBucket'

    UsageEvent:
      type: object
      required: [id, occurred_at, kind]
      description: |
        一条用量审计记录。

        **不含消息正文**（#92）：为保护用户隐私，事件**不存储**消息内容。
        `text_length` 存储原始字节数（字符数），`text_sha256` 存储正文的
        SHA-256 十六进制摘要，二者可用于对账与去重排查，但无法反推原文。
        旧字段 `text_preview` 已从 B2.1 起**不再写入**；历史事件若存在该字段，
        客户端必须忽略它（`additionalProperties` 遵循前向兼容原则）。
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [model_call, message_sent, blocked, message_blocked, proactive_message, town_action, image_generation, card_action]
          description: |
            `blocked` 是策略拦截的规范值；`message_blocked` 为旧别名。
            `card_action` 记录一次卡片操作（与 `audit_id` 关联）。
        persona_id:
          type: string
        conversation_id:
          type: string
        capability_id:
          type: string
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0
        decision_code:
          type: string
        audit_id:
          type: [string, 'null']
          description: 仅 `card_action` kind 时有值；与 `AuditRecord.id` 对应。
        request_id:
          type: string
        text_length:
          type: integer
          minimum: 0
          description: 消息正文的字符数（不含正文本身）。可用于统计分析与对账。
        text_sha256:
          type: string
          description: |
            消息正文的 SHA-256 十六进制摘要。用于去重与对账，不可反推原文。
            正文为空时此字段省略。

    UsageEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UsageEvent'

    # ----- 功能清单 -----
    CapabilityIcon:
      type: object
      required: [type, value]
      properties:
        type:
          description: |
            开放枚举：`sf_symbol` / `url`。客户端遇到未知类型时忽略图标并按无图标渲染。
          anyOf:
            - enum: [sf_symbol, url]
            - type: string
        value:
          type: string
          description: SF Symbol 名称或图标 URL。
        fallback:
          type: string
          description: |
            `type: sf_symbol` 时的回退 symbol 名（设备系统没有主 symbol 时使用）；
            仍不可用时按无图标渲染。

    CapabilityEntry:
      type: object
      description: |
        模块入口。`native` 使用 App 内置页面与 `deep_link`；`web` 用内置浏览器打开 `web_url`，
        需先取一次性 code；`card_list` 直接在动态页渲染指定类型的卡片。未知 entry 类型视为
        `none`，App 忽略该入口但保留能力。
      required: [type]
      properties:
        type:
          description: |
            开放枚举：`native` / `web` / `card_list` / `none`。
            **未知类型一律按 `none` 处理**——保留能力、忽略入口，不得导致清单解码失败。
          anyOf:
            - enum: [native, web, card_list, none]
            - type: string
        deep_link:
          type: string
          example: botville://chat
        web_url:
          type: string
          format: uri
          example: https://gateway.example.invalid/modules/memory/
        card_types:
          type: array
          items:
            type: string

    CapabilityI18nText:
      type: object
      required: [title]
      properties:
        title:
          type: string
        summary:
          type: string
        description:
          type: string

    CapabilityI18n:
      type: object
      description: 语言代码到本地化文本的映射；缺省时回退顶层字段。
      additionalProperties:
        $ref: '#/components/schemas/CapabilityI18nText'

    CapabilitySessionConfig:
      type: object
      required: [supported]
      properties:
        supported:
          type: boolean
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: |
            模块网页会话的建议有效期（秒），上限 3600。WKWebView 会话是短时的，
            不再支持 24 小时这种长值。

    Capability:
      type: object
      required: [id, module, version, title, summary, status, entry, scopes]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
          example: memory.search
        module:
          description: |
            开放枚举：所属模块，与仓库模块名一致（`core`/`role`/`memory`/`social`/`notify`/
            `bridge`/`town`）。未知 module 照常显示能力，按「其他」分组。
          anyOf:
            - enum: [core, role, memory, social, notify, bridge, town]
            - type: string
          example: memory
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 0.9.0
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        icon:
          $ref: '#/components/schemas/CapabilityIcon'
        status:
          description: |
            开放枚举：`enabled` / `disabled` / `degraded`。
            **未知 status 按 `disabled` 处理**（入口隐藏），不得导致整份清单解码失败。
          anyOf:
            - enum: [enabled, disabled, degraded]
            - type: string
        unavailable_reason:
          type: string
          description: 不可用或降级时的机器可读原因，例如 `module_disabled`。
        entry:
          $ref: '#/components/schemas/CapabilityEntry'
        scopes:
          type: array
          items:
            type: string
          description: 调用该能力所需的网关 scope。
        requires:
          type: array
          items:
            type: string
          description: 依赖的其他能力 ID；依赖不可用时本能力不可用。
        session_token:
          $ref: '#/components/schemas/CapabilitySessionConfig'
        min_app_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        i18n:
          $ref: '#/components/schemas/CapabilityI18n'
        updated_at:
          type: string
          format: date-time

    CapabilityManifest:
      type: object
      required: [manifest_version, contract_version, generated_at, capabilities]
      properties:
        manifest_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 1.2.0
        contract_version:
          type: string
          description: 生成该清单的网关契约版本。
          example: 0.1.0
        generated_at:
          type: string
          format: date-time
        cache_ttl_seconds:
          type: integer
          minimum: 0
          default: 300
        defaults:
          type: object
          properties:
            unknown_capability:
              type: string
              enum: [hidden, disabled]
              default: hidden
              description: |
                遇到未知能力 ID 时的处理方式：`hidden`（忽略，不显示入口）或
                `disabled`（显示为不可用）。仅适用 native 入口（无法路由到对应能力时）。
            card_fallback:
              type: string
              enum: [text]
              default: text
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    SessionTokenRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: |
            要打开的模块网页地址。必须与能力的 `entry.web_url` 同源；网关把一次性 `code`
            作为查询串附加后返回。App 不得自行拼接 `code`。
          example: https://gateway.example.invalid/modules/memory/
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
          description: |
            App 允许在**内置浏览器**内加载的 origin 白名单。只在该列表内放行导航；
            跳到其他 origin 时改用外部浏览器打开。省略时默认为 `url` 的 origin。
          example: ['https://gateway.example.invalid']
        scopes:
          type: array
          items:
            type: string
          description: 请求的 scope 子集，不得超出能力声明的 scopes。
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: 会话有效期（秒），**上限 3600**。一次性 `code` 本身的 TTL ≤ 60 秒，与此无关。
      additionalProperties: false

    SessionToken:
      type: object
      description: |
        一次性 code 交换信息。`code` 单次使用、≤ 60 秒有效，只能由模块页面拿去换
        HttpOnly cookie；App 不得把它当长期凭据保存或以 `Authorization` 头发送。
      required: [code, code_ttl_seconds, expires_at, audience, url, allowed_origins]
      properties:
        code:
          type: string
          description: 一次性 code，占位示例。TTL ≤ 60 秒，单次使用。
          example: <change-me>
        code_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: code 的有效期（秒），上限 60。
        expires_at:
          type: string
          format: date-time
          description: 兑换出的 cookie 会话到期时间（`now + ttl_seconds`，≤ 3600 秒）。
        audience:
          type: string
          description: 该会话仅适用于对应 capability ID。
        url:
          type: string
          format: uri
          description: |
            建议打开的模块网页地址，**已附带一次性 `code`**。这是唯一允许出现 `code`
            的位置；不得写入日志、localStorage 或长期缓存。
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
          description: 内置浏览器放行的 origin 白名单；超出即改用外部浏览器。
        renew_via:
          type: string
          enum: [js_bridge]
          default: js_bridge
          description: |
            会话续期方式：页面通过 JS bridge 消息 `botville.session.renew` 通知 App，
            App 重新调用 `session-tokens`。页面脚本不得自行续期。

    SessionCookieRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 从 `session-tokens` 一次性 code 获取的原始值。
          example: <change-me>
      additionalProperties: false

    # ----- 卡片 -----
    CardBlockItem:
      type: object
      required: [label]
      properties:
        label:
          type: string
        value:
          type: string
        emphasis:
          type: boolean
          default: false

    CardBlock:
      type: object
      description: |
        通用渲染块。字段按 `type` 取用，见 contract.md 卡片一节：
        text→text；key_value/list→items；divider→无；image→url、alt；
        progress→value、max、label；code→text。

        `type` 是开放枚举：客户端遇到未知块类型时**跳过该块**继续渲染其余内容，
        不得因未知块导致整卡解码失败。
      required: [type]
      properties:
        type:
          description: |
            开放枚举：`text` / `key_value` / `divider` / `image` / `progress` / `list` / `code`。
            未知类型 → 跳过此块。
          anyOf:
            - enum: [text, key_value, divider, image, progress, list, code]
            - type: string
        text:
          type: string
          maxLength: 4000
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlockItem'
        url:
          type: string
          format: uri
          description: '`image` 块只接受 `https` URL；加载失败时显示 `alt`。'
        alt:
          type: string
          description: 图片替代文本；也用于图片加载失败时的占位。
        aspect_ratio:
          type: number
          description: 可选宽高比（如 `1.777`），供客户端预留布局高度、避免列表跳动。
          exclusiveMinimum: 0
        label:
          type: string
        value:
          type: number
        max:
          type: number
        level:
          description: |
            开放枚举：`info` / `success` / `warning` / `danger`。未知 level 按无颜色渲染。
          anyOf:
            - enum: [info, success, warning, danger]
            - type: string

    CardActionConfirmation:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
        title:
          type: string
        body:
          type: string
        biometric:
          type: boolean
          description: |
            高风险操作必须为 true，App 完成 Face ID 后提交 assertion。
            若服务端漏配而有效 risk 为 `high`，App 仍**强制**二次确认 + Face ID。

    CardAction:
      type: object
      required: [id, label, kind, style]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          description: |
            开放枚举：`approve` / `deny` / `open_url` / `callback` / `dismiss`。
            **未知 kind → 隐藏该按钮**（保留其余操作），不得整卡解码失败。
          anyOf:
            - enum: [approve, deny, open_url, callback, dismiss]
            - type: string
        style:
          description: |
            开放枚举：`primary` / `secondary` / `danger`。未知 style 按 `secondary`。
          anyOf:
            - enum: [primary, secondary, danger]
            - type: string
        risk:
          description: |
            可选，缺省继承卡片 `risk`。有效风险为 `action.risk ?? card.risk`。
            **未知 risk 按 `high` 处理**（二次确认 + Face ID）。
          anyOf:
            - enum: [low, medium, high]
            - type: string
        target:
          description: |
            `kind: open_url` 时打开链接的位置：`in_app` 用内置浏览器（可携带该能力的
            session cookie），`external` 用系统浏览器。缺省 `external`。
          anyOf:
            - enum: [in_app, external]
            - type: string
        capability_id:
          type: string
          description: '`target: in_app` 时可选，指明用哪个能力的会话打开链接。'
        url:
          type: string
          format: uri
          description: '当 `kind` 为 open_url 时必填，且为 `https`。'
        payload:
          type: object
          description: 回传给来源模块的不透明数据；不得包含密钥或无关个人信息。
        confirmation:
          $ref: '#/components/schemas/CardActionConfirmation'
        disabled_reason:
          type: string

    CardSource:
      type: object
      required: [module]
      anyOf:
        - required: [event_id]
        - required: [dedupe_key]
      properties:
        module:
          description: |
            开放枚举：产生卡片的模块，对齐 Capability 的 module（`core`/`role`/`memory`/
            `social`/`notify`/`bridge`/`town`）。未知 module 照常显示。
          anyOf:
            - enum: [core, role, memory, social, notify, bridge, town]
            - type: string
        capability_id:
          type: string
          description: |
            来源能力 ID。创建时校验它属于调用方的 scope；`notification` / `approval`
            卡片必填，用于去重与来源识别。
        event_id:
          type: string
          description: |
            来源事件的稳定 ID。与 `source.dedupe_key` 二选一必填（优先使用此字段）。
            服务端按 `(capability_id, event_id ?? dedupe_key)` 去重：同一键重复创建返回已有卡片，
            不会重复打扰。
        dedupe_key:
          type: string
          description: |
            去重键，与 `source.event_id` 二选一必填。用于来源没有稳定事件 ID 的桥接场景
            （如外部 webhook、轮询结果）。服务端按 `(capability_id, event_id ?? dedupe_key)` 去重。
        actor:
          $ref: '#/components/schemas/Actor'

    CardContext:
      type: object
      properties:
        conversation_id:
          type: string
        deep_link:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    CardI18nText:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        fallback_text:
          type: string

    CardDelivery:
      type: object
      description: |
        单个投递渠道的投递状态。与 `Card.status`（用户生命周期）分开：
        `status` 表示用户是否已读/已处理，`delivery` 表示渠道是否真的送达。
        模糊结果（超时、回执缺失）记 `unconfirmed`，**不得在同渠道重放**，避免重复打扰。
      required: [channel, state, attempts]
      properties:
        channel:
          description: |
            开放枚举：`push` / `in_app` / `email` / `webhook` 等。未知渠道照常显示状态。
          anyOf:
            - enum: [push, in_app, email, webhook]
            - type: string
        state:
          description: |
            开放枚举：`pending` / `confirmed` / `unconfirmed` / `failed`。
            未知 state 按 `unconfirmed` 处理（不重放该渠道）。
          anyOf:
            - enum: [pending, confirmed, unconfirmed, failed]
            - type: string
        attempts:
          type: integer
          minimum: 0
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
          description: 失败或未确认的机器可读原因，例如 `push.timeout`、`push.receipt_missing`。
        provider_message_id:
          type: [string, 'null']
          description: 渠道侧的消息 ID，用于对账。

    Card:
      type: object
      required:
        - id
        - card_schema_version
        - type
        - title
        - blocks
        - actions
        - priority
        - risk
        - status
        - fallback_text
        - source
        - created_at
      properties:
        id:
          type: string
        card_schema_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 1.0.0
          description: |
            卡片结构版本。**与契约 `info.version` 解耦**：卡片 minor 升级不要求契约升版本，
            卡片 major 可在 `/v1` 内共存（通过协商下发 `fallback_text`）。见 contract.md 4.7。
        type:
          description: |
            开放枚举：`notification` / `approval` / `moment` / `system` / `reminder` / `result`。
            **未知 type → 只用 `fallback_text` 降级渲染**，不崩溃。
          anyOf:
            - enum: [notification, approval, moment, system, reminder, result]
            - type: string
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        fallback_text:
          type: string
          description: 纯文本降级内容；旧客户端、未知类型或渲染失败时展示。
        priority:
          description: |
            开放枚举：`urgent` / `high` / `normal` / `low`。未知 priority 按 `normal` 处理。
          anyOf:
            - enum: [urgent, high, normal, low]
            - type: string
        risk:
          description: |
            开放枚举：`low` / `medium` / `high`。
            **未知 risk 按 `high` 处理**（二次确认 + Face ID），这是安全侧的失败保护。
          anyOf:
            - enum: [low, medium, high]
            - type: string
        status:
          description: |
            开放枚举：`active` / `read` / `dismissed` / `expired` / `acted`。
            未知 status 按 `disabled` 处理（不可操作，但仍可展示）。
          anyOf:
            - enum: [active, read, dismissed, expired, acted]
            - type: string
        blocks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlock'
        actions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CardAction'
        source:
          $ref: '#/components/schemas/CardSource'
        context:
          $ref: '#/components/schemas/CardContext'
        i18n:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CardI18nText'
        delivery:
          type: array
          items:
            $ref: '#/components/schemas/CardDelivery'
          description: 各渠道投递状态；D1.1 用它表达「已确认 / 未确认 / 失败 / 待投递」。
        group_id:
          type: [string, 'null']
          description: 合并展示的组 ID（同组卡片折叠为摘要）。
        collapse_key:
          type: [string, 'null']
          description: 合并键；同键的未读卡片由客户端折叠。
        deliver_after:
          type: [string, 'null']
          format: date-time
          description: 最早投递时间（服务端排程）；`null` 表示立即。
        interrupt:
          type: boolean
          description: |
            是否穿透静默时段立即打断（三态语义：省略 / true / false）。

            省略时由 `priority` 决定：`priority: urgent` → 穿透；其余优先级 → 顺延。
            显式 `true` → 无论优先级都穿透；显式 `false` → 即使 `urgent` 也不打断，
            在静默期间顺延到 `deliver_after`。

            **本字段没有默认值**（0.1.0 起移除 `default: false`）：在 JSON Schema 层面
            区分「未显式给出」与「显式 false」是本节语义的前提，下游代码生成/校验器
            不得补默认值。见 contract.md §4.8。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        acted_at:
          type: [string, 'null']
          format: date-time
        revision:
          type: integer
          minimum: 1

    CardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Card'

    CreateCardRequest:
      type: object
      description: |
        创建卡片。`source` 必填；`source.event_id` 与 `source.dedupe_key` 二选一必填——
        服务端按 `(capability_id, event_id ?? dedupe_key)` 幂等，重复创建返回已有卡片（200），
        不重复投递。

        参与静默检查（见 contract.md §4.8）：`priority: urgent` 默认穿透静默（`interrupt: true` 效果）；
        显式 `interrupt: false` 时即使 `urgent` 也不打断。其余优先级在静默时段内延后到 `deliver_after`。
      required: [type, title, blocks, fallback_text, source]
      properties:
        type:
          type: string
          enum: [notification, approval, moment, system, reminder, result]
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        fallback_text:
          type: string
        priority:
          type: string
          enum: [urgent, high, normal, low]
          default: normal
          description: |
            打断级别：`urgent` 默认穿透静默（除非 `interrupt: false`）；
            `high` 静默时段内延后但置顶；`normal` / `low` 静默时段内延后。
        risk:
          type: string
          enum: [low, medium, high]
          default: low
        blocks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlock'
        actions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CardAction'
        source:
          $ref: '#/components/schemas/CardSource'
        context:
          $ref: '#/components/schemas/CardContext'
        i18n:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CardI18nText'
        expires_at:
          type: string
          format: date-time
          description: |
            `notification` / `approval` 卡片建议设置。approval 或有效 risk=high 时**必填**。
        deliver_after:
          type: [string, 'null']
          format: date-time
          description: 服务端最早投递时间；`null` 表示立即（但仍受静默检查）。
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: 期望展示时间（例如提醒卡片的触发时刻）；与 `deliver_after` 二选一。
        interrupt:
          type: boolean
          description: |
            是否穿透静默时段立即打断（三态语义：省略 / true / false）。

            省略时由 `priority` 决定：`priority: urgent` → 穿透；其余优先级 → 顺延。
            显式 `true` → 无论优先级都穿透；显式 `false` → 即使 `urgent` 也不打断，
            在静默期间顺延到 `deliver_after`。

            **本字段没有默认值**（0.1.0 起移除 `default: false`）：在 JSON Schema 层面
            区分「未显式给出」与「显式 false」是本节语义的前提，下游代码生成/校验器
            不得补默认值。见 contract.md §4.8。
        collapse_key:
          type: [string, 'null']
          description: 合并键；同键未读卡片由客户端折叠展示。
        group_id:
          type: [string, 'null']
          description: 合并展示组 ID。
      additionalProperties: false

    UpdateCardStateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [read, dismissed]
        revision:
          type: integer
          minimum: 1
      additionalProperties: false

    CardActionChallengeRequest:
      type: object
      description: 可选请求体，用于声明客户端支持的签名算法。
      properties:
        algorithm:
          type: string
          enum: [p256]
          default: p256
          description: 期望的签名算法；当前仅 `p256`（Secure Enclave / App Attest 密钥）。
        revision:
          type: integer
          minimum: 1
          description: 可选。声明客户端看到的卡片 revision，challenge 将绑定该值。
      additionalProperties: false

    CardActionChallenge:
      type: object
      description: |
        一次性高风险操作 challenge。`assertion` 必须绑定
        `card_id + action_id + revision + challenge`，防止跨卡、跨操作重放。
      required: [challenge, expires_at, card_id, action_id, revision, algorithm]
      properties:
        challenge:
          type: string
          description: 一次性随机值，单次使用，短时有效。占位示例。
          example: <change-me>
        expires_at:
          type: string
          format: date-time
          description: challenge 过期时间（默认 120 秒）。
        card_id:
          type: string
        action_id:
          type: string
        revision:
          type: integer
          minimum: 1
          description: challenge 绑定的卡片 revision；提交操作时必须回传同一值。
        algorithm:
          type: string
          enum: [p256]
          description: 签名算法，当前仅 `p256`。

    CardActionRequest:
      type: object
      properties:
        payload:
          type: object
          description: 操作附带的表单或选择值，由操作声明决定；不得包含密钥。
        revision:
          type: integer
          minimum: 1
          description: |
            客户端看到的卡片 revision。approval 类型或有效 risk=high 时**必填**；
            与当前不一致返回 409 `card.revision_conflict`（响应附带最新卡片），防止 TOCTOU。
        challenge:
          type: string
          description: |
            有效 risk=high 时必填。来自
            `POST /cards/{card_id}/actions/{action_id}/challenge`。
        assertion:
          type: string
          description: |
            有效 risk=high 时必填。App 用 Secure Enclave 设备密钥对
            `card_id + action_id + revision + challenge` 的签名（占位示例）。
          example: <change-me>
      additionalProperties: false

    CardActionReceipt:
      type: object
      description: |
        卡片操作回执。同一次用户意图的幂等重放返回完全相同的回执与 `audit_id`。
        `card` 必填，且其 `status` 与本次操作结果一致（例如批准后为 `acted`）。
      required:
        - card_id
        - action_id
        - status
        - decided_at
        - audit_id
        - actor
        - auth_method
        - source_module
        - revision_before
        - revision_after
        - card
      properties:
        card_id:
          type: string
        action_id:
          type: string
        status:
          type: string
          enum: [accepted, rejected, failed]
          description: |
            `accepted` 操作成功；`rejected` 网关或来源模块拒绝；`failed` 执行失败。
        decided_at:
          type: string
          format: date-time
        audit_id:
          type: string
          description: 审计记录 ID；可用 `GET /audit/{audit_id}` 查询。
        actor:
          $ref: '#/components/schemas/Actor'
        auth_method:
          type: string
          enum: [none, biometric]
          description: 本次操作的认证方式；高风险操作应为 `biometric`。
        source_module:
          type: string
          description: 卡片来源模块（对齐 `source.module`）。
        revision_before:
          type: integer
          minimum: 1
          description: 决策前的卡片 revision。
        revision_after:
          type: integer
          minimum: 1
          description: 决策后的卡片 revision。
        result:
          type: object
          description: 来源模块返回的操作结果，结构由模块定义。
        card:
          $ref: '#/components/schemas/Card'

    AuditRecord:
      type: object
      description: 卡片操作的审计记录（append-only）。`GET /audit/{audit_id}` 返回。
      required: [id, card_id, action_id, occurred_at, actor, auth_method, source_module, decision, revision_before, revision_after]
      properties:
        id:
          type: string
          example: audit_demo
        card_id:
          type: string
        action_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        auth_method:
          type: string
          enum: [none, biometric]
        source_module:
          type: string
        source_capability_id:
          type: string
        decision:
          type: string
          enum: [accepted, rejected, failed]
        revision_before:
          type: integer
          minimum: 1
        revision_after:
          type: integer
          minimum: 1
        request_id:
          type: string
        idempotency_key_hash:
          type: string
          description: 幂等键的哈希（不回显原值），用于排查重放。
        result:
          type: object
          description: 来源模块返回的结果快照。

    # ----- 健康 -----
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: matrix
        status:
          type: string
          enum: [ok, degraded, down]
        latency_ms:
          type: number
          minimum: 0
        detail:
          type: string

    ModuleStatus:
      type: object
      required: [name, enabled, status]
      properties:
        name:
          type: string
          enum: [core, role, memory, social, notify, bridge, town]
        enabled:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, down, disabled]

    Health:
      type: object
      required: [status, version, contract_version, uptime_seconds, checks, modules]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
          description: 网关实现版本。
          example: 0.1.0
        contract_version:
          type: string
          description: 本响应遵循的契约版本。
          example: 0.1.0
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleStatus'
