#
# botville AI Gateway API — v1 契约初稿（issue B0.1 / M0）
# 人类可读说明：gateway/docs/contract.md
# 本文件是机器可读的唯一事实源；示例见 gateway/openapi/examples/。
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: botville AI Gateway API
  version: 0.2.0
  summary: AI 网关契约初稿：对话与消息、角色、功能清单、卡片、用量与限额。
  description: |
    botville 自部署 AI 网关的开放 HTTP API。网关位于 Matrix homeserver 与 AI 运行时之间：
    **AI 决定想不想说，网关决定能不能说。** Matrix Client-Server / Application Service API
    负责消息传输；本契约只覆盖网关自己的控制面（角色、会话登记、发言裁决、三层限额、
    用量账单、功能清单与通用卡片），不重复定义 Matrix 协议。

    当前为 **0.2.0 草案**（M0），供 C 线（App）与 D 线（通知 / 开放 API）评审。
    版本规则见 `gateway/docs/contract.md#版本规则`：`/v1` 路径、只增不删、破坏性变更升主版本。

    所有示例、令牌与密钥均为占位符（`<change-me>`），本契约不含任何真实凭据。

    **请求体上限**：任何 `POST` / `PUT` 请求体不得超过 **1 MiB（1048576 字节）**。
    超限返回 `400 request.invalid`，`errors[].code` 为 `too_large`（**不新增 413**，
    状态码集合保持不变）。详见 contract.md §1.1。

    **开放枚举**：所有响应侧的枚举字段（卡片类型、块类型、操作类型、能力状态等）
    都按开放枚举声明——客户端遇到未知值必须按契约给出的降级规则处理，
    不得因未知值导致整条响应解码失败。请求侧枚举仍为封闭集合。

    **卡片结构版本**：`card_schema_version` 与契约 `info.version` 解耦，
    通过 `X-Card-Schema-Version` / `card_schema_max` 协商，见 contract.md 4.7。

    许可：Apache-2.0。
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: botville contributors

servers:
  - url: https://{host}/v1
    description: 自部署网关（占位域名，部署时替换）。网关可部署在路径前缀之后，
      此时 `host` 变量可包含该前缀（如 `example.invalid/_botville/gateway`），
      请求路径即形如 `https://example.invalid/_botville/gateway/v1/limits`；
      前缀由部署配置 `GATEWAY_HTTP_PATH_PREFIX` 指定，默认空 = 直接挂在域名根。
      不带前缀的请求同样被接受（兼容已去前缀的反代）。
    variables:
      host:
        default: gateway.example.invalid
        description: 网关对外域名；部署在路径前缀之后时可写成 `域名/前缀`
          （如 `example.invalid/_botville/gateway`），不要写 scheme 与结尾 `/`。
          仅描述部署址，不改变任何路径模板。

security:
  - bearerAuth: []

tags:
  - name: Health
    description: 存活、就绪与模块状态。
  - name: Capabilities
    description: 功能清单（capability manifest），驱动 App 入口与模块网页。
  - name: Personas
    description: AI 角色配置、关系默认值与角色状态。
  - name: Conversations
    description: 会话（Matrix room）在网关的登记与查询。
  - name: Messages
    description: 消息读取，以及 AI 发言请求的网关裁决与投递。
  - name: Context
    description: 上下文隔离组装：按 trust 判定分区，返回可交给模型的分区上下文与 nonce（B2.3）。
  - name: Policy
    description: 发言前预检，不产生投递。
  - name: Limits
    description: 三层限额（平台 / 所有者 / 对方）的读取与设置。
  - name: Usage
    description: token 预算、用量汇总与账单明细。
  - name: Cards
    description: 通用卡片与授权操作。
  - name: Audit
    description: 卡片操作与授权审计记录查询。
  - name: Moments
    description: |
      动态（朋友圈式短内容）：发布、可见性范围、评论与点赞（A2.2 / issue #7）。
      可见性在读取时计算，越权访问与不存在统一返回 404 `moment.not_found`。
  - name: Memory
    description: |
      角色主人查看、删除、固定与显式设置的记忆（B2.6 PR3c，contract §1.7.8 ⑩）。
      仅当 `/capabilities` 中 `memory.manage.owner_can_read_dm=true` 时向聊天对象展示
      「该 AI 的主人可以查看和删除它与你的聊天记忆」。该值反映
      `GATEWAY_MEMORY_OWNER_CAN_READ_DM`，默认 false；关闭时主人只能看到 DM 元数据并删除/取消固定，
      固定与显式写入也仍可用。DM recent、summary 和 profile counterpart scope（含 shared fact）
      的 `text`、fact `value` 为 null，`redacted=true`。仅 persona 的 `owner_user_id` 可调用；身份为
      matrixOpenIdToken 或 matrixUserToken，不接受 bearerAuth。
      群组记忆正文仅在 owner 当前是该 room 成员时返回；否则（含成员查询失败）只返回元数据，
      `text: null`、`redacted: true`，删除与取消固定仍可用。
      审计表 `memory_audit` 位于 memory.db（0600），随记忆保留期清理；不存正文、事实值或明文
      counterpart，counterpart 仅存 HMAC（`counterpart_hmac`）。
      错误码：404 `memory.disabled` / `memory.not_found`，422 `memory.key_not_allowed` /
      `memory.counterpart_invalid` / `memory.not_pinnable`，409 `memory.pin_limit`，
      503 `memory.unavailable`，403 `persona.not_owned`；读取 60 次/分钟、写入 20 次/分钟
      （每 caller），超限 429 `rate_limited.transport`。

x-botville-contract:
  stability: draft
  review: [C, D]
  changelog: gateway/docs/contract.md#版本规则
  error_model: RFC 9457 problem+json
  idempotency: Idempotency-Key header

paths:
  # ----- 主人记忆管理（B2.6 PR3c）-----
  # 身份与 /moments* 一致：matrixOpenIdToken 或 matrixUserToken；不接受 bearerAuth。
  /memories:
    get:
      tags: [Memory]
      operationId: listOwnerMemories
      summary: 列出主人名下角色的记忆
      description: |
        仅 persona 的 owner 可读。owner_can_read_dm=false 时 DM recent、summary、profile fact
        （含 shared counterpart scope）的 text/value 为 null、redacted=true。群组范围文本只在 owner 当前仍是该 room 的 joined 成员时返回；
        成员查询失败也按非成员处理，返回元数据且 `text`（及适用时 `value`）为 null、`redacted=true`。
        按 `updated_at desc, id desc` 返回；cursor 不透明，limit 默认 20、最大 100。
        响应一律 `Cache-Control: no-store`。每 caller 60 次/分钟。
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      parameters:
        - name: persona_id
          in: query
          required: true
          schema: {type: string}
        - name: layer
          in: query
          description: 可重复。
          schema: {type: array, items: {type: string, enum: [recent, summary, profile]}}
        - name: scope_kind
          in: query
          schema: {type: string, enum: [dm, group]}
        - name: counterpart
          in: query
          schema: {type: string}
        - name: room_id
          in: query
          schema: {type: string}
        - name: pinned
          in: query
          schema: {type: boolean}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': {description: 记忆分页。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /memories/facts:
    put:
      tags: [Memory]
      operationId: putOwnerMemoryFact
      summary: 设置主人事实
      description: |
        仅 owner。`key` 必须是服务端允许的 FACT_KEYS；counterpart 必须为本服真实人类用户。
        owner 写入覆盖 extracted 同 key，并清除该 key 的 suppression。profile 的 `shared` 仍属于
        DM counterpart scope，不使用群成员门禁。owner_can_read_dm=false 不阻止写入，但创建、更新及
        重放响应的 text/value 为 null、redacted=true，不回显事实值。可选 `Idempotency-Key` 使用有界、进程内 24 小时
        （最多 2000 key）内存缓存；网关重启后丢失，重启后同 key 重放按新请求处理。
        缓存有效时同 key 同请求重放返回当前同一事实；目标已经删除则 404
        `memory.not_found`；同 key 异请求为 409 `idempotency.conflict`。响应 `Cache-Control: no-store`。
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryFactWrite'}}}}
      responses:
        '200': {description: 已更新。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '201': {description: 已创建。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /memories/{memory_id}:
    parameters:
      - name: memory_id
        in: path
        required: true
        description: HMAC 派生的不透明记忆 ID（mr_、ms_ 或 mf_ 前缀）。
        schema: {type: string, pattern: '^m[rsf]_[0-9a-f]{16}$'}
    get:
      tags: [Memory]
      operationId: getOwnerMemory
      summary: 读取单条记忆
      description: "DM recent、summary 和 profile fact（含 shared counterpart scope）在 owner_can_read_dm=false 时 text/value 为 null、redacted=true；群组文本的成员门禁与列表相同；响应 `Cache-Control: no-store`。每 caller 60 次/分钟。"
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      responses:
        '200': {description: 记忆。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Memory]
      operationId: deleteOwnerMemory
      summary: 删除一条记忆
      description: "recent 会遗忘并使覆盖 summary dirty；删除 summary 只重置 watermark、并非遗忘。响应 `Cache-Control: no-store`。"
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      responses:
        '204': {description: 已删除。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /memories/{memory_id}/pin:
    parameters:
      - name: memory_id
        in: path
        required: true
        schema: {type: string, pattern: '^m[rsf]_[0-9a-f]{16}$'}
    put:
      tags: [Memory]
      operationId: pinOwnerMemory
      summary: 固定记忆
      description: "幂等固定。summary 不可固定；每 persona 最多 200 条固定项。响应 `Cache-Control: no-store`。"
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      responses:
        '200': {description: 固定后的记忆。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Memory]
      operationId: unpinOwnerMemory
      summary: 取消固定记忆
      description: "幂等取消固定。响应 `Cache-Control: no-store`。"
      security: [{matrixOpenIdToken: []}, {matrixUserToken: []}]
      responses:
        '200': {description: 取消固定后的记忆。, headers: {Cache-Control: {$ref: '#/components/headers/CacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 健康检查
      description: |
        返回网关自身、Matrix 连接、数据库与模型提供方（仅可达性）以及各模块的状态。
        不需要鉴权，供部署探针与 App 状态页使用。`status` 非 `ok` 时返回 503，响应体结构相同。
      security: []
      responses:
        '200':
          description: 服务健康或降级。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 服务不可用或关键依赖异常。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      security:
        - bearerAuth: []
        - matrixOpenIdToken: []
        - matrixUserToken: []
      summary: 获取功能清单
      description: |
        返回完整基础清单，记忆模块启用时额外发布 memory.manage，manifest_version 为 1.3.0。
        接受站点/调用方 bearer 或 MatrixOpenID / Matrix 用户 Bearer 身份，任一通过即可。
        memory.manage 的原生入口为 botville://memories。App 必须以清单渲染模块入口，不得硬编码模块列表。
        `app_version` 用于服务端过滤不满足 `min_app_version` 的能力；App 仍需忽略未知能力 ID
        与未知字段。清单可缓存（参考 `cache_ttl_seconds`），版本变化通过 `manifest_version` 感知。
      parameters:
        - name: locale
          in: query
          description: 期望语言，覆盖 Accept-Language。
          schema:
            type: string
            example: zh-CN
        - name: module
          in: query
          description: 只返回指定模块的能力。
          schema:
            type: string
            example: memory
        - name: status
          in: query
          description: 只返回指定状态的能力。
          schema:
            type: string
            enum: [enabled, disabled, degraded]
        - name: app_version
          in: query
          description: 调用方 App 版本，用于按 min_app_version 过滤。
          schema:
            type: string
            example: 0.4.0
      responses:
        '200':
          description: 功能清单。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}:
    get:
      tags: [Capabilities]
      operationId: getCapability
      summary: 获取单个能力
      description: 返回单个 capability 的完整描述；未知能力返回 404。
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - name: locale
          in: query
          schema:
            type: string
            example: zh-CN
      responses:
        '200':
          description: 能力描述。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}/session-tokens:
    post:
      tags: [Capabilities]
      operationId: createCapabilitySessionToken
      summary: 签发模块网页一次性 code
      description: |
        为 App 内置浏览器打开模块网页签发**一次性 code**，而不是可直接放进请求头的长期令牌。
        WKWebView 只能给首个 `URLRequest` 加头，后续导航、子资源与 XHR 都带不上
        `Authorization`，因此令牌方案改为「一次性 code → HttpOnly cookie」：

        1. App 调用本接口，拿到 `code`（TTL ≤ 60 秒、单次使用）与 `url`（`code` 已作为查询串
           带给模块页面）。`url` 是唯一允许出现 `code` 的位置，不得写入日志或长期缓存。
        2. 模块页面用该 `code` 调用
           `POST /capabilities/{capability_id}/session-cookies` 换取 `Set-Cookie`，
           浏览器自动保存 **HttpOnly + Secure + SameSite** cookie，页面脚本读不到值。
        3. 之后页面所有同源请求自动携带 cookie，不再需要请求头。
        4. 会话上限 3600 秒（`ttl_seconds` ≤ 3600）。过期由页面通过 JS bridge 消息
           `botville.session.renew` 通知 App，App 重新走第 1 步。

        `allowed_origins` 是 App 放行导航的白名单：只在该列表内的 origin 加载页面，
        跳到其他 origin 改用外部浏览器打开。

        网关响应中的 `code` 只是占位示例（`<change-me>`），真实值不会出现在仓库里。
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTokenRequest'
      responses:
        '201':
          description: 已签发一次性 code 与模块网页地址。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /capabilities/{capability_id}/session-cookies:
    post:
      tags: [Capabilities]
      operationId: exchangeCapabilitySessionCookie
      summary: 一次性 code 换取 HttpOnly 会话 cookie
      description: |
        模块网页（不是 App）调用：用 `session-tokens` 签发的一次性 `code` 换取
        `Set-Cookie` 会话。`code` 单次使用、≤ 60 秒有效；成功返回 `204` 并设置
        **HttpOnly + Secure + SameSite** cookie，JSON 响应体**不含** cookie 值。
        会话有效期 ≤ 3600 秒，与 `session-tokens` 的 `ttl_seconds` 一致。

        `code` 只能出现在请求体或页面首次加载 URL 中，不得写入日志、localStorage
        或任何可被脚本读取的位置。重复使用同一 `code` 返回 401 `auth.invalid_token`。
      security: []
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCookieRequest'
      responses:
        '204':
          description: 已设置会话 cookie（`Set-Cookie`），无响应体。
          headers:
            Set-Cookie:
              description: |
                HttpOnly、Secure、SameSite=Lax 的会话 cookie；会话 ≤ 3600 秒。
                示例占位，不含真实值。
              schema:
                type: string
                example: botville_session=<change-me>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=3000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
