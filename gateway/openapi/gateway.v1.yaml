            type: string
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: peer_id
          in: query
          description: 对方设置所属角色（跨角色限制时使用）。
          schema:
            type: string
        - name: include_platform
          in: query
          description: 是否返回平台底线层（只读）。
          schema:
            type: boolean
