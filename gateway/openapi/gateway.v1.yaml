  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: 列出卡片
      description: 返回当前用户的卡片，可按状态、类型、优先级与来源能力过滤。App 按 `blocks` 通用渲染。`updated_since` 用于增量同步。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, read, dismissed, expired, acted]
        - name: type
          in: query
          schema:
            type: string
            enum: [notification, approval, moment, system, reminder, result]
        - name: priority
          in: query
          schema:
            type: string
            enum: [urgent, high, normal, low]
        - name: capability_id
          in: query
          schema:
            type: string
        - name: updated_since
          in: query
          description: 只返回此时间之后更新的卡片，用于增量同步（RFC 3339 UTC，以 `Z` 结尾）。
          schema:
            type: string
            format: date-time
        - name: card_schema_max
          in: query
          description: |
            客户端支持的最高卡片 schema 版本（格式 `<major>.<minor>`）。
            服务端按此降级；高于客户端 major 的卡片只返回 `fallback_text`。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
        - name: locale
          in: query
          schema:
            type: string
            example: zh-CN
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: X-Card-Schema-Version
          in: header
          description: |
            客户端支持的最高卡片 schema 版本（格式 `<major>.<minor>`）。
            与 `card_schema_max` 等效，优先级低于 query param。
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
            example: '1.0'
      responses:
        '200':
          description: 卡片分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Cards]
      operationId: createCard
      summary: 创建并投递卡片
      description: |
        由通知、小镇等模块创建卡片。网关校验 schema、来源能力 scope 与 payload 中的敏感信息，
        通过后推送给 App。`fallback_text` 必填，供旧客户端或不支持的类型降级展示。

        **业务级去重**：`source.event_id` 与 `source.dedupe_key` 二选一必填，服务端按
        `(capability_id, event_id ?? dedupe_key)` 去重。命中已有键时**不新建、不重复投递**，
        返回 `200` 与已有卡片；首次创建返回 `201`。因此客户端必须同时处理 200 与 201，
        响应体都是同一个 `Card` schema。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '200':
          description: |
            去重命中：该来源键已有卡片，返回**已有卡片**，未新建、未重复投递。
            响应体与 201 相同（`Card`）。
          headers:
            Location:
              description: 已有卡片资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '201':
          description: 卡片已创建。
          headers:
            Location:
              description: 新卡片资源地址。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /cards/{card_id}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: 获取卡片
      description: 返回单张卡片的完整内容，含通用渲染块、操作、来源与 i18n 文本。
      parameters:
