              schema:
                $ref: '#/components/schemas/EffectiveLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Limits]
      operationId: putLimits
      summary: 设置限额层
      description: |
        写入所有者层（`layer: owner`，scope 为 `persona` 或 `conversation`）或对方层
        （`layer: peer`，scope 为 `peer`）。平台底线层只能由部署配置设置，不可经 API 修改。
        返回重新计算后的生效限额。

        **整层替换**：请求体 `rules` 完整替换该层原有规则，未出现的字段即被清除
        （不是局部合并）。因此本接口**天然幂等**——同一请求体重复提交得到同一结果；
        `Idempotency-Key` 对本端点**可选**，服务端**不做**幂等缓存，重放按一次新的
        整层替换处理（#114-7.8c）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
