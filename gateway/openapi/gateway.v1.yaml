      summary: 读取会话消息
      description: |
        按时间倒序分页返回消息。每条消息带 `trust` 标记：`untrusted` 表示来自外部或不可信来源，
        网关在交给模型前已做隔离处理；客户端展示时不得把它当系统指令。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
