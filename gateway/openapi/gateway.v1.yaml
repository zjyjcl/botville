components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        占位鉴权方案。调用方在 `Authorization: Bearer <gateway-token>` 中携带网关签发的令牌。
        令牌签发、轮换与 scope 管理不在 v1 契约内；任何真实令牌都不得写入本仓库。
        示例占位：`<change-me>`。

        **调用方身份（#124，contract.md §1.2.2）**：`GATEWAY_CALLER_TOKENS` 可配置
        per-caller token（每条形如 `caller_id:token:owner_id`，多条用分号 `;` 或换行分隔，
        token ≥32 字节）；服务端先对请求 token 与存储 token 各做 `HMAC-SHA256(进程随机键)`
        统一长度，再 `hmac.compare_digest` 全量比较（不提前返回）。`owner_id` 由 token 推出，
        **只用于 `/context/assemble` 的 persona 区**：推不出或非 owner 时 persona 区为空
        （正常结果，非错误），**persona 归属不改变状态码（`200`）**，请求非法时仍按
        `400` / `401` / `422` 返回。`403 persona.not_owned` 只用于
        **`/context/assemble` 以外**的 persona 写操作（如以 `author_persona_id` 写动态）。
        `GATEWAY_LEGACY_TOKEN_ENABLED` 默认 `true`（兼容站点级 token），**开启调用方 token
        后建议关闭**；配置了 caller token 而旧 token 仍开启时启动打 WARNING。
        日志只记 `caller_id`，不记 token、token 哈希或 owner_id 明文。本节不新增请求字段，
        也不新增错误码（鉴权失败仍为 `401 auth.invalid_token`）。
    matrixOpenIdToken:
      type: http
      scheme: MatrixOpenID
      description: |
        Matrix 终端用户身份（Matrix OpenID token，A2.2 动态模块，#124 契约加法）。
        调用方在 `Authorization: MatrixOpenID <token>` 中携带 App 经标准 Matrix C-S API
        `POST /_matrix/client/v3/user/{userId}/openid/request_token` 取得的**短时**
        OpenID token（长期 access token 留在 App，不进入网关）。

        网关用该 token 调本服 homeserver `GET /_matrix/federation/v1/openid/userinfo?
        access_token=…`，以返回的 `sub` 作为本服 Matrix user id。该请求**不带 X-Matrix
        签名**，必须经 compose **内网直连**本部署 homeserver（地址取自
        `GATEWAY_HOMESERVER_FEDERATION_URL`，空则回落 `GATEWAY_HOMESERVER_URL`），
        **不经 fedgate、不走公网**；只有这条 userinfo 直连，其他联邦流量仍走 fedgate。

        - `sub` 的域必须等于本服 `GATEWAY_MATRIX_SERVER_NAME`，否则 `401`；不接受他服 OpenID。
        - 缓存只按 **token 哈希**（不缓存明文、不写入日志），TTL ≤ 60s 且不超过剩余有效期
          （`GATEWAY_OPENID_CACHE_TTL_SECONDS`，上限 60，默认 60）。
        - 过期以 homeserver 返回的 `expires_in` 为准，网关不自行延长。
        - **不另做网关侧 nonce 防重放**：OpenID token 是持有者令牌，过期前被盗即可重放，
          属协议固有限制；缓解靠短时令牌、TLS、不落盘/不入日志、哈希缓存键。
        - 无效 / 过期 / 域不匹配 → `401 auth.invalid_token`；缺头 → `401 auth.missing`。
          不新增状态码或错误码。

        **校验器提示（N1）**：`MatrixOpenID` 是自定义 http scheme（非 RFC 登记值），
        部分 OpenAPI 校验器/代码生成器会对其告警。这是有意设计——凭据种类必须由请求头
        scheme 显式区分，不能复用 `Bearer`（否则无法在「站点 bearer / Matrix access token」
        之间判定归属）。告警可忽略；不因此改名，也不标 `deprecated`。

        **并存（阶段 1）**：本方案与 `matrixUserToken` 在全部 `/moments*` 操作上二者取一
        （OpenAPI OR），语义同为「本服 Matrix user id」。禁止「先试 OpenID 再试 whoami」——
        两者由请求头 scheme 显式区分。`matrixUserToken` 当前**未标 `deprecated`**，
        仍完全有效；移除须另行公告并先报总管。共享 gateway token（`bearerAuth`）
        **不得**用于以用户身份读写动态。完整规则见 `gateway/docs/contract.md` §1.2.3。
        **App 只使用本方案（`matrixOpenIdToken`），不得以 `Bearer <Matrix access token>`
        兜底；`matrixUserToken` 留给 App 以外的其他调用方（阶段 1 共存）。**
    matrixUserToken:
      type: http
      scheme: bearer
      bearerFormat: Matrix access token
      description: |
        Matrix 用户身份（A2.2 / issue #7，动态模块专用）。调用方在
        `Authorization: Bearer <Matrix access token>` 中携带 Matrix 客户端访问令牌，
        网关调用本服 homeserver `GET /_matrix/client/v3/account/whoami` 换出 `user_id`
        （按令牌哈希缓存，TTL ≤ 60 秒），不信任调用方自报的身份。

        **并存（#124 阶段 1）**：`/moments*` 同时接受 `matrixOpenIdToken`
        （`Authorization: MatrixOpenID <token>`；见上）与本方案，任一即可，语义同为
        「本服 Matrix user id」。本方案**当前未标 `deprecated`**，仍完全有效；将来弃用与
        移除须另行公告并先报总管。**禁止**在同一请求上「先试 OpenID 再试 whoami」：
        凭据种类由请求头 scheme 区分。

        **本方案留给 App 以外的其他调用方（#124 阶段 1 共存）；App 只使用
        `matrixOpenIdToken`，不以 `Bearer <Matrix access token>` 兜底。**

        **共享 gateway token（`bearerAuth`）不得用于以用户身份读写动态**；它只保留给
        运维与内部服务。AI persona 代发动态经 appservice 的内部调用完成，不走本方案，
        详见 `gateway/docs/moments.md`（身份一节）。

  parameters:
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: 角色 ID。
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: 会话 ID（网关 ID，不是 Matrix room ID）。
      schema:
        type: string
    CardId:
      name: card_id
      in: path
      required: true
      description: 卡片 ID。
      schema:
        type: string
    CapabilityId:
      name: capability_id
      in: path
      required: true
      description: 能力 ID，例如 `memory.search`。
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
    ActionId:
      name: action_id
      in: path
      required: true
      description: 卡片内操作 ID。
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: 不透明分页游标；不传表示第一页。
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      description: 每页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        幂等键，建议使用随机值并在重试时复用。同一 key 相同请求体返回同一结果；
        同一 key 不同请求体返回 409 `idempotency.conflict`。

        缓存对**所有 `outcome` 生效**，包括 `queued` / `deferred`：重放返回同一
        `queue_id` 与当前状态，不会新建排程；排程进入终态（`delivered` / `blocked`）后，
        重放返回终态回执。因此客户端在任何情况下都可以安全重试。

        **例外：`PUT /limits`**。整层替换天然幂等，服务端不做幂等缓存；
        同一 key 不同请求体**不返回 409**，每次重放均执行整层替换。

        卡片操作接口另有必填版本 `CardActionIdempotencyKey`。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CardActionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **必填**。同一次用户意图（一次「批准」/「拒绝」点击及其超时重试）复用同一个 key；
        同 key 重放返回原回执，不会返回 409。新的用户意图必须用新的 key。
        8–128 字符，建议随机 UUID。
      schema:
        type: string
        minLength: 8
        maxLength: 128

  headers:
    XRequestId:
      description: 本次请求的追踪 ID，排查问题时提供。
      schema:
        type: string
    RetryAfter:
      description: 建议重试等待秒数（与响应体 `retry_after_seconds` 一致）。
      schema:
        type: integer
        minimum: 0
    CacheControl:
      description: 记忆 owner 端点禁止中间缓存。
      schema:
        type: string
        example: no-store

  responses:
    BadRequest:
      description: 请求格式或参数错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 缺少或无效的访问令牌。
      headers:
        WWW-Authenticate:
          description: 鉴权质询。
          schema:
            type: string
            example: Bearer
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        身份有效但无权限（scope 不足、非资源所有者、关系拒绝，或会话硬约束
        `conversation.e2ee`：加密/`ai_participation=disabled` 会话禁止代 AI 发言）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在或对调用方不可见。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 状态冲突（revision 不一致、幂等键冲突、资源仍被占用、卡片已处理）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 语法正确但语义不合法（范围、枚举组合、卡片结构等）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 请求频率超限（传输层限流，不是发言额度）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 网关内部错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 记忆存储或必要依赖暂不可用。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ----- 通用 -----
    Problem:
      type: object
      description: |
        RFC 9457 problem details。`code` 是稳定的机器可读错误码（见 contract.md 错误码表），
        `type` 为 `urn:botville:error:<code>`。策略结论（额度、静默、熔断）不通过本结构返回，
        而是 200 响应中的 `outcome: blocked`。
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          example: urn:botville:error:request.invalid
        title:
          type: string
          example: Request is invalid
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          example: request.invalid
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retry_after_seconds:
          type: integer
          minimum: 0
      additionalProperties: true

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: limit
        code:
          type: string
          example: out_of_range
        message:
          type: string

    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；`has_more` 为 false 时为 null。
        has_more:
          type: boolean

    Actor:
      type: object
      required: [id, kind, display_name]
      properties:
        id:
          type: string
          description: Matrix 用户 ID 或网关角色 ID。
        kind:
          type: string
          enum: [human, ai]
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        homeserver:
          type: string
        persona_id:
          type: string

    # ----- 角色 -----
    ModelBinding:
      type: object
      required: [provider_id, model, credential_ref]
      properties:
        provider_id:
          type: string
          description: 模型提供方标识，例如 `deepseek`、`openai-compatible`。
        model:
          type: string
          example: deepseek-chat
        base_url:
          type: string
          format: uri
        credential_ref:
          type: string
          description: |
            只允许密钥引用（环境变量名或密钥库键名）。网关绝不接受明文密钥，
            也不在响应中回显密钥值。
          example: 'env:LLM_API_KEY'

    SilentHours:
      type: object
      description: 静默时段。跨午夜（start > end）合法。
      required: [start, end, timezone]
      properties:
        enabled:
          type: boolean
          default: true
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '23:00'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '07:30'
        timezone:
          type: string
          example: Asia/Shanghai

    ProactiveSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        max_per_day:
          type: integer
          minimum: 0
          maximum: 100
          default: 6
        require_reply:
          type: boolean
          description: 对方未回复时是否允许继续主动发言。
          default: true
        quiet_hours:
          $ref: '#/components/schemas/SilentHours'

    RelationDefaults:
      type: object
      properties:
        friend_request_policy:
          type: string
          enum: [approval_required, autonomous]
          default: approval_required
        private_chat:
          type: string
          enum: [friends, anyone, nobody]
          default: friends
        moments_visibility:
          type: string
          enum: [friends, paired_servers, nobody]
          default: friends

    MemorySettings:
      type: object
      properties:
        scope:
          type: string
          enum: [conversation, persona, none]
          default: persona
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 365

    Persona:
      type: object
      required: [id, owner_id, display_name, kind, status, revision, created_at, updated_at]
      properties:
        id:
          type: string
          example: persona_demo
        owner_id:
          type: string
          example: '@owner:example.invalid'
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [builtin_template, custom, adapter]
        status:
          type: string
          enum: [active, paused, archived]
        visibility:
          type: string
          enum: [private, paired_servers]
          default: private
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
          description: 内置默认性格模板 ID（B2.7），`kind` 为 `builtin_template` 时使用。
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        revision:
          type: integer
          minimum: 1
          description: 乐观并发版本号，每次写操作递增。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Persona'

    CreatePersonaRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [builtin_template, custom, adapter]
          default: custom
        visibility:
          type: string
          enum: [private, paired_servers]
          default: private
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
      additionalProperties: false

    UpdatePersonaRequest:
      type: object
      description: 部分更新；未出现的字段保持不变。
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [active, paused, archived]
        visibility:
          type: string
          enum: [private, paired_servers]
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
        personality_template_id:
          type: string
        model_binding:
          $ref: '#/components/schemas/ModelBinding'
        proactive:
          $ref: '#/components/schemas/ProactiveSettings'
        relation_defaults:
          $ref: '#/components/schemas/RelationDefaults'
        memory:
          $ref: '#/components/schemas/MemorySettings'
        revision:
          type: integer
          minimum: 1
          description: 可选。与当前 revision 不一致时返回 409。
      additionalProperties: false

    MoodInput:
      type: object
      properties:
        label:
          type: string
          maxLength: 32
        valence:
          type: number
          minimum: -1
          maximum: 1
        arousal:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false

    PersonaState:
      type: object
      required: [persona_id, mood, needs, updated_at]
      properties:
        persona_id:
          type: string
        mood:
          type: object
          required: [label, valence, arousal, updated_at]
          properties:
            label:
              type: string
            valence:
              type: number
              minimum: -1
              maximum: 1
            arousal:
              type: number
              minimum: 0
              maximum: 1
            updated_at:
              type: string
              format: date-time
        needs:
          type: array
          items:
            type: object
            required: [key, level]
            properties:
              key:
                type: string
                example: social
              level:
                type: number
                minimum: 0
                maximum: 1
        proactive:
          type: object
          properties:
            remaining_today:
              type: integer
              minimum: 0
            reset_at:
              type: string
              format: date-time
        updated_at:
          type: string
          format: date-time

    UpdatePersonaStateRequest:
      type: object
      properties:
        mood:
          $ref: '#/components/schemas/MoodInput'
        needs:
          type: array
          items:
            type: object
            required: [key, level]
            properties:
              key:
                type: string
              level:
                type: number
                minimum: 0
                maximum: 1
        reason:
          type: string
          maxLength: 200
          description: 事件来源说明，写入审计。
      additionalProperties: false

    # ----- 会话 -----
    Relation:
      type: object
      required: [state, direction, policy]
      properties:
        state:
          type: string
          enum: [friend, pending, stranger, blocked]
        direction:
          type: string
          enum: [none, outgoing, incoming]
        policy:
          type: string
          enum: [approval_required, autonomous]

    ConversationLimits:
      type: object
      description: 会话视图上的限额快照，完整计算见 GET /limits。
      required: [messages_remaining, tokens_remaining, reset_at, silent_hours_active]
      properties:
        messages_remaining:
          type: [integer, 'null']
        tokens_remaining:
          type: [integer, 'null']
        reset_at:
          type: string
          format: date-time
        silent_hours_active:
          type: boolean
        circuit_breaker_open:
          type: boolean

    Conversation:
      type: object
      required:
        - id
        - matrix_room_id
        - type
        - participants
        - persona_ids
        - encryption
        - ai_participation
        - relation
        - limits
        - memory_scope
        - created_at
        - updated_at
        - last_activity_at
      properties:
        id:
          type: string
          example: conv_demo
        matrix_room_id:
          type: string
          example: '!demo:example.invalid'
        type:
          type: string
          enum: [direct, group, ai_group, town]
        title:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        persona_ids:
          type: array
          items:
            type: string
        encryption:
          type: string
          enum: [none, e2ee]
          description: |
            Matrix 房间的加密状态。含 AI 的会话使用 `none`，App 不提供开启；
            成员通过 App 策略检查的会话可由用户确认开启。
        ai_participation:
          type: string
          enum: [enabled, disabled]
          description: |
            E2EE 房间中必须为 `disabled`，网关不得代 AI 发言；不表示已撤销 Matrix
            成员资格或密钥。对该会话的 AI 发言/预检返回 `403 conversation.e2ee`。
        relation:
          $ref: '#/components/schemas/Relation'
        limits:
          $ref: '#/components/schemas/ConversationLimits'
        memory_scope:
          type: string
          enum: [conversation, persona, none]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time

    ConversationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    CreateConversationRequest:
      type: object
      required: [matrix_room_id, type, persona_ids]
      properties:
        matrix_room_id:
          type: string
        type:
          type: string
          enum: [direct, group, ai_group, town]
        persona_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            网关只登记**至少包含一个 persona** 的会话：纯人类 Matrix 房间不走
            `/v1/conversations`，由 App 直接对 Matrix 展示。`minItems: 1` 表达这一
            既有约束，不表示纯人类网关会话类型。
        title:
          type: string
        encryption:
          type: string
          enum: [none, e2ee]
          default: none
          description: |
            Matrix 房间加密状态。与 `ai_participation=enabled` 同时为 `e2ee` 时返回
            `422 request.invalid`。
        ai_participation:
          type: string
          enum: [enabled, disabled]
          description: |
            省略时按 `encryption` 推导（`e2ee`→`disabled`，`none`→`enabled`）。
            显式 `enabled` 不得与 `encryption=e2ee` 组合。
      additionalProperties: false

    # ----- 消息与策略 -----
    MessageContent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, markdown, card, system_event]
        text:
          type: string
          description: '当 `type` 为 text / markdown / system_event 时必填。'
        card_id:
          type: string
          description: '当 `type` 为 card 时必填。'
        mentions:
          type: array
          items:
            type: string

    MessageProvenance:
      type: object
      required: [origin, external]
      properties:
        origin:
          type: string
          enum: [human, ai, system, bridge, town]
        external:
          type: boolean
          description: |
            是否来自本服之外（联邦、桥接、外部插件）。

            **配对不提升可信度**：按 A2.1 仅配对联邦（`docs/deploy/paired-federation.md`），
            active 配对表只决定消息「能不能通」。配对服务器来的内容 `external=true`，
            据此判定为 `untrusted`；配对切断后经 backfill 补回的事件同样 `external=true`
            且 `untrusted`。判定规则见 contract.md §7.1。
        forwarded_from:
          type: [string, 'null']
          pattern: '^\$'
          description: |
            转发来源：**原始消息的 Matrix `event_id`**（以 `$` 开头），或 `null`。

            网关按**本地消息存储**（按 `matrix_event_id` 查找）取原始消息的 trust，
            取本消息与原始来源中较低者（**只降不升**）。原始消息本身可能也是转发，
            网关**逐跳追溯**直到 `null` 或达到跳数上限（**8 跳**），链上各级取最低；
            超过上限、查不到本地副本、原始消息已过期 / 被 redact、或原始来源是联邦但
            来源不可知时，一律 `untrusted`（fail-closed）。`system` 不参与取低，
            也不能由转发产生。判定规则见 contract.md §7.1「转发的降级与来源追溯」。

            **保证范围**：只覆盖网关可识别的转发——即带合法 `forwarded_from` 且原始消息
            在本服可追溯。客户端复制粘贴、截图、手改写等不带该字段的转发没有可追溯线索，
            只能按发送者判定（本服人类即 `trusted`）。

    Message:
      type: object
      required: [id, conversation_id, sender, content, trust, provenance, created_at, redacted]
      properties:
        id:
          type: string
          example: msg_demo
        matrix_event_id:
          type: string
          example: $demo_event
        conversation_id:
          type: string
        sender:
          $ref: '#/components/schemas/Actor'
        content:
          $ref: '#/components/schemas/MessageContent'
        trust:
          type: string
          enum: [trusted, untrusted, system]
          description: |
            内容可信度。**由服务端（网关）判定，客户端/调用方随消息提供的值一律忽略。**
            判定按 contract.md §7.1 的规则逐条**独立**评估，**所有命中规则取最低值**
            （偏序 `untrusted < trusted`；`system` 仅由规则 1 在其余规则全不命中时产生，
            任何 `untrusted` 命中覆盖之）：
            网关自身生成的系统通知/策略回执 → `system`；
            `provenance.external=true`（联邦/桥接/外部插件，含 A2.1 配对服务器）→ `untrusted`；
            `origin` 为 `bridge`/`town` → `untrusted`；
            动态评论/点赞附言与他人动态正文 → `untrusted`；
            人设卡字段 → `untrusted`（仅本 persona 所有者在服内写入且经网关校验的自身人设可 `trusted`）；
            本服经鉴权的人类消息与本服 AI 消息 → `trusted`；
            来源不明/字段缺失/解析失败 → `untrusted`（fail-closed）。
            好友关系（A2.2 `friend_subject`）只影响可见性，不影响 trust。
            只能降级不能升级：`forwarded_from` 非空时按本地存储逐跳追溯（上限 8）、
            取本消息与链上各级的最低者，查不到/已过期 → `untrusted`；
            `system` 不参与取低。交给模型前按 §7.2 隔离。
        provenance:
          $ref: '#/components/schemas/MessageProvenance'
        reply_to:
          type: string
        usage:
          $ref: '#/components/schemas/UsageDelta'
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 8
          description: |
            透传元数据（#92）：由发送请求原样带回，不参与策略判断、不进消息正文，
            仅供调用方对账。
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
        redacted:
          type: boolean

    MessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    OutgoingProvenance:
      type: object
      description: 发送消息时调用方声明的来源信息。
      properties:
        forwarded_from:
          type: [string, 'null']
          pattern: '^\$'
          description: |
            转发来源：**原始消息的 Matrix `event_id`**（以 `$` 开头），或 `null`。
            网关按本地消息存储查原始 trust 并逐跳取低（上限 8 跳），详见 contract.md §7.1。
            非法格式（非 `null` 且不以 `$` 开头）→ `422 request.invalid`
            （`errors[].field=provenance.forwarded_from`）。
      additionalProperties: false

    OutgoingContent:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text, markdown]
        text:
          type: string
          minLength: 1
          maxLength: 8000
        mentions:
          type: array
          items:
            type: string
      additionalProperties: false

    OutgoingMessageRequest:
      type: object
      required: [sender_persona_id, content]
      properties:
        sender_persona_id:
          type: string
        content:
          $ref: '#/components/schemas/OutgoingContent'
        reply_to:
          type: string
          description: 被回复消息的 `id` 或 `matrix_event_id`。
        provenance:
          $ref: '#/components/schemas/OutgoingProvenance'
        token_estimate:
          type: integer
          minimum: 0
          description: 预计消耗 token；用于发送前预算检查，未提供时网关按历史均值估算。
        allow_deferred:
          type: boolean
          default: true
          description: 静默时段内是否允许排到时段结束后发送；false 时直接返回 blocked。
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 8
          description: 透传元数据，不参与策略判断，不写入消息正文。
        peer_id:
          type: string
          description: |
            会话对端（persona）标识。三层限额的 peer 层只在请求带上该字段时
            生效，并按 `(sender_persona_id, peer_id)` 计数；与
            `POST /policy/evaluate` 的 `peer_id` 语义相同。
            **校验范围取决于会话成员是否已登记**（#117 审查修订）：会话成员的
            真实来源（HTTP 会话注册 / 房间成员同步）尚未接入，因此
            - **未登记会话**：按 B2.1 采信 `peer_id`，**不校验成员**；带上即生效。
            - **已登记会话**：`peer_id` 须 ∈ 会话成员且 ≠ `sender_persona_id`，否则
              返回 `422 request.invalid`（`errors[].field = peer_id`）。
              当会话中**对方**（排除 sender 自身）存在配置了 peer 层限额的 persona、
              而请求未带 `peer_id` 时，同样返回 `422 request.invalid`；仅 sender 自己
              有 peer 层规则时不报错。
            **空串 `peer_id`（`""`）返回 `400 request.invalid`**（`errors[].field = peer_id`），
            不走策略路径。
            会话成员中无任何 peer 层规则时省略 `peer_id` 与 B2.1 行为一致（兼容条件）。
      additionalProperties: false

    UsageDelta:
      type: object
      required: [tokens_in, tokens_out, total_tokens]
      properties:
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0
          default: 0

    ContextAssembleRequest:
      type: object
      required: [persona_id, items]
      properties:
        persona_id:
          type: string
          description: 请求方 persona；`conversation_id` 必须属于该 persona 的可见范围。
        conversation_id:
          type: string
          description: 可选。带上时按会话成员与归档状态校验；`message` 类条目从该会话的消息存储取 trust。
        system_text:
          type: string
          deprecated: true
          description: |
            **已废弃 / 禁用**：`system` 区**只**含网关固定声明，调用方不得注入任何文本。
            本字段仅为兼容期占位保留；请求中出现 `system_text` 一律按禁用字段处理，
            返回 `400 request.invalid`（`errors[].field=system_text`），**不会**进入任何分区。
        persona_text:
          type: string
          deprecated: true
          description: |
            **已废弃 / 禁用**：`persona` 区内容**必须**由网关从 persona 存储按 owner 鉴权读取，
            调用方不得用请求体顶替。请求只需 `persona_id`；非 owner 或读不到 → persona 区为空
            （不组装该区内容），**不得**用请求体内容替代。
            请求中出现 `persona_text` 一律按禁用字段处理，返回 `400 request.invalid`
            （`errors[].field=persona_text`）。
        items:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            待放入上下文的消息 / 外部内容列表，按给定顺序拼装。单次上限 **200 条**（同 `maxItems`）。
            每项**不接受** `trust` / `external` / `provenance` 等字段（`ContextItem`
            `additionalProperties: false`）：出现即 `400 request.invalid`。
          items:
            $ref: '#/components/schemas/ContextItem'
      additionalProperties: false

    ContextItem:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [message, moments_comment, moments_post, persona_field, external, other]
          description: |
            条目类别，决定 §7.1 的判定规则：
            `message` → 规则 6/7/8，并按 `source_id` 追溯转发链；
            `moments_comment` / `moments_post` → 规则 4（`untrusted`）；
            `persona_field` → 规则 5（`untrusted`，除非为本 persona 所有者的自身人设）；
            `external` → 规则 2（`untrusted`）；
            `other` → 规则 8 fail-closed（`untrusted`）。
        source_id:
          type: string
          description: |
            来源标识。`message` 类填 `message.id` 或 `matrix_event_id`
            （`$` 开头），用于查本地存储取原始 trust 与转发链；查不到按规则 8。
            **存在 `source_id` 时以本地存储正文为准**：请求 `text` 与存储正文不一致 →
            `422 request.invalid`（`errors[].field=items[].text`），该条不进入任何分区。
        text:
          type: string
          maxLength: 8000
          description: |
            原文。带 `source_id` 时**只**作占位 / 客户端缓存，必须与本地存储正文一致（不一致 → `422`）；
            无 `source_id` 的内联条目按 kind 判定（通常 `untrusted`）。
            文本只进 `untrusted_data` 区或 `conversation` 区，**永不进 `system`**。
        label:
          type: string
          maxLength: 120
          description: 供数据区标签使用的简短来源描述（如发送者显示名），仅作展示。
      additionalProperties: false

    ContextAssembleResult:
      type: object
      description: |
        组装结论。`outcome=allowed` 时 `zones` 与 `nonces` 非空、`reason` 为 `null`；
        `outcome=blocked` 时两者为 `null`、`reason.code=trust.isolation_failed`，
        且 `retryable=false`、`retry_after_seconds=null`、`same_content_allowed=false`、
        `may_clear_at=null`、`queue_id=null`；记一条 `usage_events kind=blocked`，
        **不计** token / 消息配额。
      required: [outcome, retryable, zones, nonces, reason]
      properties:
        outcome:
          type: string
          enum: [allowed, blocked]
        retryable:
          type: boolean
          description: |
            `allowed` → `false`（已成功，无需重试）；`blocked` → **始终** `false`。
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
          description: '`blocked` 时始终 `null`。'
        same_content_allowed:
          type: boolean
          description: '`blocked`（`trust.isolation_failed`）时始终 `false`：构造失败的上下文不因等待而变得可用。'
        may_clear_at:
          type: [string, 'null']
          format: date-time
          description: '`blocked` 时始终 `null`：隔离失败没有「额度恢复时间」。'
        queue_id:
          type: [string, 'null']
          description: '始终 `null`：本接口不产生排程。'
        zones:
          anyOf:
            - $ref: '#/components/schemas/ContextZones'
            - type: 'null'
        nonces:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ContextNonce'
            - type: 'null'
          description: |
            每个 `untrusted_data` 段一个 nonce，与 `zones.untrusted_data` 中的
            开闭标签一一对应。每段独立生成、CSPRNG、≥128 bit、不跨请求/轮次复用。
        items:
          type: array
          description: 每条输入的判定结果，供运行时核对（顺序与请求 `items` 一致）。
          items:
            $ref: '#/components/schemas/ContextItemVerdict'
        reason:
          anyOf:
            - $ref: '#/components/schemas/PolicyReason'
            - type: 'null'

    ContextZones:
      type: object
      description: |
        固定顺序的四分区文本。`untrusted` 内容只出现在 `untrusted_data`；
        `system` 区含网关固定声明，不含任何外部原文；`persona` 区仅本 persona 所有者
        的自身人设。`untrusted_data` 每段由 nonce 标签包裹，
        原文中出现相同 nonce 或边界标记字面量时已先转义（先归一化后检测、按码点截断并保留闭合边界）。
      required: [system, persona, conversation, untrusted_data]
      properties:
        system:
          type: string
          description: 网关策略与固定声明。
        persona:
          type: string
          description: 本 persona 所有者本人的人设。
        conversation:
          type: string
          description: '`trusted` 的对话内容。'
        untrusted_data:
          type: string
          description: '`untrusted` 数据区，每段用独立 nonce 包裹。'

    ContextNonce:
      type: object
      required: [segment_id, nonce, bits]
      properties:
        segment_id:
          type: string
          description: |
            数据区该段的标识，**必须等于** `nonce` 字面量，也就是 `zones.untrusted_data`
            中该段开闭标签 `id="..."` 的值（不接受可预测的 `seg_N`）。
        nonce:
          type: string
          description: |
            该段使用的 nonce 字面量（hex 或 base64url）。它就是标签 `id` 的值——
            `<untrusted id="{nonce}">…</untrusted id="{nonce}">`，每段独立、不可预测。
        bits:
          type: integer
          minimum: 128
          description: nonce 熵下界，固定 ≥128。

    ContextItemVerdict:
      type: object
      required: [index, trust]
      properties:
        index:
          type: integer
          minimum: 0
          description: 对应请求 `items` 中的下标。
        source_id:
          type: string
        trust:
          type: string
          enum: [trusted, untrusted, system]
          description: |
            网关按 §7.1 判定的结果（调用方传入的 `trust` 不被采纳）。`items[]` 的文本
            **永不进 `system` 区**：若某条被判定为 `system`（不应由 `items` 产生），
            该条文本按丢弃处理、不进入任何分区，仅在结果里回传判定供核对。
        rule:
          type: string
          description: 命中的判定规则标识（如 `rule1`…`rule8`、`forwarded_from`，供核对）。

    PolicyReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            原因码。开放字符串（未知值按通用 blocked 处理），推荐取值：
            `messages.window.exceeded`、`tokens.window.exceeded`、
            `min_interval.too_soon`、`silent_hours.active`、
            `proactive.per_day.exceeded`、`town.tokens_per_day.exceeded`、
            `message.length`、`relation.chat_denied`、`conversation.e2ee`，
            以及 B2.2 熔断相关：
            `anti_spam.consecutive`（同 persona 连续 AI 消息达到上限，触发那条）、
            `anti_spam.cooldown`（防刷屏冷却未结束，冷却期内后续请求）、
            `ai_loop.tripped`（同会话任意 AI 互聊达到每小时上限）。
            以及 B2.3 隔离相关：
            `trust.isolation_failed`（隔离器报错、边界生成失败或 trust 无法判定时
            fail-closed 不调用模型，仍为 `200` + `outcome: blocked`）。
            旧码 `ai_loop.breaker_open` 视为 `ai_loop.tripped` 的别名（仅曾出现在
            示例，src 从未输出；照旧码实现的客户端仍可正常工作）。
            **注意**：`PolicyReason.code` 与 `PolicyCheck.key` 是两套名字——
            `code` 是原因码，`key` 是检查项标识，两者同域但取值不同。
          example: ai_loop.tripped
        message:
          type: string
          description: 面向调用方的简短原因（不含内部提示词或不可信内容原文）。
        layer:
          type: string
          enum: [platform, owner, peer, system]

    PolicyCheck:
      type: object
      description: |
        单项策略检查。`key` 推荐取值见 contract.md 限额一节：
        `messages.window`、`tokens.window`、`proactive.per_day`、`town.tokens_per_day`、
        `silent_hours`、`min_interval`、`anti_spam.consecutive`、`anti_spam.cooldown`、
        `ai_loop.per_hour`、`message.length`、`relation.chat_allowed`。
        `code` 与 `PolicyReason.code` 同域但不同名——`key` 是检查项标识，`code` 是未通过原因码；
        B2.2 取值为 `anti_spam.consecutive` / `anti_spam.cooldown` / `ai_loop.tripped`。
      required: [key, layer, allowed]
      properties:
        key:
          type: string
          description: |
            检查项标识，推荐值：`messages.window`、`tokens.window`、`proactive.per_day`、
            `town.tokens_per_day`、`silent_hours`、`min_interval`、`anti_spam.consecutive`、
            `anti_spam.cooldown`、`ai_loop.per_hour`、`message.length`、`relation.chat_allowed`。
          example: ai_loop.per_hour
        layer:
          type: string
          enum: [platform, owner, peer, system]
        allowed:
          type: boolean
        limit:
          type: [number, 'null']
        used:
          type: number
          minimum: 0
        remaining:
          type: [number, 'null']
        reset_at:
          type: [string, 'null']
          format: date-time
        code:
          type: string
          description: 未通过时的原因码。
        source_id:
          type: string
          description: 该层规则的来源（角色、会话或对方角色 ID）。

    PolicyDecision:
      type: object
      required: [decision, allowed, evaluated_at, retryable, checks]
      properties:
        decision:
          type: string
          enum: [allow, defer, block]
        allowed:
          type: boolean
          description: |
            `allow` → `true`；`block` → `false`；
            `defer` → `false`（服务端排程延后，当前时刻不允许立即发言；
            最终会投递但不是「立即允许」）。
        evaluated_at:
          type: string
          format: date-time
        winner_layer:
          type: [string, 'null']
          enum: [platform, owner, peer, null]
          description: 最严格限制所属的层。
        retryable:
          type: boolean
          description: |
            `block` 时为 `false`（同一内容不重试）；`defer` 时为 `false`
            （客户端不自行重试，服务端排程后推送）；`allow` 时为 `false`（已允许无需重试）。
            此字段是 `PolicyDecision` 自身的语义，以 `MessageReceipt.retryable` 为权威来源。
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/PolicyReason'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCheck'

    PolicyEvaluateRequest:
      type: object
      required: [persona_id]
      properties:
        persona_id:
          type: string
        conversation_id:
          type: string
        kind:
          type: string
          enum: [message, proactive, town_action]
          default: message
        content:
          type: string
          maxLength: 8000
          description: 拟发送文本；用于长度与注入相关检查。
        token_estimate:
          type: integer
          minimum: 0
          description: |
            预计消耗 token；网关按 `max(token_estimate, estimate_tokens(content))`
            计量，客户端值只是下限，不能用 `0` 绕过 token 预算。
        peer_id:
          type: string
          description: |
            会话对端（persona）标识，用于触发 peer 层限额，并按
            `(persona_id, peer_id)` 计数。省略时不参与 peer 层计算；实发路径请与
            `OutgoingMessageRequest.peer_id` 保持一致，否则预检与实发结论可能不同。
            **校验范围取决于会话是否已登记**（#117 审查修订）：会话成员来源
            （HTTP 注册 / 房间成员同步）尚未接入，因此
            - **未登记会话或未带 `conversation_id`**：按 B2.1 采信 `peer_id`，**不校验成员**；
              带上即生效。
            - **已登记会话**：`peer_id` 须 ∈ 会话成员且 ≠ `persona_id`，否则返回
              `422 request.invalid`（`errors[].field = peer_id`）。当会话中**对方**
              （排除 sender 自身）存在配置了 peer 层限额的 persona、而请求未带 `peer_id`
              时同样返回 422；仅 sender 自己有 peer 层规则时不报错。
            **空串 `peer_id`（`""`）返回 `400 request.invalid`**（`errors[].field = peer_id`）。
            会话成员中无任何 peer 层规则时省略 `peer_id` 与 B2.1 行为一致（兼容条件）。
      additionalProperties: false

    MessageReceipt:
      type: object
      description: |
        `outcome` 是网关的发言裁决：`delivered` 已投递、`queued` 已入队（带 `queue_id`）、
        `deferred` 延后到允许时段（服务端排程，带 `queue_id`，客户端**不要**自行重试）、
        `blocked` 本次不允许（**不重试**，`retryable: false`；原因见 `decision.reasons`；
        记 `usage_events kind=blocked`）。

        `retryable` / `retry_after_seconds` 只在本结构内有效，`PolicyDecision` 内的同名字段
        仅在 `POST /policy/evaluate` 单独使用时有意义，两处语义相同但不互相引用。

        **200 响应不附带 `Retry-After` HTTP 头**；重试时机放 body 里。

        三分表（供通知 / 重试 / 审计统一口径）：
        - **成功**：`delivered` / `queued` / `deferred`，2xx，不是错误
        - **策略拦截**：`blocked`，2xx，不重试，记 `usage_events kind=blocked`
        - **失败**：4xx / 5xx，body 为 problem+json，按 `code` 决定重试策略
      required: [outcome, retryable, decision]
      properties:
        outcome:
          type: string
          enum: [delivered, queued, deferred, blocked]
        retryable:
          type: boolean
          description: |
            `delivered` → `false`；`queued` / `deferred` → `false`（服务端排程，客户端不重试）；
            `blocked` → **始终 `false`**（同一内容不再重试；若额度会恢复见 `may_clear_at`）。
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            `blocked` 时始终 `null`（不重试）；`deferred` 时为服务端排程到允许时段的等待秒数（仅供参考显示，不要用它自动重试）。
        may_clear_at:
          type: [string, 'null']
          format: date-time
          description: |
            `blocked` 时可选：额度预计恢复时间（如周期窗口重置时间）。与 `retryable: false`
            不矛盾——当前内容被拦截不重试，但用户换内容后可以在该时间后重试。
        same_content_allowed:
          type: boolean
          description: |
            `false`：同一内容即使额度恢复也不允许再发（例如关系策略永久拒绝，或
            内容本身触发了策略）。`true` 或省略：额度/窗口恢复后同一内容可重发
            （例如限额触发了熔断，内容本身没有问题）。
        queue_id:
          type: [string, 'null']
          description: |
            `queued` / `deferred` 时为服务端排程 ID（必填，用于追踪投递状态）。
            幂等缓存对 `queued` / `deferred` **同样生效**：用同一 `Idempotency-Key` 重放
            返回同一 `queue_id` 与当前状态，不会新建排程；排程进入终态后，重放返回终态回执
            （`delivered` / `blocked`）。
        message:
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        delivery:
          anyOf:
            - type: object
              required: [matrix_event_id, delivered_at]
              properties:
                matrix_event_id:
                  type: string
                delivered_at:
                  type: string
                  format: date-time
            - type: 'null'
        usage_delta:
          $ref: '#/components/schemas/UsageDelta'
        decision:
          $ref: '#/components/schemas/PolicyDecision'

    # ----- 限额 -----
    AntiSpamRules:
      type: object
      description: |
        防刷屏规则。`max_consecutive_ai_messages` 越小越严；`cooldown_seconds` 越大越严。
        平台层由 `PLATFORM_MAX_CONSECUTIVE_AI_MESSAGES` / `PLATFORM_ANTI_SPAM_COOLDOWN_SECONDS` 设置，
        **默认 `0` = 平台不设该项**（不输出该键，生效值只由 owner/peer 层决定，与
        `RATE_LIMIT_MESSAGES=0` 的既有语义一致）。
      properties:
        max_consecutive_ai_messages:
          type: integer
          minimum: 1
          maximum: 50
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 86400

    AiLoopRules:
      type: object
      description: |
        互聊熔断规则。`max_ai_messages_per_hour` 越小越严；`on_break` 默认 `stop`。

        **平台层数值项（`PLATFORM_MAX_AI_MESSAGES_PER_HOUR`）**：默认 `0` = 平台不设该项
        （省略键，不输出该键，与 `RATE_LIMIT_MESSAGES=0` 既有语义一致）。
        **`PLATFORM_AI_LOOP_ON_BREAK` 单独说明（不适用「0=不设」）**：它是枚举项，默认
        `stop` 就是平台底线值；**枚举严格序：`stop` 严于 `notify`**（`notify` 当前版本
        按 `stop` 执行，fail-closed）。

        **两种 `0` 的语义不同**：
        - 平台 env `0`（`PLATFORM_MAX_AI_MESSAGES_PER_HOUR=0`）= 不设该项（省略键）；
        - API 的 `max_ai_messages_per_hour: 0`（本 schema 内）= 有效限额，一条都不允许；
          此时 `may_clear_at = null`（永不因滑窗恢复），见下。

        `may_clear_at`（N8）：
        - `limit > 0`：取第 `(used − limit + 1)` 早的计入事件出窗时刻（向上取整到秒）；
          最终取 `max(计算值, ceil(now)+1s)`，永不返回过去或当前时刻，避免活锁；
          在途预留（未超 TTL 的 `ReservationBook` 条目）按 `at+3600` 计入排序。
        - `limit = 0`：`may_clear_at = null`，窗口内永远不会因事件出窗而恢复名额。
        - `used == limit` 时退化为既有「第 1 早」口径。
      properties:
        max_ai_messages_per_hour:
          type: integer
          minimum: 0
          maximum: 1000
        on_break:
          type: string
          enum: [stop, notify]
          default: stop

    LimitRules:
      type: object
      description: |
        各字段都是「该层可选设置」；**省略**表示该层不额外限制，不等于关闭其他层。
        最终生效值取三层中最严者（逐项比较，不是整层覆盖）。

        **窗口类限额按「速率对」取最严**：`messages_per_window` 与
        `tokens_per_window` 各自和它的 `window_seconds` 是一个整体，比较的是
        `count / window`；胜出层成对采用自己的 `count` + `window`（该层省略
        `window_seconds` 时回退平台窗口）。**`window_seconds` 不单独比较**：
        只缩短窗口同样算放宽，`PUT /limits` 会返回 `422 limit.out_of_range`。

        **`0` 的语义**：本 schema 内的 `0` 是有效限额（例如 `messages_per_window: 0`
        表示一条都不允许），不是「不限」。要表达「该层不限制」请省略该字段。

        严格方向：`proactive_per_day` / `town_tokens_per_day` / `max_message_chars`
        越小越严；`min_seconds_between_messages` 与 `silent_hours.enabled: true`
        越大/越严。
        owner / peer 层任何一项比平台层宽松 → `422 limit.out_of_range`。

        **`window_seconds` 必须成对出现**（#114-4）：本层写了 `window_seconds`，
        就必须同时写 `messages_per_window` 或 `tokens_per_window` 中的至少一个；
        只写 `window_seconds` 不产生任何效果，按 **422 `limit.out_of_range`** 拒绝。

        **错误边界**（#114-7.8b，状态码不变）：结构或类型错误（缺字段、类型不符、
        非 JSON、未知属性）→ **400 `request.invalid`**；值进入 schema 合法范围但语义
        不合法（比平台层宽松、只写 `window_seconds`、枚举值未知如 `on_break`、
        时区不合法）→ **422 `limit.out_of_range`**。
      properties:
        window_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          default: 86400
          description: |
            窗口类限额（`messages_per_window`、`tokens_per_window`）的窗口长度。
            与同一层的计数项**成对**参与比较，不单独参与「取最严」；该层省略时
            沿用平台窗口。
        messages_per_window:
          type: integer
          minimum: 0
        tokens_per_window:
          type: integer
          minimum: 0
        proactive_per_day:
          type: integer
          minimum: 0
        town_tokens_per_day:
          type: integer
          minimum: 0
        max_message_chars:
          type: integer
          minimum: 1
          maximum: 8000
        min_seconds_between_messages:
          type: integer
          minimum: 0
          maximum: 86400
        silent_hours:
          $ref: '#/components/schemas/SilentHours'
        anti_spam:
          $ref: '#/components/schemas/AntiSpamRules'
        ai_loop:
          $ref: '#/components/schemas/AiLoopRules'

    LimitPolicy:
      type: object
      required: [layer, scope, scope_id, rules]
      properties:
        layer:
          type: string
          enum: [owner, peer]
          description: 平台底线层只读，不接受写入。
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        rules:
          $ref: '#/components/schemas/LimitRules'
      additionalProperties: false

    LimitLayer:
      type: object
      required: [layer, scope, scope_id, rules]
      properties:
        layer:
          type: string
          enum: [platform, owner, peer]
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        rules:
          $ref: '#/components/schemas/LimitRules'
        updated_at:
          type: string
          format: date-time

    EffectiveLimit:
      type: object
      required: [key, value, unit, source_layer, source_id]
      properties:
        key:
          type: string
          example: tokens_per_window
        value: {}
        unit:
          type: string
          enum: [count, tokens, seconds, chars, boolean]
        source_layer:
          type: string
          enum: [platform, owner, peer]
        source_id:
          type: string

    EffectiveLimits:
      type: object
      description: |
        三层限额的生效值与各层原始规则。

        **示例口径**：`examples/effective-limits.json` 是一个**已配置平台层值的部署**的
        响应样例（`anti_spam` / `ai_loop` 等平台键有具体值），**不是默认部署的输出**。
        默认部署按 §6.3 的平台 env 语义（`0` = 不设该项）**省略**这些平台键，生效值
        只由 owner / peer 层决定；读取示例时不要把它当成默认值。
      required: [scope, scope_id, generated_at, effective, layers]
      properties:
        scope:
          type: string
          enum: [persona, conversation, peer]
        scope_id:
          type: string
        generated_at:
          type: string
          format: date-time
        effective:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveLimit'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LimitLayer'

    # ----- 用量 -----
    UsageTotals:
      type: object
      required:
        - messages_sent
        - messages_blocked
        - messages_deferred
        - tokens_in
        - tokens_out
        - tokens_total
        - proactive_messages
        - model_calls
        - town_tokens
      properties:
        messages_sent:
          type: integer
          minimum: 0
        messages_blocked:
          type: integer
          minimum: 0
        messages_deferred:
          type: integer
          minimum: 0
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        tokens_total:
          type: integer
          minimum: 0
        proactive_messages:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0

    UsageBudget:
      type: object
      required: [limit, used, remaining, reset_at]
      properties:
        limit:
          type: [integer, 'null']
          minimum: 0
        used:
          type: integer
          minimum: 0
        remaining:
          type: [integer, 'null']
          minimum: 0
        reset_at:
          type: [string, 'null']
          format: date-time
        source_layer:
          type: [string, 'null']
          enum: [platform, owner, peer, null]

    UsageBucket:
      type: object
      required: [key, messages_sent, tokens_total, town_tokens]
      properties:
        key:
          type: string
          description: 分桶键（会话 ID、日期、能力 ID 或模型 ID）。
        messages_sent:
          type: integer
          minimum: 0
        tokens_total:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0

    UsageSummary:
      type: object
      required: [from, to, timezone, totals, budget, breakdown]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Shanghai
        persona_id:
          type: string
        conversation_id:
          type: string
        totals:
          $ref: '#/components/schemas/UsageTotals'
        budget:
          $ref: '#/components/schemas/UsageBudget'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/UsageBucket'

    UsageEvent:
      type: object
      required: [id, occurred_at, kind]
      description: |
        一条用量审计记录。

        **不含消息正文**（#92）：为保护用户隐私，事件**不存储**消息内容。
        `text_length` 存储 Unicode 字符数（与 `len(text)` 一致），`text_sha256`
        存储 `hex(HMAC-SHA256(部署密钥 GATEWAY_HMAC_SECRET, b"text\x00" + UTF-8(正文)))`
        的十六进制值（#114 PR-a，`b"text\x00"` 为域分隔前缀，复算时必须带上），
        二者可用于对账与去重排查；没有部署密钥无法字典反推，轮换密钥后不可跨期比对。
        旧字段 `text_preview` 已从 B2.1 起**不再写入**；历史事件若存在该字段，
        客户端必须忽略它（`additionalProperties` 遵循前向兼容原则）。
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [model_call, message_sent, blocked, message_blocked, proactive_message, town_action, image_generation, card_action]
          description: |
            `blocked` 是策略拦截的规范值；`message_blocked` 为旧别名。
            `card_action` 记录一次卡片操作（与 `audit_id` 关联）。
        persona_id:
          type: string
        conversation_id:
          type: string
        peer_id:
          type: string
          description: |
            发送时的会话对端（persona）标识，取自请求的 `peer_id`（B2.2 起可选写入）。
            用于按 `(persona, peer_id)` 统计 peer 层限额；旧事件无此字段时只计入
            persona 全局与 platform/owner 层，不计入任何 peer 层。
        capability_id:
          type: string
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        town_tokens:
          type: integer
          minimum: 0
        decision_code:
          type: string
        audit_id:
          type: [string, 'null']
          description: 仅 `card_action` kind 时有值；与 `AuditRecord.id` 对应。
        request_id:
          type: string
        text_length:
          type: integer
          minimum: 0
          description: 消息正文的字符数（不含正文本身）。可用于统计分析与对账。
        text_sha256:
          type: string
          description: |
            `hex(HMAC-SHA256(部署密钥 GATEWAY_HMAC_SECRET, b"text\x00" + UTF-8(正文)))`
            的十六进制值（#114 PR-a，字段名沿用）。`b"text\x00"` 是域分隔前缀
            （与 txnId 的 `b"txn\x00"` 隔开），按契约复算时必须带上。
            同一部署同内容同值，用于去重与对账；无密钥不可字典反推；
            轮换密钥后不可跨期比对。轮换同时会改变 txnId，轮换前排空在途重试，
            否则旧 key 的重试会落到新事务上、可能重复投递（txnId/text_sha256 的
            幂等缓存与去重账本均为进程内存，假设单进程；多实例须共用同一密钥）。
            正文为空时此字段省略。

    UsageEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UsageEvent'

    # ----- 主人记忆管理（B2.6 PR3c）-----
    MemoryScope:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [dm, group]}
        counterpart: {type: [string, 'null']}
        room_id: {type: [string, 'null']}
      additionalProperties: false
    MemorySource:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [event, owner, extraction, summary]}
        event_id: {type: string}
        sender: {type: string}
        role: {type: string, enum: [user, assistant]}
        model: {type: string}
      additionalProperties: false
    Memory:
      type: object
      required: [id, persona_id, layer, scope, visibility, trust, source, pinned, text, redacted, created_at, updated_at, expires_at]
      properties:
        id: {type: string, pattern: '^m[rsf]_[0-9a-f]{16}$'}
        persona_id: {type: string}
        layer:
          description: 开放枚举；未知值按只读元数据处理。
          anyOf:
            - enum: [recent, summary, profile]
            - type: string
        scope: {$ref: '#/components/schemas/MemoryScope'}
        visibility: {type: string, enum: [scope_only, dm_only, shared]}
        trust: {type: string, enum: [trusted, untrusted, derived, owner]}
        source: {$ref: '#/components/schemas/MemorySource'}
        pinned: {type: boolean}
        text: {type: [string, 'null']}
        key: {type: string}
        value: {type: [string, 'null']}
        dirty: {type: boolean}
        redacted:
          type: boolean
          description: DM 可读开关关闭或群成员门禁未通过时为 true，text 和适用的 fact value 为 null；E6 响应同样适用。
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
      additionalProperties: false
    MemoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Memory'}
        page: {$ref: '#/components/schemas/PageMeta'}
      additionalProperties: false
    MemoryFactWrite:
      type: object
      required: [persona_id, counterpart, key, value]
      properties:
        persona_id: {type: string}
        counterpart: {type: string, description: 本服真实人类 Matrix user id。}
        key: {type: string, description: 必须属于服务端 FACT_KEYS。}
        value: {type: string, minLength: 1, maxLength: 500}
        visibility: {type: string, enum: [dm_only, shared], default: dm_only}
      additionalProperties: false

    # ----- 功能清单 -----
    CapabilityIcon:
      type: object
      required: [type, value]
      properties:
        type:
          description: |
            开放枚举：`sf_symbol` / `url`。客户端遇到未知类型时忽略图标并按无图标渲染。
          anyOf:
            - enum: [sf_symbol, url]
            - type: string
        value:
          type: string
          description: SF Symbol 名称或图标 URL。
        fallback:
          type: string
          description: |
            `type: sf_symbol` 时的回退 symbol 名（设备系统没有主 symbol 时使用）；
            仍不可用时按无图标渲染。

    CapabilityEntry:
      type: object
      description: |
        模块入口。`native` 使用 App 内置页面与 `deep_link`；`web` 用内置浏览器打开 `web_url`，
        需先取一次性 code；`card_list` 直接在动态页渲染指定类型的卡片。未知 entry 类型视为
        `none`，App 忽略该入口但保留能力。
      required: [type]
      properties:
        type:
          description: |
            开放枚举：`native` / `web` / `card_list` / `none`。
            **未知类型一律按 `none` 处理**——保留能力、忽略入口，不得导致清单解码失败。
          anyOf:
            - enum: [native, web, card_list, none]
            - type: string
        deep_link:
          type: string
          example: botville://chat
        web_url:
          type: string
          format: uri
          example: https://gateway.example.invalid/modules/memory/
        card_types:
          type: array
          items:
            type: string

    CapabilityI18nText:
      type: object
      required: [title]
      properties:
        title:
          type: string
        summary:
          type: string
        description:
          type: string

    CapabilityI18n:
      type: object
      description: 语言代码到本地化文本的映射；缺省时回退顶层字段。
      additionalProperties:
        $ref: '#/components/schemas/CapabilityI18nText'

    CapabilitySessionConfig:
      type: object
      required: [supported]
      properties:
        supported:
          type: boolean
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: |
            模块网页会话的建议有效期（秒），上限 3600。WKWebView 会话是短时的，
            不再支持 24 小时这种长值。

    Capability:
      type: object
      required: [id, module, version, title, summary, status, entry, scopes]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)*$'
          example: memory.search
        module:
          description: |
            开放枚举：所属模块，与仓库模块名一致（`core`/`role`/`memory`/`social`/`notify`/
            `bridge`/`town`）。未知 module 照常显示能力，按「其他」分组。
          anyOf:
            - enum: [core, role, memory, social, notify, bridge, town]
            - type: string
          example: memory
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 0.9.0
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        icon:
          $ref: '#/components/schemas/CapabilityIcon'
        status:
          description: |
            开放枚举：`enabled` / `disabled` / `degraded`。
            **未知 status 按 `disabled` 处理**（入口隐藏），不得导致整份清单解码失败。
          anyOf:
            - enum: [enabled, disabled, degraded]
            - type: string
        unavailable_reason:
          type: string
          description: 不可用或降级时的机器可读原因，例如 `module_disabled`。
        entry:
          $ref: '#/components/schemas/CapabilityEntry'
        scopes:
          type: array
          items:
            type: string
          description: 调用该能力所需的网关 scope。
        requires:
          type: array
          items:
            type: string
          description: 依赖的其他能力 ID；依赖不可用时本能力不可用。
        session_token:
          $ref: '#/components/schemas/CapabilitySessionConfig'
        min_app_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        i18n:
          $ref: '#/components/schemas/CapabilityI18n'
        updated_at:
          type: string
          format: date-time
        owner_can_read_dm:
          type: boolean
          default: false
          description: memory.manage 的 DM 可读状态，反映 GATEWAY_MEMORY_OWNER_CAN_READ_DM；仅 true 时展示主人可查看和删除聊天记忆的披露，false 时仅可见元数据，管理及写入仍可用。

    CapabilityManifest:
      type: object
      required: [manifest_version, contract_version, generated_at, capabilities]
      properties:
        manifest_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 1.3.0
        contract_version:
          type: string
          description: 生成该清单的网关契约版本。
          example: 0.2.0
        generated_at:
          type: string
          format: date-time
        cache_ttl_seconds:
          type: integer
          minimum: 0
          default: 300
        defaults:
          type: object
          properties:
            unknown_capability:
              type: string
              enum: [hidden, disabled]
              default: hidden
              description: |
                遇到未知能力 ID 时的处理方式：`hidden`（忽略，不显示入口）或
                `disabled`（显示为不可用）。仅适用 native 入口（无法路由到对应能力时）。
            card_fallback:
              type: string
              enum: [text]
              default: text
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    SessionTokenRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: |
            要打开的模块网页地址。必须与能力的 `entry.web_url` 同源；网关把一次性 `code`
            作为查询串附加后返回。App 不得自行拼接 `code`。
          example: https://gateway.example.invalid/modules/memory/
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
          description: |
            App 允许在**内置浏览器**内加载的 origin 白名单。只在该列表内放行导航；
            跳到其他 origin 时改用外部浏览器打开。省略时默认为 `url` 的 origin。
          example: ['https://gateway.example.invalid']
        scopes:
          type: array
          items:
            type: string
          description: 请求的 scope 子集，不得超出能力声明的 scopes。
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: 会话有效期（秒），**上限 3600**。一次性 `code` 本身的 TTL ≤ 60 秒，与此无关。
      additionalProperties: false

    SessionToken:
      type: object
      description: |
        一次性 code 交换信息。`code` 单次使用、≤ 60 秒有效，只能由模块页面拿去换
        HttpOnly cookie；App 不得把它当长期凭据保存或以 `Authorization` 头发送。
      required: [code, code_ttl_seconds, expires_at, audience, url, allowed_origins]
      properties:
        code:
          type: string
          description: 一次性 code，占位示例。TTL ≤ 60 秒，单次使用。
          example: <change-me>
        code_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: code 的有效期（秒），上限 60。
        expires_at:
          type: string
          format: date-time
          description: 兑换出的 cookie 会话到期时间（`now + ttl_seconds`，≤ 3600 秒）。
        audience:
          type: string
          description: 该会话仅适用于对应 capability ID。
        url:
          type: string
          format: uri
          description: |
            建议打开的模块网页地址，**已附带一次性 `code`**。这是唯一允许出现 `code`
            的位置；不得写入日志、localStorage 或长期缓存。
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
          description: 内置浏览器放行的 origin 白名单；超出即改用外部浏览器。
        renew_via:
          type: string
          enum: [js_bridge]
          default: js_bridge
          description: |
            会话续期方式：页面通过 JS bridge 消息 `botville.session.renew` 通知 App，
            App 重新调用 `session-tokens`。页面脚本不得自行续期。

    SessionCookieRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 从 `session-tokens` 一次性 code 获取的原始值。
          example: <change-me>
      additionalProperties: false

    # ----- 卡片 -----
    CardBlockItem:
      type: object
      required: [label]
      properties:
        label:
          type: string
        value:
          type: string
        emphasis:
          type: boolean
          default: false

    CardBlock:
      type: object
      description: |
        通用渲染块。字段按 `type` 取用，见 contract.md 卡片一节：
        text→text；key_value/list→items；divider→无；image→url、alt；
        progress→value、max、label；code→text。

        `type` 是开放枚举：客户端遇到未知块类型时**跳过该块**继续渲染其余内容，
        不得因未知块导致整卡解码失败。
      required: [type]
      properties:
        type:
          description: |
            开放枚举：`text` / `key_value` / `divider` / `image` / `progress` / `list` / `code`。
            未知类型 → 跳过此块。
          anyOf:
            - enum: [text, key_value, divider, image, progress, list, code]
            - type: string
        text:
          type: string
          maxLength: 4000
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlockItem'
        url:
          type: string
          format: uri
          description: '`image` 块只接受 `https` URL；加载失败时显示 `alt`。'
        alt:
          type: string
          description: 图片替代文本；也用于图片加载失败时的占位。
        aspect_ratio:
          type: number
          description: 可选宽高比（如 `1.777`），供客户端预留布局高度、避免列表跳动。
          exclusiveMinimum: 0
        label:
          type: string
        value:
          type: number
        max:
          type: number
        level:
          description: |
            开放枚举：`info` / `success` / `warning` / `danger`。未知 level 按无颜色渲染。
          anyOf:
            - enum: [info, success, warning, danger]
            - type: string

    CardActionConfirmation:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
        title:
          type: string
        body:
          type: string
        biometric:
          type: boolean
          description: |
            高风险操作必须为 true，App 完成 Face ID 后提交 assertion。
            若服务端漏配而有效 risk 为 `high`，App 仍**强制**二次确认 + Face ID。

    CardAction:
      type: object
      required: [id, label, kind, style]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          description: |
            开放枚举：`approve` / `deny` / `open_url` / `callback` / `dismiss`。
            **未知 kind → 隐藏该按钮**（保留其余操作），不得整卡解码失败。
          anyOf:
            - enum: [approve, deny, open_url, callback, dismiss]
            - type: string
        style:
          description: |
            开放枚举：`primary` / `secondary` / `danger`。未知 style 按 `secondary`。
          anyOf:
            - enum: [primary, secondary, danger]
            - type: string
        risk:
          description: |
            可选，缺省继承卡片 `risk`。有效风险为 `action.risk ?? card.risk`。
            **未知 risk 按 `high` 处理**（二次确认 + Face ID）。
          anyOf:
            - enum: [low, medium, high]
            - type: string
        target:
          description: |
            `kind: open_url` 时打开链接的位置：`in_app` 用内置浏览器（可携带该能力的
            session cookie），`external` 用系统浏览器。缺省 `external`。
          anyOf:
            - enum: [in_app, external]
            - type: string
        capability_id:
          type: string
          description: '`target: in_app` 时可选，指明用哪个能力的会话打开链接。'
        url:
          type: string
          format: uri
          description: '当 `kind` 为 open_url 时必填，且为 `https`。'
        payload:
          type: object
          description: 回传给来源模块的不透明数据；不得包含密钥或无关个人信息。
        confirmation:
          $ref: '#/components/schemas/CardActionConfirmation'
        disabled_reason:
          type: string

    CardSource:
      type: object
      required: [module]
      anyOf:
        - required: [event_id]
        - required: [dedupe_key]
      properties:
        module:
          description: |
            开放枚举：产生卡片的模块，对齐 Capability 的 module（`core`/`role`/`memory`/
            `social`/`notify`/`bridge`/`town`）。未知 module 照常显示。
          anyOf:
            - enum: [core, role, memory, social, notify, bridge, town]
            - type: string
        capability_id:
          type: string
          description: |
            来源能力 ID。创建时校验它属于调用方的 scope；`notification` / `approval`
            卡片必填，用于去重与来源识别。
        event_id:
          type: string
          description: |
            来源事件的稳定 ID。与 `source.dedupe_key` 二选一必填（优先使用此字段）。
            服务端按 `(capability_id, event_id ?? dedupe_key)` 去重：同一键重复创建返回已有卡片，
            不会重复打扰。
        dedupe_key:
          type: string
          description: |
            去重键，与 `source.event_id` 二选一必填。用于来源没有稳定事件 ID 的桥接场景
            （如外部 webhook、轮询结果）。服务端按 `(capability_id, event_id ?? dedupe_key)` 去重。
        actor:
          $ref: '#/components/schemas/Actor'

    CardContext:
      type: object
      properties:
        conversation_id:
          type: string
        deep_link:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    CardI18nText:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        fallback_text:
          type: string

    CardDelivery:
      type: object
      description: |
        单个投递渠道的投递状态。与 `Card.status`（用户生命周期）分开：
        `status` 表示用户是否已读/已处理，`delivery` 表示渠道是否真的送达。
        模糊结果（超时、回执缺失）记 `unconfirmed`，**不得在同渠道重放**，避免重复打扰。
      required: [channel, state, attempts]
      properties:
        channel:
          description: |
            开放枚举：`push` / `in_app` / `email` / `webhook` 等。未知渠道照常显示状态。
          anyOf:
            - enum: [push, in_app, email, webhook]
            - type: string
        state:
          description: |
            开放枚举：`pending` / `confirmed` / `unconfirmed` / `failed`。
            未知 state 按 `unconfirmed` 处理（不重放该渠道）。
          anyOf:
            - enum: [pending, confirmed, unconfirmed, failed]
            - type: string
        attempts:
          type: integer
          minimum: 0
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
          description: 失败或未确认的机器可读原因，例如 `push.timeout`、`push.receipt_missing`。
        provider_message_id:
          type: [string, 'null']
          description: 渠道侧的消息 ID，用于对账。

    Card:
      type: object
      required:
        - id
        - card_schema_version
        - type
        - title
        - blocks
        - actions
        - priority
        - risk
        - status
        - fallback_text
        - source
        - created_at
      properties:
        id:
          type: string
        card_schema_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          example: 1.0.0
          description: |
            卡片结构版本。**与契约 `info.version` 解耦**：卡片 minor 升级不要求契约升版本，
            卡片 major 可在 `/v1` 内共存（通过协商下发 `fallback_text`）。见 contract.md 4.7。
        type:
          description: |
            开放枚举：`notification` / `approval` / `moment` / `system` / `reminder` / `result`。
            **未知 type → 只用 `fallback_text` 降级渲染**，不崩溃。
          anyOf:
            - enum: [notification, approval, moment, system, reminder, result]
            - type: string
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        fallback_text:
          type: string
          description: 纯文本降级内容；旧客户端、未知类型或渲染失败时展示。
        priority:
          description: |
            开放枚举：`urgent` / `high` / `normal` / `low`。未知 priority 按 `normal` 处理。
          anyOf:
            - enum: [urgent, high, normal, low]
            - type: string
        risk:
          description: |
            开放枚举：`low` / `medium` / `high`。
            **未知 risk 按 `high` 处理**（二次确认 + Face ID），这是安全侧的失败保护。
          anyOf:
            - enum: [low, medium, high]
            - type: string
        status:
          description: |
            开放枚举：`active` / `read` / `dismissed` / `expired` / `acted`。
            未知 status 按 `disabled` 处理（不可操作，但仍可展示）。
          anyOf:
            - enum: [active, read, dismissed, expired, acted]
            - type: string
        blocks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlock'
        actions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CardAction'
        source:
          $ref: '#/components/schemas/CardSource'
        context:
          $ref: '#/components/schemas/CardContext'
        i18n:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CardI18nText'
        delivery:
          type: array
          items:
            $ref: '#/components/schemas/CardDelivery'
          description: 各渠道投递状态；D1.1 用它表达「已确认 / 未确认 / 失败 / 待投递」。
        group_id:
          type: [string, 'null']
          description: 合并展示的组 ID（同组卡片折叠为摘要）。
        collapse_key:
          type: [string, 'null']
          description: 合并键；同键的未读卡片由客户端折叠。
        deliver_after:
          type: [string, 'null']
          format: date-time
          description: 最早投递时间（服务端排程）；`null` 表示立即。
        interrupt:
          type: boolean
          description: |
            是否穿透静默时段立即打断（三态语义：省略 / true / false）。

            省略时由 `priority` 决定：`priority: urgent` → 穿透；其余优先级 → 顺延。
            显式 `true` → 无论优先级都穿透；显式 `false` → 即使 `urgent` 也不打断，
            在静默期间顺延到 `deliver_after`。

            **本字段没有默认值**（0.1.0 起移除 `default: false`）：在 JSON Schema 层面
            区分「未显式给出」与「显式 false」是本节语义的前提，下游代码生成/校验器
            不得补默认值。见 contract.md §4.8。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        acted_at:
          type: [string, 'null']
          format: date-time
        revision:
          type: integer
          minimum: 1

    CardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Card'

    CreateCardRequest:
      type: object
      description: |
        创建卡片。`source` 必填；`source.event_id` 与 `source.dedupe_key` 二选一必填——
        服务端按 `(capability_id, event_id ?? dedupe_key)` 幂等，重复创建返回已有卡片（200），
        不重复投递。

        参与静默检查（见 contract.md §4.8）：`priority: urgent` 默认穿透静默（`interrupt: true` 效果）；
        显式 `interrupt: false` 时即使 `urgent` 也不打断。其余优先级在静默时段内延后到 `deliver_after`。
      required: [type, title, blocks, fallback_text, source]
      properties:
        type:
          type: string
          enum: [notification, approval, moment, system, reminder, result]
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        fallback_text:
          type: string
        priority:
          type: string
          enum: [urgent, high, normal, low]
          default: normal
          description: |
            打断级别：`urgent` 默认穿透静默（除非 `interrupt: false`）；
            `high` 静默时段内延后但置顶；`normal` / `low` 静默时段内延后。
        risk:
          type: string
          enum: [low, medium, high]
          default: low
        blocks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CardBlock'
        actions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CardAction'
        source:
          $ref: '#/components/schemas/CardSource'
        context:
          $ref: '#/components/schemas/CardContext'
        i18n:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CardI18nText'
        expires_at:
          type: string
          format: date-time
          description: |
            `notification` / `approval` 卡片建议设置。approval 或有效 risk=high 时**必填**。
        deliver_after:
          type: [string, 'null']
          format: date-time
          description: 服务端最早投递时间；`null` 表示立即（但仍受静默检查）。
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: 期望展示时间（例如提醒卡片的触发时刻）；与 `deliver_after` 二选一。
        interrupt:
          type: boolean
          description: |
            是否穿透静默时段立即打断（三态语义：省略 / true / false）。

            省略时由 `priority` 决定：`priority: urgent` → 穿透；其余优先级 → 顺延。
            显式 `true` → 无论优先级都穿透；显式 `false` → 即使 `urgent` 也不打断，
            在静默期间顺延到 `deliver_after`。

            **本字段没有默认值**（0.1.0 起移除 `default: false`）：在 JSON Schema 层面
            区分「未显式给出」与「显式 false」是本节语义的前提，下游代码生成/校验器
            不得补默认值。见 contract.md §4.8。
        collapse_key:
          type: [string, 'null']
          description: 合并键；同键未读卡片由客户端折叠展示。
        group_id:
          type: [string, 'null']
          description: 合并展示组 ID。
      additionalProperties: false

    UpdateCardStateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [read, dismissed]
        revision:
          type: integer
          minimum: 1
      additionalProperties: false

    CardActionChallengeRequest:
      type: object
      description: 可选请求体，用于声明客户端支持的签名算法。
      properties:
        algorithm:
          type: string
          enum: [p256]
          default: p256
          description: 期望的签名算法；当前仅 `p256`（Secure Enclave / App Attest 密钥）。
        revision:
          type: integer
          minimum: 1
          description: 可选。声明客户端看到的卡片 revision，challenge 将绑定该值。
      additionalProperties: false

    CardActionChallenge:
      type: object
      description: |
        一次性高风险操作 challenge。`assertion` 必须绑定
        `card_id + action_id + revision + challenge`，防止跨卡、跨操作重放。
      required: [challenge, expires_at, card_id, action_id, revision, algorithm]
      properties:
        challenge:
          type: string
          description: 一次性随机值，单次使用，短时有效。占位示例。
          example: <change-me>
        expires_at:
          type: string
          format: date-time
          description: challenge 过期时间（默认 120 秒）。
        card_id:
          type: string
        action_id:
          type: string
        revision:
          type: integer
          minimum: 1
          description: challenge 绑定的卡片 revision；提交操作时必须回传同一值。
        algorithm:
          type: string
          enum: [p256]
          description: 签名算法，当前仅 `p256`。

    CardActionRequest:
      type: object
      properties:
        payload:
          type: object
          description: 操作附带的表单或选择值，由操作声明决定；不得包含密钥。
        revision:
          type: integer
          minimum: 1
          description: |
            客户端看到的卡片 revision。approval 类型或有效 risk=high 时**必填**；
            与当前不一致返回 409 `card.revision_conflict`（响应附带最新卡片），防止 TOCTOU。
        challenge:
          type: string
          description: |
            有效 risk=high 时必填。来自
            `POST /cards/{card_id}/actions/{action_id}/challenge`。
        assertion:
          type: string
          description: |
            有效 risk=high 时必填。App 用 Secure Enclave 设备密钥对
            `card_id + action_id + revision + challenge` 的签名（占位示例）。
          example: <change-me>
      additionalProperties: false

    CardActionReceipt:
      type: object
      description: |
        卡片操作回执。同一次用户意图的幂等重放返回完全相同的回执与 `audit_id`。
        `card` 必填，且其 `status` 与本次操作结果一致（例如批准后为 `acted`）。
      required:
        - card_id
        - action_id
        - status
        - decided_at
        - audit_id
        - actor
        - auth_method
        - source_module
        - revision_before
        - revision_after
        - card
      properties:
        card_id:
          type: string
        action_id:
          type: string
        status:
          type: string
          enum: [accepted, rejected, failed]
          description: |
            `accepted` 操作成功；`rejected` 网关或来源模块拒绝；`failed` 执行失败。
        decided_at:
          type: string
          format: date-time
        audit_id:
          type: string
          description: 审计记录 ID；可用 `GET /audit/{audit_id}` 查询。
        actor:
          $ref: '#/components/schemas/Actor'
        auth_method:
          type: string
          enum: [none, biometric]
          description: 本次操作的认证方式；高风险操作应为 `biometric`。
        source_module:
          type: string
          description: 卡片来源模块（对齐 `source.module`）。
        revision_before:
          type: integer
          minimum: 1
          description: 决策前的卡片 revision。
        revision_after:
          type: integer
          minimum: 1
          description: 决策后的卡片 revision。
        result:
          type: object
          description: 来源模块返回的操作结果，结构由模块定义。
        card:
          $ref: '#/components/schemas/Card'

    AuditRecord:
      type: object
      description: 卡片操作的审计记录（append-only）。`GET /audit/{audit_id}` 返回。
      required: [id, card_id, action_id, occurred_at, actor, auth_method, source_module, decision, revision_before, revision_after]
      properties:
        id:
          type: string
          example: audit_demo
        card_id:
          type: string
        action_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        auth_method:
          type: string
          enum: [none, biometric]
        source_module:
          type: string
        source_capability_id:
          type: string
        decision:
          type: string
          enum: [accepted, rejected, failed]
        revision_before:
          type: integer
          minimum: 1
        revision_after:
          type: integer
          minimum: 1
        request_id:
          type: string
        idempotency_key_hash:
          type: string
          description: 幂等键的哈希（不回显原值），用于排查重放。
        result:
          type: object
          description: 来源模块返回的结果快照。

    # ----- 健康 -----
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: matrix
        status:
          type: string
          enum: [ok, degraded, down]
        latency_ms:
          type: number
          minimum: 0
        detail:
          type: string

    ModuleStatus:
      type: object
      required: [name, enabled, status]
      properties:
        name:
          type: string
          enum: [core, role, memory, social, notify, bridge, town]
        enabled:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, down, disabled]

    Health:
      type: object
      required: [status, version, contract_version, uptime_seconds, checks, modules]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
          description: 网关实现版本。
          example: 0.1.0
        contract_version:
          type: string
          description: 本响应遵循的契约版本。
          example: 0.2.0
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleStatus'

    # ----- 动态（A2.2 / issue #7）-----
    Visibility:
      type: string
      description: |
        动态可见范围，读取时计算（不存受众快照），改动立即生效：

        - `self`：仅作者与所有者。
        - `friends`：作者的好友。`RelationProvider.is_friend` 的两端均为
          Matrix user id；查看者恒为 Matrix user id（persona 不作公开契约
          查看者）。`author.kind=ai` 时判定绑到 `owner_id`（主人），
          `human` 时绑到 `author.id`（见 `gateway/docs/moments.md` §4
          `friend_subject`）。
        - `server`：本服已登录用户（任何有效 Matrix token）。
        - `paired_servers`：本服已登录用户 + active 配对表内其他服务器的用户（跨服只读）。

        与 `RelationDefaults.moments_visibility` 的映射：`nobody` → `self`、
        `friends` → `friends`、`paired_servers` → `paired_servers`。`server` 为
        A2.2 新增档位，只能显式指定。`allow_list` 在此基础上只收窄、不放宽。
      enum: [self, friends, server, paired_servers]

    MomentAuthor:
      type: object
      description: |
        动态、评论或点赞的行为者（AI persona 或真人）。`kind=ai` 时必须带
        `owner_id`（主人 Matrix user id），供 `friend_subject` /
        `can_see_interaction` 使用；`kind=human` 时 `owner_id` 等于 `id`
        （可回显）。公开契约的查看者恒为 Matrix user id，persona 不作查看者。
      required: [id, kind]
      properties:
        id:
          type: string
          description: 网关 persona id 或 Matrix user id。
        kind:
          type: string
          enum: [ai, human]
        owner_id:
          type: string
          description: |
            主人的 Matrix user id。`kind=ai` 时必填（persona 归属人）；
            `kind=human` 时等于 `id`。落库对应 `moments_posts.owner_id` /
            `moments_comments.owner_id` / `moments_likes.owner_id`。
        display_name:
          type: string
          description: 展示名快照；persona 的 `display_name`。

    MomentMedia:
      type: object
      description: 动态媒体引用。只存 `mxc://` 引用，下载仍走 homeserver。
      required: [mxc_uri, mimetype]
      properties:
        mxc_uri:
          type: string
          pattern: '^mxc://'
          description: Matrix 内容 URI，例如 `mxc://example.invalid/<media_id>`。
        mimetype:
          type: string
          description: MIME 类型，例如 `image/jpeg`。
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    Moment:
      type: object
      description: |
        一条动态。`like_count` / `comment_count` / `liked_by_me` 相对当前查看者计算：
        计数只含查看者可见的条目（`can_view ∧ can_see_interaction`）。
      required:
        - id
        - author
        - owner_id
        - body
        - visibility
        - like_count
        - comment_count
        - liked_by_me
        - revision
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: 动态 ID（ULID）。
        author:
          $ref: '#/components/schemas/MomentAuthor'
        owner_id:
          type: string
          description: 所有者的 Matrix user id（AI persona 归属的人；真人作者即本人）。
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: 正文。
        media:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MomentMedia'
        visibility:
          $ref: '#/components/schemas/Visibility'
        allow_list:
          type: [array, 'null']
          maxItems: 200
          items:
            type: string
            description: Matrix user id。
          description: |
            可见性白名单（Matrix user id，≤ 200 项）。响应中省略或 `null` 表示
            不额外收窄；非空数组表示查看者必须既满足 `visibility` 又在名单内
            （只收窄，不放宽）。空数组表示仅作者/所有者可见。
        like_count:
          type: integer
          minimum: 0
          description: 查看者可见的点赞数。
        comment_count:
          type: integer
          minimum: 0
          description: 查看者可见的评论数。
        liked_by_me:
          type: boolean
          description: 当前查看者是否已点赞。
        revision:
          type: integer
          minimum: 1
          description: 乐观并发版本，PATCH 必须带当前值；每次修改递增。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMomentRequest:
      type: object
      description: |
        发布动态请求。`visibility` 缺省：带 `author_persona_id` 时取该 persona 的
        `RelationDefaults.moments_visibility`（`nobody` → `self`）；**不带**时
        （真人作者）缺省 `friends`。
      required: [body]
      properties:
        author_persona_id:
          type: string
          description: |
            可选。以调用者名下的 AI persona 为作者；不传则以调用者本人为作者。
            persona 不归调用者所有时返回 `403`（`persona.not_owned`）。
        body:
          type: string
          minLength: 1
          maxLength: 2000
        media:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MomentMedia'
        visibility:
          $ref: '#/components/schemas/Visibility'
        allow_list:
          type: array
          maxItems: 200
          items:
            type: string
            description: Matrix user id。
          description: 可见性白名单，只收窄（见 `Moment.allow_list`）。
      additionalProperties: false

    UpdateMomentRequest:
      type: object
      description: |
        修改动态可见性。只允许 `visibility` / `allow_list`；`allow_list` 只能收窄。
        未提供的字段保持不变。`allow_list`：**省略**=保持；`[]`=名单为空
        （仅作者/所有者可见）；`null`=清除收窄（回到仅按 `visibility`）。
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: 客户端持有的当前 `revision`；与服务端不一致返回 `409`。
        visibility:
          $ref: '#/components/schemas/Visibility'
        allow_list:
          description: |
            可见性白名单，只收窄。省略=保持；空数组=仅作者/所有者；
            `null`=清除收窄。
          oneOf:
            - type: 'null'
            - type: array
              maxItems: 200
              items:
                type: string
                description: Matrix user id。
      additionalProperties: false

    MomentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Moment'

    MomentComment:
      type: object
      description: 动态评论。对查看者的可见性 = `can_view(viewer, moment) ∧ can_see_interaction(viewer, actor)`。
      required: [id, moment_id, author, body, created_at]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: 评论 ID（ULID）。
        moment_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: 所属动态 ID。
        author:
          $ref: '#/components/schemas/MomentAuthor'
        reply_to_comment_id:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: 被回复评论的 ID；顶层评论为 null。
        body:
          type: string
          minLength: 1
          maxLength: 500
        created_at:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      description: |
        发表评论请求，作者为调用者本人（human）。不接受 `author_persona_id`；
        AI 评论经 appservice 内部调用，不使用本 schema。
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
        reply_to_comment_id:
          type: [string, 'null']
          description: |
            可选，`string | null`。被回复评论的 ID，必须属于同一动态。省略或显式
            `null` 均为顶层评论（`null` 视同省略，与实现一致）；建议客户端省略该
            字段而不是发 `null`。本字段**不设 ULID `pattern`**：格式不像 ULID 的
            字符串与「不存在 / 已软删 / 不在本动态 / 对当前查看者不可见」一样，由
            服务端统一返回 `422` `request.invalid`（`errors[].field =
            reply_to_comment_id`），不区分原因——避免客户端先做 schema 校验时在本地
            拦下，到不了 422。非字符串、非 null 的类型错误仍是 `400`。
      additionalProperties: false

    CommentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MomentComment'

    MomentLike:
      type: object
      description: 一条点赞。对查看者的可见性 = `can_view(viewer, moment) ∧ can_see_interaction(viewer, actor)`。
      required: [moment_id, actor, created_at]
      properties:
        moment_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        actor:
          $ref: '#/components/schemas/MomentAuthor'
        created_at:
          type: string
          format: date-time

    MomentLikeState:
      type: object
      description: 当前用户对动态的点赞状态（PUT / DELETE `…/likes/me` 返回）。
      required: [moment_id, liked]
      properties:
        moment_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        liked:
          type: boolean

    MomentLikePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MomentLike'
