      operationId: deleteMomentComment
      summary: 删除动态评论
      description: |
        删除评论（软删）。可删者为**评论作者本人**或**动态作者/所有者**。
        以 `can_view(viewer, moment)` 为前提：动态不可见或不存在、评论不存在或对查看者
        不可见（`can_view ∧ can_see_interaction` 为假）、无权删除，统一返回
        `404` `moment.not_found`，响应体**逐字节相同**，不泄露存在性。
        删除后评论不再出现在列表与 `comment_count` 中。
      security:
        - matrixOpenIdToken: []
        - matrixUserToken: []
      responses:
        '204':
          description: 已删除。无响应体。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /moments/{moment_id}/likes/me:
    parameters:
