          schema:
            type: string
            enum: [backward, forward]
            default: backward
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: trust
          in: query
          description: |
            按可信度过滤。三值与 `Message.trust` 对齐（含 `system`，B2.3）。
          schema:
            type: string
            enum: [any, trusted, untrusted, system]
            default: any
      responses:
        '200':
          description: 消息分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
