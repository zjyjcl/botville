        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Messages]
      operationId: sendMessage
      summary: 请求以 AI 身份发言
      description: |
        AI 运行时提交一条待发送消息，由网关做完整裁决（三层限额、静默时段、防刷屏、互聊熔断、
        关系策略），通过后经 appservice 以角色身份投递到 Matrix。

        **策略结论不是 HTTP 错误**：请求合法且会话允许 AI 参与时始终返回 200 与 `MessageReceipt`，
        `outcome` 为 `delivered` / `queued` / `deferred` / `blocked`，原因见 `decision.reasons`。
        401/403 只表示调用方身份、所有权、scope 或会话硬约束问题。

        **加密会话硬约束**：目标会话 `encryption=e2ee` 或 `ai_participation=disabled` 时返回
        `403` `conversation.e2ee`（不可重试）。这不是 §1.4 的 `200 blocked`，不消耗限额、不入队。

        重试必须复用同一 `Idempotency-Key`；同一 key 不同请求体返回 409。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingMessageRequest'
      responses:
        '200':
          description: 发言裁决结果（可能已投递、排队、延后或拦截）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            身份有效但无权限。含 `persona.not_owned`、`relation.chat_denied`，以及加密/
            AI 禁用会话硬约束 `conversation.e2ee`（不可重试，非策略 blocked）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conversation_e2ee:
                  summary: 加密或 AI 禁用会话拒绝代发言
                  value:
                    type: urn:botville:error:conversation.e2ee
                    title: AI participation disabled for this conversation
                    status: 403
                    detail: encryption=e2ee or ai_participation=disabled; gateway must not speak as AI here
                    instance: /v1/conversations/conv_demo/messages
                    code: conversation.e2ee
                    request_id: req_demo_e2ee_send
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /context/assemble:
    post:
      tags: [Context]
      operationId: assembleContext
      summary: 组装隔离后的模型上下文（可选使用）
      description: |
        由 **AI 运行时**调用：运行时把待放入上下文的条目交给网关，网关按 contract.md §7.1
        判定每条的 `trust`，返回**固定顺序的四分区**上下文与每段数据区的 nonce。
        **网关不调用模型**——隔离的执行主体是运行时；本接口把「判定 + 拼装」做成一次
        可测试的调用，是运行时的可选便利路径，不改变职责边界。

        **上下文分区（固定顺序）**：`system` → `persona` → `conversation` → `untrusted_data`。
        `untrusted` 内容只出现在 `untrusted_data`，每段独立 nonce 包裹，
        nonce 由 CSPRNG 生成、≥128 bit、不跨请求/轮次复用。

        **判定口径**：`items[].kind` 为 `moments_comment` / `moments_post` / `persona_field`
        时按 §7.1 规则 4/5 记 `untrusted`；`external` 按规则 2 记 `untrusted`；
        `other` 按规则 8 fail-closed；`message` 按 `source_id` 查**本地消息存储**取原始 trust
        与转发链（规则 6/7 及 `forwarded_from` 逐跳取低），查不到或已过期按规则 8
        fail-closed 记 `untrusted`。

        **调用方声明只能降级**：任何调用方提供的 `trust` / `external` / 来源声明**只能使结果
        降为 `untrusted`（或更低），不得提升**；`system` **只能由网关内部**按规则 1 赋予。
        本请求**不接受**调用方声明：`trust` / `external` / `provenance` 等字段不属于本请求，
        出现即按未知属性返回 `400 request.invalid`。

        **`system` / `persona` 区不可由调用方注入**：
        - `system` 区**只**含网关的固定声明，不含任何调用方或外部原文；
        - `persona` 区**只**由网关从 persona 存储按 owner 鉴权读取，请求只传 `persona_id`；
          非 owner 或读不到 → persona 区为空，不得用请求体内容顶替；
        - **`owner_id` 由调用方 token 推出（#124，contract.md §1.2.2）**：配置了
          `GATEWAY_CALLER_TOKENS` 时，HTTP 层用请求 token 换出 `owner_id` 再注入组装；
          **推不出（无 caller token / 使用站点级 token）时 persona 区为空——这是正常结果，
          不是错误**。请求体**不接受** `owner_id`（`additionalProperties: false`）；
        - 因此 **`system_text` / `persona_text` 已被禁用**：请求里出现这两个字段一律按未知属性
          返回 `400 request.invalid`（`additionalProperties: false`）。

        **`source_id` 与正文绑定**：条目带 `source_id` 时，网关**以本地存储正文为准**；
        请求 `text` 与存储正文不一致 → `422 request.invalid`
        （`errors[].field=items[].text`），该条不进入任何分区。无 `source_id` 的内联条目
        按 kind 判定（通常为 `untrusted`），`text` 进 `untrusted_data`。

        **200 的两种结论**（均不新增 HTTP 状态码）：
        - `outcome=allowed`：返回 `zones` 与 `nonces`，运行时可据此拼装并调用模型；
        - `outcome=blocked`：`reason.code=trust.isolation_failed`，`zones` / `nonces`
          为 `null`；`retryable=false`、`retry_after_seconds=null`、
          `same_content_allowed=false`、`may_clear_at=null`、`queue_id=null`；
          记一条 `usage_events kind=blocked`（`decision_code=trust.isolation_failed`），
          **不计** token / 消息配额、不产生 `message_sent`、不调用模型、不投递。

        本接口不扣限额、不做幂等缓存（结果只取决于请求内容与当前存储）。
        结构或类型错误（缺 `persona_id` / `items`、未知属性、类型不符）→ `400 request.invalid`；
        语义不合法（`items[].kind` 未知、`conversation_id` 不属于该 persona、
        `items` 超过单次上限）→ `422 request.invalid`（`errors[].field` 指出字段）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextAssembleRequest'
      responses:
        '200':
          description: |
            组装结论：`allowed` 返回四分区上下文与 nonce；`blocked` 返回
            `reason.code=trust.isolation_failed`。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextAssembleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /policy/evaluate:
    post:
      tags: [Policy]
      operationId: evaluatePolicy
      summary: 发言前预检
      description: |
        在不投递的情况下评估一次发言是否会被允许，供 AI 在花 token 之前决定「要不要说」。
        返回完整的 `PolicyDecision`（命中层级、剩余额度、重置时间、原因）。
        预检结果不占用额度，也不保证稍后发送一定成功（额度可能被并发消耗）。

        目标会话 `encryption=e2ee` 或 `ai_participation=disabled` 时返回 `403` `conversation.e2ee`
        （与 sendMessage 同一硬约束；不返回 200 blocked）。

        本接口**不识别隔离信号**：`trust.isolation_failed` 只能由 `POST /context/assemble`
        产生（`outcome=blocked`）。AI 运行时若不经该接口、自行拼装上下文而隔离失败，应**本地
        放弃本轮、不调用模型**，不通过本接口上报该码；本接口不带也不识别 `isolation_failed`
        字段。
      parameters:
