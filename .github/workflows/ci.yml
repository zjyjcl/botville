# Botville CI (A0.2).
#
# smoke: boot the Compose stack per homeserver profile and run the
#         standard-library smoke test against 127.0.0.1:8008.
#         All three profiles are required-green; images are pinned
#         (tag@sha256 digest), so failures are real failures.
# backup-restore (A1.1, synapse only): init -> open registration -> up
#         with GATEWAY=1 (synapse + gateway profiles, appservice transport) ->
#         e2e seed -> marker in gateway-data via the running gateway ->
#         gateway-hs-smoke (startup whoami + OpenID userinfo + AS
#         transactions: HS->gateway ping, pushed room message stored in
#         as_transactions.db, gateway restart + txnId replay stored once) ->
#         backup (gateway-data.tar.gz must hold as_transactions.db) -> down -v
#         (wipe) -> up (fresh stack) -> restore -> e2e verify + gateway-data
#         marker/migrations/stored AS transactions/health + smoke again.
# gateway-compose (A2.2, tuwunel + continuwuity): gateway image builds and
#         ships the moments migrations (non-root), `config --volumes` lists
#         gateway-data, up with GATEWAY=1 -> /health + migrations applied ->
#         tuwunel: appservice, registration url http://gateway:8080 +
#         gateway-hs-smoke (incl. AS transactions); continuwuity: memory
#         transport and registration url null (no file-based appservice) ->
#         make backup-gateway ->
#         down -v (wipe) -> up -> make restore-gateway -> marker + /health
#         verify (tuwunel also re-runs gateway-hs-smoke --skip-as-txn: the wiped
#         HS restarts its txnIds, which would collide with the restored db).
# gateway-data deletion, as these jobs do it (and the docs say): the volume
#         is deleted by `docker compose ... --profile gateway down -v`, i.e.
#         only while the gateway service (which mounts it) is in the active
#         profiles -- both jobs keep --profile gateway on every compose call.
#         Without that profile compose does not consider the volume in use and
#         down -v leaves it; then `docker volume rm -f <project>_gateway-data`
#         is the way. `make down` never passes -v and deletes no volume. Wipe
#         steps assert the volume is gone (fail otherwise); Teardown runs
#         down -v, then fails (after an explicit `docker volume rm`) if any
#         project volume is left -- runner disposal is not relied upon.
# push-e2e (A1.2, all three homeservers): up with the push profile (sygnal +
#         org.botville.mock pushkin), then server/tests/push_e2e.py asserts
#         HS -> sygnal push latency < 5s, an event_id_only payload with no
#         content keys, and the unknown-app_id rejection semantics. The
#         continuwuity leg exercises the same init.sh-rendered denylist; its
#         make up runs the first-boot bootstrap automatically. Real APNs
#         delivery is out of scope (no Apple account); see
#         docs/deploy/push-sygnal.md.
# appservice-e2e (A1.3, synapse + tuwunel): init (renders the appservice
#         registration from .env) -> open registration -> up -> run
#         server/tests/appservice_e2e.py: the real gateway transport
#         registers an @ai_* user, joins an invited room and sends as that
#         identity; exclusive-namespace rejections asserted both ways.
#         continuwuity has no file-based appservice registration yet and is
#         not covered (see docs/deploy/appservice.md).
# app-apple-tests: Swift unit/integration tests on a macOS runner, including
#         Pairing, Push* and ReleaseIsolation. Real-device APNs/NSE delivery
#         still requires manual acceptance; see app-apple/docs/push-device.md.
# federation-e2e (A2.1): the standalone botville-fed compose project boots
#         two Synapse instances (hs-a/hs-b), each behind its own fedgate
#         gate + pairing service (server/pairing, python:3.12-slim with the
#         stdlib-only source bind-mounted). federation_e2e.py proves:
#         unpaired federation denied, pairing enables invite/join/messages
#         both ways, and each side severing cuts traffic in both directions.
#         Certs/configs/tokens are generated at run time (gitignored).
# lint:   compose config for all three profiles (each also with push and
#         with gateway; + the federation stack),
#         shellcheck, python syntax, server/ and pairing package tests
#         (stdlib mocks; compose probes use Docker when available),
#         notify/gateway contract validation, a guard that the App pairing-qr
#         fixtures stay a byte-identical copy of
#         docs/contracts/examples/pairing-qr (#128/#132), a guard that
#         .env.example only ever contains placeholders, a guard that no .p8
#         file or PEM private-key header is ever tracked (issue #4), and a
#         guard that every image defaults to tag@sha256 digest (no :latest)
#         identically in compose and .env.example (and that gateway/Dockerfile's
#         FROM is pinned the same way).
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        homeserver: [synapse, tuwunel, continuwuity]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # CI-only: open Synapse registration so the UIA m.login.dummy flow
          # works without email verification. This runs on an ephemeral,
          # loopback-only runner; local defaults stay closed.
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver
        run: make up HS=${{ matrix.homeserver }}

      - name: Smoke test
        run: |
          # Last assignment wins, matching docker compose's --env-file handling.
          token="$(sed -n 's/^BOTVILLE_REGISTRATION_TOKEN=//p' server/compose/.env | tail -n 1)"
          python3 server/tests/smoke.py \
            --base-url http://127.0.0.1:8008 \
            --registration-token "$token"

      - name: Graceful stop right after traffic (issue #91 / #109)
        run: |
          # Stop immediately after smoke: the window in which continuwuity's
          # announcements check used to block shutdown until SIGKILL.
          # Timing alone can false-green on a fast network (#109): the GET to
          # continuwuity.org often finishes in <1s, so the interruptible wait
          # path is already active by the time we stop. Lock the fix itself
          # with a network-free env assertion on the continuwuity profile.
          cid="$(docker compose -f server/compose/docker-compose.yml --env-file server/compose/.env --profile "${{ matrix.homeserver }}" ps -q "${{ matrix.homeserver }}")"
          if [[ "${{ matrix.homeserver }}" == "continuwuity" ]]; then
            env_dump="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid")"
            grep -Fqx 'CONTINUWUITY_ALLOW_ANNOUNCEMENTS_CHECK=false' <<<"$env_dump"
            echo "continuwuity env asserts CONTINUWUITY_ALLOW_ANNOUNCEMENTS_CHECK=false"
          fi
          start=$(date +%s)
          docker stop -t 60 "$cid"
          took=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          echo "stop took ${took}s, exit code ${code}"
          test "$took" -lt 30 && test "$code" != 137

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            down -v --remove-orphans

  backup-restore:
    name: backup-restore (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every compose call in this job targets the same project/profiles;
      # --profile gateway is always on so gateway-data counts as in use and
      # `down -v` deletes it (see the header).
      STACK: docker compose -f server/compose/docker-compose.yml --env-file server/compose/.env --profile synapse --profile gateway
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and open registration
        run: |
          bash server/scripts/init.sh
          # CI-only: open registration so e2e seed can register users
          # (same escape hatch as the smoke job).
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env
          project="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' server/compose/.env | tail -n 1)"
          echo "GATEWAY_VOLUME=${project:-botville}_gateway-data" >> "$GITHUB_ENV"
          echo "PROJECT=${project:-botville}" >> "$GITHUB_ENV"

      - name: Start stack (synapse + gateway profile)
        run: |
          set -euo pipefail
          make up HS=synapse GATEWAY=1
          # GATEWAY=1 on synapse: the HS pushes AS transactions to the gateway.
          grep -qx 'url: http://gateway:8080' server/compose/generated/appservice/botville-gateway.yaml

      - name: Seed e2e data (alice/bob/carol, DM, group)
        run: make e2e E2E_PHASE=seed

      - name: Seed gateway-data volume (real gateway service)
        run: |
          set -euo pipefail
          # The gateway created moments.db and applied the moments migrations
          # shipped in the image at startup; add a marker file next to it.
          ${STACK} exec -T gateway python -c "import sqlite3; c = sqlite3.connect('/var/lib/botville-gateway/moments.db'); assert c.execute('select count(*) from moments_schema_migrations').fetchone()[0] >= 1"
          ${STACK} exec -T gateway sh -c 'printf "botville-gateway-data-seed\n" > /var/lib/botville-gateway/ci-seed.txt'
          docker volume inspect "${GATEWAY_VOLUME}" >/dev/null

      - name: Gateway homeserver smoke (whoami + OpenID userinfo)
        run: make gateway-hs-smoke

      - name: Backup
        run: |
          set -euo pipefail
          bash server/scripts/backup-synapse.sh
          # The script records its target dir in backups/.last-backup; reading
          # it from there (instead of piping to tail) cannot swallow a failure.
          backup_dir="$(cat backups/.last-backup)"
          echo "backup dir: ${backup_dir}"
          test -f "${backup_dir}/gateway-data.tar.gz"
          grep -q 'gateway-data.tar.gz' "${backup_dir}/manifest.txt"
          # List the archive into a file first, then grep the file. Never
          # `tar -t | grep -q` under pipefail: grep -q exits on the first
          # match, tar's next write hits a closed pipe, and because Actions
          # steps inherit SIGPIPE=ignored tar fails with "stdout: write error"
          # (exit 2) -- a timing race that depends on the entry order.
          listing="$(mktemp)"
          trap 'rm -f "${listing}"' EXIT
          tar -tzf "${backup_dir}/gateway-data.tar.gz" > "${listing}"
          grep -qx './ci-seed.txt' "${listing}"
          # AS transactions (#192) live on the same volume, top level.
          grep -qx './as_transactions.db' "${listing}"
          echo "RESTORE_DIR=${backup_dir}" >> "$GITHUB_ENV"

      - name: Wipe volumes (simulated disaster)
        run: |
          set -euo pipefail
          # The gateway service mounts gateway-data and --profile gateway is
          # active, so down -v deletes it together with the other volumes.
          ${STACK} down -v --remove-orphans
          # Assert instead of papering over: a leftover volume would make the
          # later verify a false pass.
          if docker volume inspect "${GATEWAY_VOLUME}" >/dev/null 2>&1; then
            echo "::error::down -v left ${GATEWAY_VOLUME} behind"
            exit 1
          fi
          leftover="$(docker volume ls -q --filter "label=com.docker.compose.project=${PROJECT}")"
          if [ -n "${leftover}" ]; then
            echo "::error::down -v left volumes behind: ${leftover}"
            exit 1
          fi

      - name: Restart empty stack
        run: make up HS=synapse GATEWAY=1

      - name: Restore backup
        run: make restore RESTORE_DIR="$RESTORE_DIR"

      - name: Verify e2e data survived
        run: make e2e E2E_PHASE=verify

      - name: Verify gateway-data survived (gateway healthy on it)
        run: |
          set -euo pipefail
          # Wait for /health first: after the restore the gateway may still be
          # restarting (startup whoami against the restored synapse), and
          # `exec` into a restarting container fails.
          port="$(sed -n 's/^BOTVILLE_GATEWAY_PORT=//p' server/compose/.env | tail -n 1)"
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:${port:-8020}/health" && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${port:-8020}/health" >/dev/null \
            || { echo "::error::gateway /health not OK after restore"; exit 1; }
          ${STACK} exec -T gateway grep -qx botville-gateway-data-seed /var/lib/botville-gateway/ci-seed.txt
          ${STACK} exec -T gateway python -c "import sqlite3; c = sqlite3.connect('/var/lib/botville-gateway/moments.db'); assert c.execute('select count(*) from moments_schema_migrations').fetchone()[0] >= 1"
          # The transaction stored by the pre-backup smoke survived the restore.
          ${STACK} exec -T gateway python -c "import sqlite3; c = sqlite3.connect('/var/lib/botville-gateway/as_transactions.db'); assert c.execute('select count(*) from as_transactions').fetchone()[0] >= 1"

      - name: Gateway homeserver smoke after restore (whoami + OpenID userinfo)
        run: make gateway-hs-smoke

      - name: Dump logs
        if: failure()
        run: ${STACK} logs --no-color

      - name: Teardown
        if: always()
        run: |
          set -euo pipefail
          ${STACK} down -v --remove-orphans
          # Do not rely on the runner being thrown away: prove down -v removed
          # every project volume (gateway-data included). Anything left is
          # removed explicitly and fails the job, since it means the deletion
          # semantics documented above are wrong.
          leftover="$(docker volume ls -q --filter "label=com.docker.compose.project=${PROJECT}")"
          if [ -n "${leftover}" ]; then
            echo "::error::down -v left volumes behind: ${leftover}"
            # shellcheck disable=SC2086
            docker volume rm ${leftover}
            exit 1
          fi

  gateway-compose:
    # A2.2 / #7: gateway image + compose service + gateway-data backup on the
    # homeserver profiles that have no homeserver backup script (synapse is
    # covered by backup-restore above, which runs with GATEWAY=1).
    name: gateway-compose (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        homeserver: [tuwunel, continuwuity]
    env:
      STACK: docker compose -f server/compose/docker-compose.yml --env-file server/compose/.env --profile ${{ matrix.homeserver }} --profile gateway
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          project="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' server/compose/.env | tail -n 1)"
          echo "GATEWAY_VOLUME=${project:-botville}_gateway-data" >> "$GITHUB_ENV"
          echo "PROJECT=${project:-botville}" >> "$GITHUB_ENV"
          port="$(sed -n 's/^BOTVILLE_GATEWAY_PORT=//p' server/compose/.env | tail -n 1)"
          echo "GATEWAY_PORT=${port:-8020}" >> "$GITHUB_ENV"

      - name: Gateway image builds and ships the moments migrations
        run: |
          set -euo pipefail
          ${STACK} build gateway
          ${STACK} run --rm --no-deps --entrypoint sh gateway -c '
            set -e
            test "$(id -u)" = 10001
            test -f /app/gateway/migrations/moments/0001_moments.sql
            test -d /var/lib/botville-gateway
            python -c "from botville_gateway.moments.migrations import DEFAULT_MIGRATIONS_DIR as d; assert str(d) == \"/app/gateway/migrations/moments\", d"
            ! ls /app/gateway/tests >/dev/null 2>&1'

      - name: compose config --volumes lists gateway-data with the gateway profile
        run: |
          set -euo pipefail
          # Capture first, then grep (no `| grep -q` under pipefail).
          volumes="$(${STACK} config --volumes)"
          grep -qx gateway-data <<<"${volumes}"

      - name: Start homeserver + gateway
        run: make up HS=${{ matrix.homeserver }} GATEWAY=1

      - name: Gateway healthy, moments migrations applied on the volume
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${GATEWAY_PORT}/health"; then ok=1; break; fi
            sleep 2
          done
          [ "${ok}" = 1 ] || { echo "::error::gateway /health not OK"; exit 1; }
          ${STACK} exec -T gateway python -c "import sqlite3; c = sqlite3.connect('/var/lib/botville-gateway/moments.db'); assert c.execute('select count(*) from moments_schema_migrations').fetchone()[0] >= 1"
          ${STACK} exec -T gateway sh -c 'printf "botville-gateway-data-seed\n" > /var/lib/botville-gateway/ci-seed.txt'

      - name: Gateway transport and homeserver smoke
        run: |
          set -euo pipefail
          # printenv of this one key only — never dump the whole environment
          # (it contains tokens).
          transport="$(${STACK} exec -T gateway printenv GATEWAY_MATRIX_TRANSPORT)"
          echo "GATEWAY_MATRIX_TRANSPORT=${transport}"
          # grep -x on the url line only (the file also carries the tokens;
          # -q prints nothing).
          reg=server/compose/generated/appservice/botville-gateway.yaml
          if [ "${{ matrix.homeserver }}" = continuwuity ]; then
            test "${transport}" = memory
            grep -qx 'url: null' "${reg}"
            echo "registration url: null"
          else
            test "${transport}" = appservice
            grep -qx 'url: http://gateway:8080' "${reg}"
            echo "registration url: http://gateway:8080"
            make gateway-hs-smoke
          fi

      - name: Backup gateway-data (make backup-gateway)
        run: |
          set -euo pipefail
          make backup-gateway
          backup_dir="$(cat backups/.last-backup)"
          test -f "${backup_dir}/gateway-data.tar.gz"
          grep -q 'gateway-data.tar.gz' "${backup_dir}/manifest.txt"
          # List to a file, then grep it (no `tar -t | grep -q` under
          # pipefail: SIGPIPE race, see the backup-restore job).
          listing="$(mktemp)"
          trap 'rm -f "${listing}"' EXIT
          tar -tzf "${backup_dir}/gateway-data.tar.gz" > "${listing}"
          grep -qx './ci-seed.txt' "${listing}"
          # The gateway opens as_transactions.db at startup on every profile.
          grep -qx './as_transactions.db' "${listing}"
          test ! -e "${backup_dir}/env"
          echo "RESTORE_DIR=${backup_dir}" >> "$GITHUB_ENV"

      - name: Wipe volumes (simulated disaster)
        run: |
          set -euo pipefail
          ${STACK} down -v --remove-orphans
          if docker volume inspect "${GATEWAY_VOLUME}" >/dev/null 2>&1; then
            echo "::error::down -v left ${GATEWAY_VOLUME} behind"
            exit 1
          fi
          leftover="$(docker volume ls -q --filter "label=com.docker.compose.project=${PROJECT}")"
          if [ -n "${leftover}" ]; then
            echo "::error::down -v left volumes behind: ${leftover}"
            exit 1
          fi

      - name: Restart empty stack, restore gateway-data
        run: |
          set -euo pipefail
          make up HS=${{ matrix.homeserver }} GATEWAY=1
          make restore-gateway RESTORE_DIR="${RESTORE_DIR}"

      - name: Verify gateway-data survived (gateway healthy on it)
        run: |
          set -euo pipefail
          # Wait for /health before any exec: right after restore-gateway the
          # container may still be (re)starting, and exec into a restarting
          # container fails.
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:${GATEWAY_PORT}/health" && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${GATEWAY_PORT}/health" >/dev/null \
            || { echo "::error::gateway /health not OK after restore"; exit 1; }
          ${STACK} exec -T gateway grep -qx botville-gateway-data-seed /var/lib/botville-gateway/ci-seed.txt
          if [ "${{ matrix.homeserver }}" != continuwuity ]; then
            ${STACK} exec -T gateway python -c "import sqlite3; c = sqlite3.connect('/var/lib/botville-gateway/as_transactions.db'); assert c.execute('select count(*) from as_transactions').fetchone()[0] >= 1"
            # The homeserver was wiped (down -v) but gateway-data restored, so the
            # fresh HS restarts its txnIds and would collide with the restored
            # ones (stored once by design). AS transactions were already
            # covered before the backup; here check whoami + OpenID only.
            make gateway-hs-smoke GATEWAY_HS_SMOKE_ARGS=--skip-as-txn
          fi

      - name: Dump logs
        if: failure()
        run: ${STACK} logs --no-color

      - name: Teardown
        if: always()
        run: |
          set -euo pipefail
          ${STACK} down -v --remove-orphans
          leftover="$(docker volume ls -q --filter "label=com.docker.compose.project=${PROJECT}")"
          if [ -n "${leftover}" ]; then
            echo "::error::down -v left volumes behind: ${leftover}"
            # shellcheck disable=SC2086
            docker volume rm ${leftover}
            exit 1
          fi

  push-e2e:
    name: push-e2e (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        homeserver: [synapse, tuwunel, continuwuity]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # Same CI-only registration escape hatch as the smoke job.
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver + push gateway
        run: make up HS=${{ matrix.homeserver }} PUSH=1

      - name: Push e2e (HS -> sygnal latency < 5s, mock pushkin)
        run: make push-e2e

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            --profile push logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            --profile push down -v --remove-orphans

  appservice-e2e:
    name: appservice-e2e (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # continuwuity has no file-based appservice registration yet
        # (admin room only) — not in this matrix; see docs/deploy/appservice.md.
        homeserver: [synapse, tuwunel]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # CI-only: open Synapse registration so the UIA m.login.dummy flow
          # works for the human account (tuwunel stays token-gated and reads
          # BOTVILLE_REGISTRATION_TOKEN from .env).
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver
        run: make up HS=${{ matrix.homeserver }}

      - name: Appservice e2e (gateway sends as an @ai_* user)
        run: make appservice-e2e

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            down -v --remove-orphans

  federation-e2e:
    name: federation-e2e (synapse x2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Paired-federation e2e (pair, chat, sever both ways)
        run: make federation-e2e

      - name: Dump logs
        if: failure()
        run: |
          if [ -f server/compose/federation/generated/federation.env ]; then
            docker compose -p botville-fed \
              -f server/compose/federation/docker-compose.federation.yml \
              --env-file server/compose/federation/generated/federation.env \
              logs --no-color
          else
            echo "federation.env missing (setup never ran); no logs yet"
          fi

      - name: Teardown
        if: always()
        run: make federation-down

  app-apple-tests:
    name: app-apple-tests
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app-apple
    steps:
      - uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      # Run the full suite so new tests are included automatically. Synapse
      # integration tests skip unless BOTVILLE_E2E_* is explicitly configured.
      # No signing, simulator or real APNs/NSE delivery is exercised here.
      - name: Release isolation checks
        run: bash scripts/check-release-isolation.sh

      - name: Swift unit and integration tests
        run: swift test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck scripts
        run: |
          shellcheck -x server/scripts/init.sh server/scripts/bootstrap-continuwuity.sh \
            server/scripts/lib.sh server/scripts/backup-synapse.sh server/scripts/restore-synapse.sh \
            server/scripts/backup-gateway-data.sh server/scripts/restore-gateway-data.sh \
            server/scripts/federation-certs.sh server/scripts/check_no_secrets.sh \
            server/scripts/gateway-preflight.sh \
            scripts/sync-pairing-qr-fixtures.sh scripts/test-sync-pairing-qr-fixtures.sh

      # The docs examples dir is the single source of truth for the App-side
      # pairing-qr test fixtures; the copy must never drift (#128/#132).
      # README.md is docs-only (relative links break on the App side): it is
      # not synced and must not exist in the App-side copy.
      - name: Pairing QR fixtures in sync (docs == app-apple copy)
        run: bash scripts/sync-pairing-qr-fixtures.sh --check

      - name: Pairing QR fixtures sync self-test
        run: bash scripts/test-sync-pairing-qr-fixtures.sh

      - name: Python syntax
        run: |
          python3 -m py_compile server/tests/smoke.py server/tests/e2e_synapse.py \
            server/tests/push_e2e.py server/tests/appservice_e2e.py server/tests/federation_e2e.py \
            server/scripts/render_push_denylist.py server/scripts/federation-setup.py \
            server/pairing/__init__.py server/pairing/store.py server/pairing/service.py \
            server/pairing/fedgate.py server/pairing/validate.py

      - name: Server tests (stdlib mock; compose probes use Docker when available)
        run: python3 -m unittest discover -s server/tests -p "test_*.py" -v

      # Issue #4: no APNs keys (.p8) or PEM private-key headers may ever be
      # tracked; .gitignore must keep ignoring *.p8 and secrets/.
      - name: No tracked private keys (.p8 / PEM headers, issue #4)
        run: bash server/scripts/check_no_secrets.sh

      - name: Pairing package unit tests (stdlib mock, no Docker)
        run: python3 -m unittest discover -s server/pairing/tests -v

      # Issue #75: notify/gateway validators and gateway unit tests need
      # PyYAML. Install it explicitly (pinned) instead of relying on the
      # runner image; the next two steps share this install.
      - name: Install PyYAML for contract validation
        run: python3 -m pip install 'pyyaml>=6,<7'

      - name: Notify examples + gateway contract validation
        run: |
          python3 notify/scripts/validate_examples.py
          python3 gateway/scripts/validate_openapi.py

      - name: Gateway unit tests
        run: python3 -m unittest discover -s gateway/tests -v

      - name: Compose config validates for every profile
        run: |
          bash server/scripts/init.sh
          for hs in synapse tuwunel continuwuity; do
            if [ "${hs}" = continuwuity ]; then transport=memory; else transport=appservice; fi
            echo "== docker compose config --profile ${hs}"
            BOTVILLE_HOMESERVER="${hs}" GATEWAY_MATRIX_TRANSPORT="${transport}" \
              docker compose -f server/compose/docker-compose.yml \
              --env-file server/compose/.env --profile "${hs}" config --quiet
            echo "== docker compose config --profile ${hs} --profile push (A1.2)"
            BOTVILLE_HOMESERVER="${hs}" GATEWAY_MATRIX_TRANSPORT="${transport}" \
              docker compose -f server/compose/docker-compose.yml \
              --env-file server/compose/.env --profile "${hs}" --profile push config --quiet
            echo "== docker compose config --profile ${hs} --profile gateway (A2.2)"
            BOTVILLE_HOMESERVER="${hs}" GATEWAY_MATRIX_TRANSPORT="${transport}" \
              docker compose -f server/compose/docker-compose.yml \
              --env-file server/compose/.env --profile "${hs}" --profile gateway config --quiet
          done
          echo "== docker compose config (federation, A2.1)"
          python3 server/scripts/federation-setup.py
          docker compose -p botville-fed \
            -f server/compose/federation/docker-compose.federation.yml \
            --env-file server/compose/federation/generated/federation.env config --quiet

      - name: Gateway model API key is never printed by compose config --quiet
        run: |
          set -euo pipefail
          # A sentinel (not a real key) stands in for GATEWAY_MODEL_API_KEY;
          # none of the config --quiet runs (every HS x profile combination)
          # may print it. Non-quiet `config` interpolates values and is never
          # used in CI or the docs.
          sentinel="ci-model-key-sentinel-not-a-secret"
          env_copy="$(mktemp)"
          log="$(mktemp)"
          # Remove both temp files on every exit path (failure included).
          trap 'rm -f "${env_copy}" "${log}"' EXIT
          cp server/compose/.env "${env_copy}"
          echo "GATEWAY_MODEL_API_KEY=${sentinel}" >> "${env_copy}"
          for hs in synapse tuwunel continuwuity; do
            for extra in "" "--profile push" "--profile gateway" "--profile push --profile gateway"; do
              # shellcheck disable=SC2086
              docker compose -f server/compose/docker-compose.yml --env-file "${env_copy}" \
                --profile "${hs}" ${extra} config --quiet >> "${log}" 2>&1
            done
          done
          if grep -qF "${sentinel}" "${log}"; then
            echo "::error::compose config --quiet printed GATEWAY_MODEL_API_KEY"
            exit 1
          fi
          echo "GATEWAY_MODEL_API_KEY not printed (12 combinations)"

      - name: .env.example contains placeholders only
        run: |
          python3 - <<'EOF'
          import sys

          path = "server/compose/.env.example"
          # Strict allowlist: KEY plus the only acceptable (non-secret) value.
          # When adding a key here, keep this check in sync.
          allowed = {
              "BOTVILLE_HOMESERVER": "synapse",
              "BOTVILLE_SERVER_NAME": "localhost",
              "BOTVILLE_HTTP_PORT": "8008",
              "BOTVILLE_OPEN_REGISTRATION": "false",
              "BOTVILLE_REGISTRATION_TOKEN": "<change-me>",
              "BOTVILLE_ADMIN_USER": "botville-admin",
              "BOTVILLE_ADMIN_PASSWORD": "<change-me>",
              "BOTVILLE_PUSH_PORT": "8019",
              # APNs placeholders only — real Apple values never ship in the
              # repo (A1.2/#4); init.sh refuses to render the APNs app from
              # these placeholders and hard-fails on malformed present
              # values. See docs/deploy/push-sygnal.md.
              "BOTVILLE_APNS_ENABLED": "false",
              # iOS Bundle ID; APNS_TOPIC defaults to it, APNS_APP_ID to
              # "<bundle-id>.apns" (derived by init.sh, single-app #4).
              "BOTVILLE_APNS_BUNDLE_ID": "<bundle-id>",
              "APNS_APP_ID": "<bundle-id>.apns",
              "APNS_TOPIC": "<bundle-id>",
              "APNS_KEY_ID": "<key-id>",
              "APNS_TEAM_ID": "<team-id>",
              "APNS_PLATFORM": "sandbox",
              # Public push domain for the reverse proxy (docs only).
              "BOTVILLE_PUSH_DOMAIN": "<push-domain>",
              # Issue #128: push.<domain> stays unexposed by default;
              # true only for the optional public reverse-proxy mode.
              "BOTVILLE_PUSH_PUBLIC": "false",
              "COMPOSE_PROJECT_NAME": "botville",
              "BOTVILLE_DOCKER_SUBNET": "172.31.250.0/24",
              # Dynamic-address pool of the compose network; keeps docker's
              # sequential dynamic allocation away from BOTVILLE_SYGNAL_IP.
              "BOTVILLE_DOCKER_IP_RANGE": "172.31.250.64/26",
              # The sygnal container's fixed /32 — the only private range
              # the homeservers may push to (A1.2); must stay in the subnet
              # above and not be its .0/.1/.255.
              "BOTVILLE_SYGNAL_IP": "172.31.250.2",
              # Issue #134: append-only additions to the compose stack's
              # fixed NO_PROXY list (docker-compose.yml x-noproxy-env);
              # empty = defaults only.
              "BOTVILLE_NO_PROXY_EXTRA": "",
              # org.botville.mock test pushkin in generated sygnal.yaml;
              # push-e2e / CI rely on it staying true.
              "BOTVILLE_PUSH_MOCK": "true",
              "POSTGRES_USER": "botville",
              "POSTGRES_PASSWORD": "<change-me>",
              "POSTGRES_DB": "synapse",
              "SYNAPSE_MACAROON_SECRET": "<change-me>",
              "SYNAPSE_FORM_SECRET": "<change-me>",
              "SYNAPSE_REGISTRATION_SHARED_SECRET": "<change-me>",
              # A1.3 appservice tokens (as_token / hs_token); init.sh
              # regenerates empty/<change-me> to 64-hex and refuses anything else.
              "APPSERVICE_AS_TOKEN": "<change-me>",
              "APPSERVICE_HS_TOKEN": "<change-me>",
              # A2.2 gateway service (optional `gateway` profile): loopback
              # host port + secrets init.sh generates (64-hex).
              "BOTVILLE_GATEWAY_PORT": "8020",
              "BOTVILLE_GATEWAY_AUTH_TOKEN": "<change-me>",
              "BOTVILLE_GATEWAY_HMAC_SECRET": "<change-me>",
              # Persona engine pass-through (B line PR2): off / empty by
              # default; init.sh generates none of them (the API key is
              # deployer-supplied and must never ship a value).
              "GATEWAY_CONSUMER_ENABLED": "false",
              "GATEWAY_MODEL_BASE_URL": "",
              "GATEWAY_MODEL_NAME": "",
              "GATEWAY_MODEL_API_KEY": "",
              "GATEWAY_MODEL_TIMEOUT_SECONDS": "30",
              "GATEWAY_PERSONAS_FILE": "",
              # Memory pass-through (B line PR3a): empty path = memory off.
              "GATEWAY_MEMORY_DB_PATH": "",
              "GATEWAY_MEMORY_RETENTION_DAYS": "90",
              "GATEWAY_MEMORY_PURGE_INTERVAL_SECONDS": "86400",
              "POSTGRES_IMAGE": "docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab",
              "SYNAPSE_IMAGE": "docker.io/matrixdotorg/synapse:v1.164.1@sha256:fa4aa980f279bcf26d4e7ecc2a2c9a701c73f2ebe8841da9bdcf3b2fdf693d75",
              "TUWUNEL_IMAGE": "ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec",
              "CONTINUWUITY_IMAGE": "ghcr.io/continuwuity/continuwuity:v26.9.1@sha256:c9c62bc5c0a641f3f713945c701b069c7bc30d2612b54d4a5de80a5be19d5420",
              "SYGNAL_IMAGE": "docker.io/matrixdotorg/sygnal:v0.17.0@sha256:141f5e72fdf99a28e29ca87f3a46c19ed1cf21d5074aa3ef9df7c067e0c1c46a",
          }

          problems = []
          for n, raw in enumerate(open(path, encoding="utf-8"), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              key, sep, value = line.partition("=")
              if not sep or not key:
                  problems.append(f"{path}:{n}: not a KEY=VALUE line: {raw!r}")
              elif key not in allowed:
                  problems.append(f"{path}:{n}: unexpected key {key!r}")
              elif value != allowed[key]:
                  problems.append(
                      f"{path}:{n}: {key} must stay {allowed[key]!r}, found {value!r}"
                  )
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"{path}: OK (placeholders only, no real values)")
          EOF

      - name: Images must be pinned (tag@sha256 digest, no :latest, compose == .env.example)
        run: |
          python3 - <<'EOF'
          import re
          import sys

          # Every image reference must end with ":<tag>@sha256:<64 hex>" where
          # tag is not "latest". See docs/ops/upgrade-images.md for the policy
          # and for the 5 places a pin must be kept in sync — this check
          # guards the compose-defaults ↔ .env.example pair for equality.
          pin_re = re.compile(r":(?P<tag>[^:@\s]+)@sha256:(?P<digest>[0-9a-f]{64})$")

          def strip_inline_comment(text):
              # Drop a trailing " # ..." comment; a '#' inside a value (never
              # valid in an image ref) without preceding whitespace is kept.
              return re.split(r"\s+#", text, maxsplit=1)[0].strip()

          def unquote(value):
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  return value[1:-1]
              return value

          def check(ref, where):
              m = pin_re.search(ref)
              if not m:
                  return [f"{where}: {ref!r} must end with ':<tag>@sha256:<64-hex>'"]
              if m.group("tag").lower() == "latest":
                  return [f"{where}: {ref!r} pins :latest; pin a real tag"]
              return []

          problems = []

          # docker-compose.yml: every service image line — a bare value or the
          # default inside ${VAR:-default}. Quoted values are unwrapped;
          # ${VAR} without a :- default cannot be pinned and is rejected.
          compose = "server/compose/docker-compose.yml"
          compose_defaults = {}
          var_re = re.compile(r"^\$\{([A-Za-z_][A-Za-z0-9_]*):-(.+)\}$")
          for n, raw in enumerate(open(compose, encoding="utf-8"), 1):
              m = re.match(r"\s*image:\s*(.+?)\s*(?:#.*)?$", raw)
              if not m:
                  continue
              ref = unquote(m.group(1).strip())
              v = var_re.match(ref)
              if v:
                  compose_defaults[v.group(1)] = v.group(2)
                  problems += check(v.group(2), f"{compose}:{n}")
              elif ref.startswith("${"):
                  problems.append(f"{compose}:{n}: {ref!r} has no :- default to pin")
              else:
                  problems += check(ref, f"{compose}:{n}")

          # .env.example: every *_IMAGE value — tolerates spaces around '=',
          # quotes, and trailing inline comments.
          env_example = "server/compose/.env.example"
          env_values = {}
          for n, raw in enumerate(open(env_example, encoding="utf-8"), 1):
              line = strip_inline_comment(raw)
              if not line or line.startswith("#"):
                  continue
              key, sep, value = line.partition("=")
              key, value = key.strip(), unquote(value.strip())
              if not sep or not key:
                  problems.append(f"{env_example}:{n}: not a KEY=VALUE line: {raw!r}")
              elif key.endswith("_IMAGE"):
                  env_values[key] = value
                  problems += check(value, f"{env_example}:{n}")

          # Equality guard: compose default and .env.example must carry the
          # exact same pin for every *_IMAGE variable (both directions).
          for key in sorted(set(compose_defaults) | set(env_values)):
              if key not in compose_defaults:
                  problems.append(
                      f"{env_example}: {key} has no matching default in {compose}"
                  )
              elif key not in env_values:
                  problems.append(
                      f"{compose}: {key} default is not mirrored in {env_example}"
                  )
              elif compose_defaults[key] != env_values[key]:
                  problems.append(
                      f"{key}: compose default {compose_defaults[key]!r} != "
                      f".env.example {env_values[key]!r}"
                  )

          # Scope note: this is a format + consistency guard only — it does
          # NOT verify the digest resolves in a registry (no network here).
          # A typo'd digest surfaces in the smoke job, which pulls every
          # image for each profile (all three profiles are required-green).

          # gateway/Dockerfile (A2.2): the gateway service has no image: line
          # (local build), so pin its base image the same way here; the
          # gateway-compose job builds it, which resolves the digest.
          dockerfile = "gateway/Dockerfile"
          froms = []
          for n, raw in enumerate(open(dockerfile, encoding="utf-8"), 1):
              m = re.match(r"\s*FROM\s+(\S+)", raw, re.IGNORECASE)
              if m:
                  froms.append(m.group(1))
                  problems += check(m.group(1), f"{dockerfile}:{n}")
          if not froms:
              problems.append(f"{dockerfile}: no FROM line found")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("image pins OK (tag@sha256 digest, no :latest, compose == .env.example, gateway/Dockerfile FROM)")
          EOF
