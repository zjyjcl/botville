# Botville CI (A0.2).
#
# smoke: boot the Compose stack per homeserver profile and run the
#         standard-library smoke test against 127.0.0.1:8008.
#         All three profiles are required-green; images are pinned
#         (tag@sha256 digest), so failures are real failures.
# backup-restore (A1.1, synapse only): init -> open registration -> up ->
#         e2e seed -> backup -> down -v (wipe volumes) -> up (fresh stack) ->
#         restore -> e2e verify, proving the backup is actually restorable.
# push-e2e (A1.2, all three homeservers): up with the push profile (sygnal +
#         org.botville.mock pushkin), then server/tests/push_e2e.py asserts
#         HS -> sygnal push latency < 5s, an event_id_only payload with no
#         content keys, and the unknown-app_id rejection semantics. The
#         continuwuity leg exercises the same init.sh-rendered denylist; its
#         make up runs the first-boot bootstrap automatically. Real APNs
#         delivery is out of scope (no Apple account); see
#         docs/deploy/push-sygnal.md.
# appservice-e2e (A1.3, synapse + tuwunel): init (renders the appservice
#         registration from .env) -> open registration -> up -> run
#         server/tests/appservice_e2e.py: the real gateway transport
#         registers an @ai_* user, joins an invited room and sends as that
#         identity; exclusive-namespace rejections asserted both ways.
#         continuwuity has no file-based appservice registration yet and is
#         not covered (see docs/deploy/appservice.md).
# app-apple-tests: Swift unit/integration tests on a macOS runner, including
#         Pairing, Push* and ReleaseIsolation. Real-device APNs/NSE delivery
#         still requires manual acceptance; see app-apple/docs/push-device.md.
# federation-e2e (A2.1): the standalone botville-fed compose project boots
#         two Synapse instances (hs-a/hs-b), each behind its own fedgate
#         gate + pairing service (server/pairing, python:3.12-slim with the
#         stdlib-only source bind-mounted). federation_e2e.py proves:
#         unpaired federation denied, pairing enables invite/join/messages
#         both ways, and each side severing cuts traffic in both directions.
#         Certs/configs/tokens are generated at run time (gitignored).
# lint:   compose config for all three profiles (+ the federation stack),
#         shellcheck, python syntax, stdlib unit tests for the bootstrap/
#         init scripts and the pairing package (no Docker),
#         notify/gateway contract validation, a guard that the App pairing-qr
#         fixtures stay a byte-identical copy of
#         docs/contracts/examples/pairing-qr (#128/#132), a guard that
#         .env.example only ever contains placeholders, a guard that no .p8
#         file or PEM private-key header is ever tracked (issue #4), and a
#         guard that every image defaults to tag@sha256 digest (no :latest)
#         identically in compose and .env.example.
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        homeserver: [synapse, tuwunel, continuwuity]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # CI-only: open Synapse registration so the UIA m.login.dummy flow
          # works without email verification. This runs on an ephemeral,
          # loopback-only runner; local defaults stay closed.
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver
        run: make up HS=${{ matrix.homeserver }}

      - name: Smoke test
        run: |
          # Last assignment wins, matching docker compose's --env-file handling.
          token="$(sed -n 's/^BOTVILLE_REGISTRATION_TOKEN=//p' server/compose/.env | tail -n 1)"
          python3 server/tests/smoke.py \
            --base-url http://127.0.0.1:8008 \
            --registration-token "$token"

      - name: Graceful stop right after traffic (issue #91 / #109)
        run: |
          # Stop immediately after smoke: the window in which continuwuity's
          # announcements check used to block shutdown until SIGKILL.
          # Timing alone can false-green on a fast network (#109): the GET to
          # continuwuity.org often finishes in <1s, so the interruptible wait
          # path is already active by the time we stop. Lock the fix itself
          # with a network-free env assertion on the continuwuity profile.
          cid="$(docker compose -f server/compose/docker-compose.yml --env-file server/compose/.env --profile "${{ matrix.homeserver }}" ps -q "${{ matrix.homeserver }}")"
          if [[ "${{ matrix.homeserver }}" == "continuwuity" ]]; then
            env_dump="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid")"
            echo "$env_dump" | grep -Fqx 'CONTINUWUITY_ALLOW_ANNOUNCEMENTS_CHECK=false'
            echo "continuwuity env asserts CONTINUWUITY_ALLOW_ANNOUNCEMENTS_CHECK=false"
          fi
          start=$(date +%s)
          docker stop -t 60 "$cid"
          took=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          echo "stop took ${took}s, exit code ${code}"
          test "$took" -lt 30 && test "$code" != 137

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            down -v --remove-orphans

  backup-restore:
    name: backup-restore (synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and open registration
        run: |
          bash server/scripts/init.sh
          # CI-only: open registration so e2e seed can register users
          # (same escape hatch as the smoke job).
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start stack
        run: make up HS=synapse

      - name: Seed e2e data (alice/bob/carol, DM, group)
        run: make e2e E2E_PHASE=seed

      - name: Backup
        run: |
          set -o pipefail
          bash server/scripts/backup-synapse.sh
          # The script records its target dir in backups/.last-backup; reading
          # it from there (instead of piping to tail) cannot swallow a failure.
          backup_dir="$(cat backups/.last-backup)"
          echo "backup dir: ${backup_dir}"
          echo "RESTORE_DIR=${backup_dir}" >> "$GITHUB_ENV"

      - name: Wipe volumes (simulated disaster)
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile synapse down -v --remove-orphans

      - name: Restart empty stack
        run: make up HS=synapse

      - name: Restore backup
        run: make restore RESTORE_DIR="$RESTORE_DIR"

      - name: Verify e2e data survived
        run: make e2e E2E_PHASE=verify

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile synapse logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile synapse down -v --remove-orphans

  push-e2e:
    name: push-e2e (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        homeserver: [synapse, tuwunel, continuwuity]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # Same CI-only registration escape hatch as the smoke job.
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver + push gateway
        run: make up HS=${{ matrix.homeserver }} PUSH=1

      - name: Push e2e (HS -> sygnal latency < 5s, mock pushkin)
        run: make push-e2e

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            --profile push logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            --profile push down -v --remove-orphans

  appservice-e2e:
    name: appservice-e2e (${{ matrix.homeserver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # continuwuity has no file-based appservice registration yet
        # (admin room only) — not in this matrix; see docs/deploy/appservice.md.
        homeserver: [synapse, tuwunel]
    steps:
      - uses: actions/checkout@v4

      - name: Init .env and select homeserver
        run: |
          bash server/scripts/init.sh
          sed -i "s/^BOTVILLE_HOMESERVER=.*/BOTVILLE_HOMESERVER=${{ matrix.homeserver }}/" server/compose/.env
          # CI-only: open Synapse registration so the UIA m.login.dummy flow
          # works for the human account (tuwunel stays token-gated and reads
          # BOTVILLE_REGISTRATION_TOKEN from .env).
          sed -i "s/^BOTVILLE_OPEN_REGISTRATION=.*/BOTVILLE_OPEN_REGISTRATION=true/" server/compose/.env

      - name: Start homeserver
        run: make up HS=${{ matrix.homeserver }}

      - name: Appservice e2e (gateway sends as an @ai_* user)
        run: make appservice-e2e

      - name: Dump logs
        if: failure()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            logs --no-color

      - name: Teardown
        if: always()
        run: |
          docker compose -f server/compose/docker-compose.yml \
            --env-file server/compose/.env --profile ${{ matrix.homeserver }} \
            down -v --remove-orphans

  federation-e2e:
    name: federation-e2e (synapse x2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Paired-federation e2e (pair, chat, sever both ways)
        run: make federation-e2e

      - name: Dump logs
        if: failure()
        run: |
          if [ -f server/compose/federation/generated/federation.env ]; then
            docker compose -p botville-fed \
              -f server/compose/federation/docker-compose.federation.yml \
              --env-file server/compose/federation/generated/federation.env \
              logs --no-color
          else
            echo "federation.env missing (setup never ran); no logs yet"
          fi

      - name: Teardown
        if: always()
        run: make federation-down

  app-apple-tests:
    name: app-apple-tests
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app-apple
    steps:
      - uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      # Run the full suite so new tests are included automatically. Synapse
      # integration tests skip unless BOTVILLE_E2E_* is explicitly configured.
      # No signing, simulator or real APNs/NSE delivery is exercised here.
      - name: Swift unit and integration tests
        run: swift test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck scripts
        run: |
          shellcheck -x server/scripts/init.sh server/scripts/bootstrap-continuwuity.sh \
            server/scripts/lib.sh server/scripts/backup-synapse.sh server/scripts/restore-synapse.sh \
            server/scripts/federation-certs.sh server/scripts/check_no_secrets.sh \
            scripts/sync-pairing-qr-fixtures.sh

      # The docs examples dir is the single source of truth for the App-side
      # pairing-qr test fixtures; the copy must never drift (#128/#132).
      - name: Pairing QR fixtures in sync (docs == app-apple copy)
        run: bash scripts/sync-pairing-qr-fixtures.sh --check

      - name: Python syntax
        run: |
          python3 -m py_compile server/tests/smoke.py server/tests/e2e_synapse.py \
            server/tests/push_e2e.py server/tests/appservice_e2e.py server/tests/federation_e2e.py \
            server/scripts/render_push_denylist.py server/scripts/federation-setup.py \
            server/pairing/__init__.py server/pairing/store.py server/pairing/service.py \
            server/pairing/fedgate.py server/pairing/validate.py

      - name: Bootstrap/init script unit tests (stdlib mock, no Docker)
        run: python3 -m unittest discover -s server/tests -p "test_*.py" -v

      # Issue #4: no APNs keys (.p8) or PEM private-key headers may ever be
      # tracked; .gitignore must keep ignoring *.p8 and secrets/.
      - name: No tracked private keys (.p8 / PEM headers, issue #4)
        run: bash server/scripts/check_no_secrets.sh

      - name: Pairing package unit tests (stdlib mock, no Docker)
        run: python3 -m unittest discover -s server/pairing/tests -v

      - name: Notify examples + gateway contract validation
        run: |
          python3 notify/scripts/validate_examples.py
          python3 gateway/scripts/validate_openapi.py

      - name: Gateway unit tests
        run: |
          pip install pyyaml
          python3 -m unittest discover -s gateway/tests -v

      - name: Compose config validates for every profile
        run: |
          bash server/scripts/init.sh
          for hs in synapse tuwunel continuwuity; do
            echo "== docker compose config --profile ${hs}"
            docker compose -f server/compose/docker-compose.yml \
              --env-file server/compose/.env --profile "${hs}" config --quiet
            echo "== docker compose config --profile ${hs} --profile push (A1.2)"
            docker compose -f server/compose/docker-compose.yml \
              --env-file server/compose/.env --profile "${hs}" --profile push config --quiet
          done
          echo "== docker compose config (federation, A2.1)"
          python3 server/scripts/federation-setup.py
          docker compose -p botville-fed \
            -f server/compose/federation/docker-compose.federation.yml \
            --env-file server/compose/federation/generated/federation.env config --quiet

      - name: .env.example contains placeholders only
        run: |
          python3 - <<'EOF'
          import sys

          path = "server/compose/.env.example"
          # Strict allowlist: KEY plus the only acceptable (non-secret) value.
          # When adding a key here, keep this check in sync.
          allowed = {
              "BOTVILLE_HOMESERVER": "synapse",
              "BOTVILLE_SERVER_NAME": "localhost",
              "BOTVILLE_HTTP_PORT": "8008",
              "BOTVILLE_OPEN_REGISTRATION": "false",
              "BOTVILLE_REGISTRATION_TOKEN": "<change-me>",
              "BOTVILLE_ADMIN_USER": "botville-admin",
              "BOTVILLE_ADMIN_PASSWORD": "<change-me>",
              "BOTVILLE_PUSH_PORT": "8019",
              # APNs placeholders only — real Apple values never ship in the
              # repo (A1.2/#4); init.sh refuses to render the APNs app from
              # these placeholders and hard-fails on malformed present
              # values. See docs/deploy/push-sygnal.md.
              "BOTVILLE_APNS_ENABLED": "false",
              # iOS Bundle ID; APNS_TOPIC defaults to it, APNS_APP_ID to
              # "<bundle-id>.apns" (derived by init.sh, single-app #4).
              "BOTVILLE_APNS_BUNDLE_ID": "<bundle-id>",
              "APNS_APP_ID": "<bundle-id>.apns",
              "APNS_TOPIC": "<bundle-id>",
              "APNS_KEY_ID": "<key-id>",
              "APNS_TEAM_ID": "<team-id>",
              "APNS_PLATFORM": "sandbox",
              # Public push domain for the reverse proxy (docs only).
              "BOTVILLE_PUSH_DOMAIN": "<push-domain>",
              # Issue #128: push.<domain> stays unexposed by default;
              # true only for the optional public reverse-proxy mode.
              "BOTVILLE_PUSH_PUBLIC": "false",
              "COMPOSE_PROJECT_NAME": "botville",
              "BOTVILLE_DOCKER_SUBNET": "172.31.250.0/24",
              # Dynamic-address pool of the compose network; keeps docker's
              # sequential dynamic allocation away from BOTVILLE_SYGNAL_IP.
              "BOTVILLE_DOCKER_IP_RANGE": "172.31.250.64/26",
              # The sygnal container's fixed /32 — the only private range
              # the homeservers may push to (A1.2); must stay in the subnet
              # above and not be its .0/.1/.255.
              "BOTVILLE_SYGNAL_IP": "172.31.250.2",
              # Issue #134: append-only additions to the compose stack's
              # fixed NO_PROXY list (docker-compose.yml x-noproxy-env);
              # empty = defaults only.
              "BOTVILLE_NO_PROXY_EXTRA": "",
              # org.botville.mock test pushkin in generated sygnal.yaml;
              # push-e2e / CI rely on it staying true.
              "BOTVILLE_PUSH_MOCK": "true",
              "POSTGRES_USER": "botville",
              "POSTGRES_PASSWORD": "<change-me>",
              "POSTGRES_DB": "synapse",
              "SYNAPSE_MACAROON_SECRET": "<change-me>",
              "SYNAPSE_FORM_SECRET": "<change-me>",
              "SYNAPSE_REGISTRATION_SHARED_SECRET": "<change-me>",
              # A1.3 appservice tokens (as_token / hs_token); init.sh
              # regenerates empty/<change-me> to 64-hex and refuses anything else.
              "APPSERVICE_AS_TOKEN": "<change-me>",
              "APPSERVICE_HS_TOKEN": "<change-me>",
              "POSTGRES_IMAGE": "docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab",
              "SYNAPSE_IMAGE": "docker.io/matrixdotorg/synapse:v1.164.1@sha256:fa4aa980f279bcf26d4e7ecc2a2c9a701c73f2ebe8841da9bdcf3b2fdf693d75",
              "TUWUNEL_IMAGE": "ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec",
              "CONTINUWUITY_IMAGE": "ghcr.io/continuwuity/continuwuity:v26.9.1@sha256:c9c62bc5c0a641f3f713945c701b069c7bc30d2612b54d4a5de80a5be19d5420",
              "SYGNAL_IMAGE": "docker.io/matrixdotorg/sygnal:v0.17.0@sha256:141f5e72fdf99a28e29ca87f3a46c19ed1cf21d5074aa3ef9df7c067e0c1c46a",
          }

          problems = []
          for n, raw in enumerate(open(path, encoding="utf-8"), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              key, sep, value = line.partition("=")
              if not sep or not key:
                  problems.append(f"{path}:{n}: not a KEY=VALUE line: {raw!r}")
              elif key not in allowed:
                  problems.append(f"{path}:{n}: unexpected key {key!r}")
              elif value != allowed[key]:
                  problems.append(
                      f"{path}:{n}: {key} must stay {allowed[key]!r}, found {value!r}"
                  )
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"{path}: OK (placeholders only, no real values)")
          EOF

      - name: Images must be pinned (tag@sha256 digest, no :latest, compose == .env.example)
        run: |
          python3 - <<'EOF'
          import re
          import sys

          # Every image reference must end with ":<tag>@sha256:<64 hex>" where
          # tag is not "latest". See docs/ops/upgrade-images.md for the policy
          # and for the 5 places a pin must be kept in sync — this check
          # guards the compose-defaults ↔ .env.example pair for equality.
          pin_re = re.compile(r":(?P<tag>[^:@\s]+)@sha256:(?P<digest>[0-9a-f]{64})$")

          def strip_inline_comment(text):
              # Drop a trailing " # ..." comment; a '#' inside a value (never
              # valid in an image ref) without preceding whitespace is kept.
              return re.split(r"\s+#", text, maxsplit=1)[0].strip()

          def unquote(value):
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  return value[1:-1]
              return value

          def check(ref, where):
              m = pin_re.search(ref)
              if not m:
                  return [f"{where}: {ref!r} must end with ':<tag>@sha256:<64-hex>'"]
              if m.group("tag").lower() == "latest":
                  return [f"{where}: {ref!r} pins :latest; pin a real tag"]
              return []

          problems = []

          # docker-compose.yml: every service image line — a bare value or the
          # default inside ${VAR:-default}. Quoted values are unwrapped;
          # ${VAR} without a :- default cannot be pinned and is rejected.
          compose = "server/compose/docker-compose.yml"
          compose_defaults = {}
          var_re = re.compile(r"^\$\{([A-Za-z_][A-Za-z0-9_]*):-(.+)\}$")
          for n, raw in enumerate(open(compose, encoding="utf-8"), 1):
              m = re.match(r"\s*image:\s*(.+?)\s*(?:#.*)?$", raw)
              if not m:
                  continue
              ref = unquote(m.group(1).strip())
              v = var_re.match(ref)
              if v:
                  compose_defaults[v.group(1)] = v.group(2)
                  problems += check(v.group(2), f"{compose}:{n}")
              elif ref.startswith("${"):
                  problems.append(f"{compose}:{n}: {ref!r} has no :- default to pin")
              else:
                  problems += check(ref, f"{compose}:{n}")

          # .env.example: every *_IMAGE value — tolerates spaces around '=',
          # quotes, and trailing inline comments.
          env_example = "server/compose/.env.example"
          env_values = {}
          for n, raw in enumerate(open(env_example, encoding="utf-8"), 1):
              line = strip_inline_comment(raw)
              if not line or line.startswith("#"):
                  continue
              key, sep, value = line.partition("=")
              key, value = key.strip(), unquote(value.strip())
              if not sep or not key:
                  problems.append(f"{env_example}:{n}: not a KEY=VALUE line: {raw!r}")
              elif key.endswith("_IMAGE"):
                  env_values[key] = value
                  problems += check(value, f"{env_example}:{n}")

          # Equality guard: compose default and .env.example must carry the
          # exact same pin for every *_IMAGE variable (both directions).
          for key in sorted(set(compose_defaults) | set(env_values)):
              if key not in compose_defaults:
                  problems.append(
                      f"{env_example}: {key} has no matching default in {compose}"
                  )
              elif key not in env_values:
                  problems.append(
                      f"{compose}: {key} default is not mirrored in {env_example}"
                  )
              elif compose_defaults[key] != env_values[key]:
                  problems.append(
                      f"{key}: compose default {compose_defaults[key]!r} != "
                      f".env.example {env_values[key]!r}"
                  )

          # Scope note: this is a format + consistency guard only — it does
          # NOT verify the digest resolves in a registry (no network here).
          # A typo'd digest surfaces in the smoke job, which pulls every
          # image for each profile (all three profiles are required-green).
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("image pins OK (tag@sha256 digest, no :latest, compose == .env.example)")
          EOF
