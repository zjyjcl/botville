# Botville homeserver stack (A0.2).
#
# Exactly one homeserver profile is active at a time:
#   docker compose --profile synapse | --profile tuwunel | --profile continuwuity
# `make up` / `make up HS=tuwunel` in the repo root wraps this (see Makefile).
#
# Ports are bound to 127.0.0.1 only; expose via a reverse proxy when needed.
# All homeserver-profile images plus the optional sygnal push gateway (five
# total) are pinned by default to tag@sha256:<multi-arch index digest>; the
# upgrade flow lives in docs/ops/upgrade-images.md. They can be overridden via
# POSTGRES_IMAGE / SYNAPSE_IMAGE / TUWUNEL_IMAGE / CONTINUWUITY_IMAGE /
# SYGNAL_IMAGE in server/compose/.env — e.g. to :latest to track upstream,
# which works but is not recommended (not reproducible).
#
# The `push` profile (sygnal, A1.2) stacks onto any homeserver profile:
#   make up PUSH=1   /   make up HS=tuwunel PUSH=1
# It is the only cross-stack profile; see docs/deploy/push-sygnal.md.
#
# Readiness:
#   - postgres, synapse: container healthchecks.
#   - sygnal: container healthcheck probing /health with the image's python
#     (the runtime image has no curl, so its built-in curl HEALTHCHECK goes
#     unhealthy; see the sygnal service below).
#   - tuwunel, continuwuity: their OCI images are OS-less (no shell, no curl),
#     so no in-container healthcheck is possible; server/tests/smoke.py waits
#     for GET /_matrix/client/versions instead.
# Images are pinned (continuwuity by digest); override via .env to test a
# different build.

name: botville

services:
  postgres:
    # Pinned tag@digest by default; override via POSTGRES_IMAGE.
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab}
    profiles: [synapse]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botville}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in server/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botville} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  synapse:
    # Pinned tag@digest, kept in sync with the reference version tracked in
    # docs/compat/homeserver-compat.md §1.2 (matrix-docker-ansible-deploy
    # defaults); upgrade flow in docs/ops/upgrade-images.md.
    image: ${SYNAPSE_IMAGE:-docker.io/matrixdotorg/synapse:v1.164.1@sha256:fa4aa980f279bcf26d4e7ecc2a2c9a701c73f2ebe8841da9bdcf3b2fdf693d75}
    profiles: [synapse]
    # homeserver.yaml is rendered from synapse/homeserver.yaml.tmpl by
    # server/scripts/init.sh into ./generated/synapse/ (gitignored).
    entrypoint:
      - sh
      - -c
      - >-
        python -m synapse.app.homeserver --config-path /config/homeserver.yaml
        --generate-keys --keys-directory /data &&
        exec python -m synapse.app.homeserver --config-path /config/homeserver.yaml
        --keys-directory /data
    ports:
      - "127.0.0.1:${BOTVILLE_HTTP_PORT:-8008}:8008"
    volumes:
      - ./generated/synapse:/config:ro
      # Appservice registrations (A1.3) — rendered by init.sh, listed in
      # homeserver.yaml.tmpl's app_service_config_files. The container runs
      # as root, so it can read the 0600 file.
      - ./generated/appservice:/appservice:ro
      - synapse-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health is always served on the client listener (synapse >= 1.63).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  tuwunel:
    # Pinned tag@digest; registry also mirrored at docker.io/jevolk/tuwunel.
    image: ${TUWUNEL_IMAGE:-ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec}
    profiles: [tuwunel]
    # First boot after an upgrade runs RocksDB migrations that must not be
    # interrupted; upstream recommends a long stop grace period.
    stop_grace_period: 10m
    environment:
      TUWUNEL_SERVER_NAME: ${BOTVILLE_SERVER_NAME:-localhost}
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: "8008"
      # Registration stays token-gated even when open; token comes from .env.
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: ${BOTVILLE_REGISTRATION_TOKEN:?set in server/compose/.env}
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_TRUSTED_SERVERS: "[]"
      # File-based appservice registration (A1.3): same YAML format as
      # Synapse; changes require a container restart (no hot reload).
      TUWUNEL_APPSERVICE_DIR: /appservice
    # TUWUNEL_IP_RANGE_DENYLIST: full upstream default private-range denylist
    # minus the sygnal container's /32 (BOTVILLE_SYGNAL_IP), rendered by
    # init.sh so pushes reach sygnal and nothing else. required: false keeps
    # `docker compose config` working on a checkout that has not run init.sh
    # (the generated file is gitignored).
    env_file:
      - path: ./generated/push-denylist.env
        required: false
    ports:
      - "127.0.0.1:${BOTVILLE_HTTP_PORT:-8008}:8008"
    volumes:
      # Rendered by init.sh; carries the as_token (0600, readable by root).
      - ./generated/appservice:/appservice:ro
      - tuwunel-data:/var/lib/tuwunel
    restart: unless-stopped

  sygnal:
    # Sygnal push gateway (A1.2), `push` profile — stacks onto any homeserver
    # profile via `make up HS=<hs> PUSH=1`. Pinned tag@digest like the rest;
    # override via SYGNAL_IMAGE. Homeservers reach it inside the compose
    # network at http://sygnal:5000 (pusher data.url); the host mapping below
    # is a loopback-only convenience for poking /_matrix/push/v1/notify.
    image: ${SYGNAL_IMAGE:-docker.io/matrixdotorg/sygnal:v0.17.0@sha256:141f5e72fdf99a28e29ca87f3a46c19ed1cf21d5074aa3ef9df7c067e0c1c46a}
    profiles: [push]
    environment:
      # Rendered from sygnal/sygnal.yaml.tmpl by server/scripts/init.sh into
      # ./generated/sygnal/ (gitignored); SYGNAL_CONF is how the image locates
      # its config.
      SYGNAL_CONF: /config/sygnal.yaml
      # Makes the mock pushkin (bind-mounted below at /custom) importable for
      # type: botville_mock_pushkin.MockPushkin in the app config.
      PYTHONPATH: /custom
    ports:
      - "127.0.0.1:${BOTVILLE_PUSH_PORT:-8019}:5000"
    networks:
      default:
        # Fixed address: the homeservers' push allow (Synapse
        # ip_range_whitelist / denylist carve-out, rendered by init.sh) covers
        # exactly this /32 — the network's .2 by convention. The :- value is
        # only the fallback for `docker compose config` on a checkout where
        # init.sh has not rendered .env yet; `make up` always renders .env
        # (which carries the real value) first.
        ipv4_address: ${BOTVILLE_SYGNAL_IP:-172.31.250.2}
    volumes:
      - ./generated/sygnal:/config:ro
      - ./sygnal:/custom:ro
        # Scratch dir for the mock pushkin's JSONL; a bind mount (created 0755
        # by init.sh — the image runs as root) rather than a named volume so
        # the file stays readable from the host.
      - ./generated/sygnal-data:/data
      # Real APNs key goes here (secrets/, created 0700 by init.sh; apns.p8
      # mode 600, gitignored); mounted read-only. With no key, only the mock
      # app is configured.
      - ./secrets:/secrets:ro
    healthcheck:
      # The image's own HEALTHCHECK shells out to curl, but the runtime image
      # has no curl, so the container would go unhealthy ~70s in; probe
      # /health with the python that is there. push_e2e.py's unknown-app_id
      # rejection probe remains the functional readiness check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  continuwuity:
    # Pinned to the digest CI actually tests (docs/compat/homeserver-compat.md
    # §3.3); the image is FROM scratch with CMD /sbin/conduwuit, so no command
    # override is needed.
    image: ${CONTINUWUITY_IMAGE:-ghcr.io/continuwuity/continuwuity:v26.9.1@sha256:c9c62bc5c0a641f3f713945c701b069c7bc30d2612b54d4a5de80a5be19d5420}
    profiles: [continuwuity]
    stop_grace_period: 10m
    environment:
      CONTINUWUITY_SERVER_NAME: ${BOTVILLE_SERVER_NAME:-localhost}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: "8008"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${BOTVILLE_REGISTRATION_TOKEN:?set in server/compose/.env}
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_TRUSTED_SERVERS: "[]"
    # CONTINUWUITY_IP_RANGE_DENYLIST: full upstream default private-range
    # denylist minus the sygnal container's /32 (BOTVILLE_SYGNAL_IP),
    # rendered by init.sh so pushes reach sygnal and nothing else.
    # required: false — see the tuwunel service.
    env_file:
      - path: ./generated/push-denylist.env
        required: false
    ports:
      - "127.0.0.1:${BOTVILLE_HTTP_PORT:-8008}:8008"
    volumes:
      - continuwuity-data:/var/lib/continuwuity
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # The dynamic pool (ip_range) keeps docker's sequential dynamic
        # allocation (.2, .3, ...) away from the sygnal container's fixed
        # address below; without it whichever container starts first would
        # take .2 and the other would fail with "address already in use".
        # init.sh (render_push_denylist.py) validates subnet/range/IP.
        - subnet: ${BOTVILLE_DOCKER_SUBNET:-172.31.250.0/24}
          ip_range: ${BOTVILLE_DOCKER_IP_RANGE:-172.31.250.64/26}

volumes:
  postgres-data:
  synapse-data:
  tuwunel-data:
  continuwuity-data:
